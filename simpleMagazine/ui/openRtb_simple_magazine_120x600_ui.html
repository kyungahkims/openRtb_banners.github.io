<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>구글RTB 배너</title>
	<style>
		/* 1. 웹 폰트 */
		@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");

		/* 2. 배너 & 이미지 규격 */
		:root {
			--width: 120px;
			--height: 600px;
			--active-banner-height: 200px;
		}

		/* 3. 공통사항 */
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		.mobonLogo {
			position: absolute;
			top: 2px;
			right: 2px;
			width: 11px;
			height: 11px;
			background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo02.png') center center;
			background-size: 11px 11px;
			opacity: 0.8;
			z-index: 1001;
			cursor: pointer;
		}

		.mobonLogo:hover {
			width: 73px;
			height: 15px;
			background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo_over02.png') center center;
			background-size: 73px 15px;
		}

		/* 4. 해당 사이즈 배너 */
		.mobon_reset {
			position: relative;
			width: var(--width);
			height: var(--height);
			font-family: "pretendard";
			display: flex;
			flex-direction: column;
			background-color: #f4f5f7;
			overflow: hidden;
		}

		.shop_logo {
			display: flex;
			justify-content: center;
			align-items: center;
			height: 50px;
			border-bottom: 2px solid #111;
			background-color: #fff;
			padding: 5px 16px;
			cursor: pointer;
		}

		.shop_logo img {
			max-width: 100%;
			height: auto;
		}

		.mobon_banner_wrap {
			display: flex;
			flex-direction: column;
			flex: 1;
			gap: 4px;
			min-height: 0;
			padding: 4px;
		}

		.mobon_banner_wrap .mobon_banner {
			position: relative;
			display: flex;
			flex-direction: column;
			flex: 1 1 0%;
			border: 1px solid #e0e0e0;
			background-color: #fff;
			transition: flex 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), border 0.3s;
			overflow: hidden;
			cursor: pointer;
			box-shadow: rgba(0, 0, 0, 0.4) 0px 2px 4px;
		}

		.mobon_banner_wrap .mobon_banner.active {
			flex: 0 0 var(--active-banner-height);
			border: 2px solid #ff2a2a;
		}

		.badge {
			display: none;
			position: absolute;
			top: 0;
			left: 0;
			font-size: 10px;
			font-weight: 700;
			color: #fff;
			background-color: #f23e2e;
			padding: 2px 4px;
			z-index: 2;
		}

		.mobon_banner_wrap .mobon_banner.active .badge {
			display: block;
		}

		.slider_wrap {
			flex: 1 1 auto;
			width: 100%;
			min-height: 0;
			overflow: hidden;
		}

		.img {
			width: 100%;
			height: 100%;
			object-fit: cover;
			object-position: center;
		}

		.img.is-panning {
			object-position: left top;
			animation: panImage 5s ease-in-out infinite alternate;
		}

		@keyframes panImage {
			0% {
				object-position: left top;
			}

			100% {
				object-position: right bottom;
			}
		}

		.bg {
			display: flex;
			flex-direction: column;
			flex-shrink: 0;
			height: 0;
			opacity: 0;
			padding: 0;
			overflow: hidden;
		}

		.mobon_banner_wrap .mobon_banner.active .bg {
			height: auto;
			opacity: 1;
			padding: 8px 5px;
		}

		.pnm {
			font-size: 13px;
			font-weight: 400;
			color: #201e1d;
			white-space: nowrap;
			text-overflow: ellipsis;
			overflow: hidden;
			margin-bottom: 5px;
		}

		.price_box {
			display: flex;
			align-items: baseline;
			gap: 3px;
		}

		.sale .sale_rate,
		.sale .sale_price {
			display: block;
		}

		.sale .original_price {
			display: none;
		}

		.sale_rate {
			display: none;
			font-size: 10px;
			font-weight: bold;
			color: #ff2a2a;
		}

		.sale_price {
			display: none;
			font-size: 11px;
			font-weight: 600;
			color: #000;
		}

		.original_price {
			display: block;
			font-size: 11px;
			font-weight: 600;
			color: #000;
		}
	</style>
</head>

<body>
	<div class="mobon_reset">
		<div class="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>

		<div class="shop_logo"><img src="https://manage.mobon.net/ad/imgfile//20240125140913-H2Gm0AL5jB-logo.png" alt="로고">
		</div>

		<div class="mobon_banner_wrap">
			<!-- JS 동적 생성 -->
		</div>
	</div>

	<script>
		document.addEventListener('DOMContentLoaded', () => {
			const mobonBannerWrap = document.querySelector('.mobon_banner_wrap');
			const mobonReset = document.querySelector('.mobon_reset');

			// 테스트용 상품 데이터
			const allProducts = [{
					img: "https://cafe24img.poxo.com/dabainsang/web/product/small/202607/e623213db5bca94aa297685e252f0857.webp",
					pnm: "[핫딜] 쿨링 썸머 카라넥 원피스",
					dc_rate: "40",
					prdt_prmct: "9,989,900",
					price: "58,000",
					purl: "javascript:void(0)"
				},
				{
					img: "https://cafe24img.poxo.com/dabainsang/web/product/small/202607/34d5572c55d7962dc09e3688c031d90e.jpg",
					pnm: "베이직 라운드 반팔 티셔츠",
					dc_rate: "15",
					prdt_prmct: "15,900",
					price: "19,000",
					purl: "javascript:void(0)"
				},
				{
					img: "https://cafe24img.poxo.com/dabainsang/web/product/small/202607/228785c2d74d7238046842d7afaab05b.webp",
					pnm: "와이드 핏 데님 팬츠",
					dc_rate: "20",
					prdt_prmct: "29,900",
					price: "38,000",
					purl: "javascript:void(0)"
				},
				{
					img: "https://cafe24img.poxo.com/dabainsang/web/product/small/202605/4d1d0b5a8cb9825defe09be105af08cb.jpg",
					pnm: "여름 린넨 밴딩 쇼츠",
					dc_rate: "",
					prdt_prmct: "",
					price: "28,000",
					purl: "javascript:void(0)"
				}
			];


			if (allProducts.length > 4) allProducts.length = 4;
			// 카드 요소 생성
			mobonBannerWrap.innerHTML = (function(){
				const urlParams = new URLSearchParams(window.location.search);
				const itemsCount = urlParams.get('items');
				if(itemsCount) {
					allProducts.length = Math.min(allProducts.length, parseInt(itemsCount, 10));
				}
				return allProducts;
			})().map((item, index) => {
				const isSale = item.prdt_prmct ? "sale" : "";
				let priceText = `${item.price}원`;

				return `
					<div class="mobon_banner ${index === 0 ? 'active' : ''}" data-index="${index}">
						<div class="badge">핫템</div>
						<div class="slider_wrap">
							<img class="img" src="${item.img}" alt="${item.pnm}">
						</div>
						<div class="bg">
							<p class="pnm">${item.pnm}</p>
							<div class="price_box ${isSale}">
								${item.dc_rate ? `<div class="sale_rate">${item.dc_rate}<span>%</span></div>` : ''}
								${item.prdt_prmct ? `<div class="sale_price">${item.prdt_prmct}원</div>` : ''}
								<div class="original_price">${priceText}</div>
							</div>
						</div>
					</div>
				`;
			}).join('');

			const mobonBanners = document.querySelectorAll('.mobon_banner_wrap .mobon_banner');
			const totalCards = mobonBanners.length;
			if (totalCards <= 1) {
				const activeBanner = document.querySelector('.mobon_banner.active');
				if (activeBanner) {
					activeBanner.style.flex = '0 0 100%';
				}
			}
			let currentIndex = 0;
			let intervalId;

			const checkPanning = (img) => {
				const wrap = img.parentElement;
				if (!wrap.clientWidth || !wrap.clientHeight) return;

				const wrapRatio = wrap.clientWidth / wrap.clientHeight;
				const imgRatio = img.naturalWidth / img.naturalHeight;

				const overflowPx = imgRatio > wrapRatio ?
					(wrap.clientHeight * imgRatio) - wrap.clientWidth :
					(wrap.clientWidth / imgRatio) - wrap.clientHeight;

				const overflowRatio = imgRatio > wrapRatio ?
					overflowPx / wrap.clientWidth :
					overflowPx / wrap.clientHeight;

				if (overflowRatio > 0.3) {
					img.classList.add('is-panning');
					img.style.animationDuration = overflowPx <= 40 ? '3s' : '5s';
				} else {
					img.classList.remove('is-panning');
					img.style.animationDuration = '';
				}
			};

			function updatePanningForAll() {
				mobonBanners.forEach(card => {
					const img = card.querySelector('.img');
					if (img.complete && img.naturalWidth > 0) {
						checkPanning(img);
					}
				});
			}

			function showCard(index) {
				mobonBanners.forEach((card, i) => {
					if (i === index) {
						card.classList.add('active');
					} else {
						card.classList.remove('active');
					}
				});

				// CSS transition 완료 후 크기가 변경되었을 때 패닝 재계산
				setTimeout(updatePanningForAll, 350);
			}

			function nextCard() {
				currentIndex = (currentIndex + 1) % totalCards;
				showCard(currentIndex);
			}

			function startSlider() {
				if (totalCards <= 1) return;
				stopSlider();
				intervalId = setInterval(nextCard, 3000);
			}

			function stopSlider() {
				clearInterval(intervalId);
			}

			// 카드 이벤트 바인딩
			let hoverTimeout;
			mobonBanners.forEach(card => {
				const img = card.querySelector('.img');
				img.addEventListener('load', () => checkPanning(img), {
					once: true
				});

				card.addEventListener('mouseenter', () => {
					clearTimeout(hoverTimeout);
					hoverTimeout = setTimeout(() => {
						currentIndex = parseInt(card.getAttribute('data-index'));
						showCard(currentIndex);
					}, 150);
				});

				card.addEventListener('mouseleave', () => {
					clearTimeout(hoverTimeout);
				});

				card.addEventListener('click', (e) => {
					e.stopPropagation();
					const index = parseInt(card.getAttribute('data-index'));
					const purl = allProducts[index].purl;
					if (purl && purl !== "javascript:void(0)") {
						window.open(purl, '_blank');
					}
				});
			});

			mobonReset.addEventListener('mouseenter', stopSlider);
			mobonReset.addEventListener('mouseleave', startSlider);


			const shopLogo = document.querySelector('.shop_logo');
			if (shopLogo) {
				shopLogo.style.cursor = 'pointer';
				shopLogo.addEventListener('click', (e) => {
					e.stopPropagation();
					const purl = allProducts[currentIndex].purl;
					if (purl && purl !== "javascript:void(0)") {
						window.open(purl, '_blank');
					}
				});
			}

			// 초기화
			updatePanningForAll();
			startSlider();
		});
	</script>
</body>

</html>
