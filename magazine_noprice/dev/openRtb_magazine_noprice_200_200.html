<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>구글RTB 배너 (가격 없음)</title>
	<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
	<script>
		window.__mobonProducts = [{{productList}}];
		window.__mobonPreload = (() => {
			try {
				const first = window.__mobonProducts[0];
				if (!first || !first.img) return;
				const link = document.createElement('link');
				link.rel = 'preload';
				link.as = 'image';
				link.href = first.img;
				link.fetchPriority = 'high';
				document.head.appendChild(link);
			} catch (e) {}
		})();
	</script>
	<style>
		/* 1. 웹 폰트 head 에서 비동기 로드 */

		/* 2. 배너 & 이미지 규격 */
		:root {
			--width: 200px;
			--height: 200px;
		}

		/* 3. 공통사항 */
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		.mobonLogo {
			position: absolute;
			top: 2px;
			right: 2px;
			width: 11px;
			height: 11px;
			background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo02.png') center center;
			background-size: 11px 11px;
			opacity: 0.8;
			z-index: 1001;
			cursor: pointer;
		}

		.mobonLogo:hover {
			width: 73px;
			height: 15px;
			background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo_over02.png') center center;
			background-size: 73px 15px;
		}

		/* 4. 해당 사이즈 배너 */
		.mobon_reset {
			position: relative;
			width: var(--width);
			height: var(--height);
			font-family: "pretendard", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
			overflow: hidden;
		}

		.mobon_banner {
			display: flex;
			width: 100%;
			height: 100%;
			background-color: #fff;
			cursor: pointer;
		}

		.slider_wrap {
			position: relative;
			flex-shrink: 0;
			width: 90px;
			height: 100%;
			overflow: hidden;
		}

		.img {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			object-fit: cover;
			object-position: center;
			opacity: 0;
			transition: opacity 0.5s ease;
		}

		.img.active {
			opacity: 1;
		}

		.img.is-panning {
			object-position: left top;
			animation: panImage 5s ease-in-out infinite alternate;
		}

		@keyframes panImage {
			0% {
				object-position: left top;
			}

			100% {
				object-position: right bottom;
			}
		}

		.bg {
			position: relative;
			display: flex;
			flex-direction: column;
			flex: 1;
			min-width: 0;
			padding: 8px 8px 16px;
			z-index: 1;
		}

		.shop_logo {
			max-width: 80%;
			max-height: 40px;
		}

		.shop_logo img {
			max-width: 100%;
			max-height: 100%;
			cursor: pointer;
		}

		.pnm {
			font-size: 13px;
			font-weight: 400;
			line-height: 1.4;
			letter-spacing: -0.5px;
			color: #201e1d;
			word-break: keep-all;
			overflow-wrap: break-word;
			display: -webkit-box;
			-webkit-line-clamp: 2;
			-webkit-box-orient: vertical;
			overflow: hidden;
			margin-top: 4px;
		}

		.slider_controls {
			display: flex;
			align-items: center;
			justify-content: space-between;
			margin-top: auto;
			padding-bottom: 12px;
		}

		.slider_btns {
			display: flex;
			gap: 4px;
		}

		.slider_btn {
			display: flex;
			align-items: center;
			justify-content: center;
			width: 14px;
			height: 14px;
			color: #201e1d;
			border: 1px solid #201e1d;
			background-color: #fff;
			transition: all 0.2s ease;
			cursor: pointer;
		}

		.slider_btn:hover {
			color: #fff;
			background-color: #201e1d;
		}

		.slider_pagination {
			font-size: 10px;
			letter-spacing: 0.5px;
			color: #666;
		}


		/* 5. 가격 없음: 배지(비밀특가/SNS핫템) CTA */
		.badge .b_sale {
			display: none;
		}

		.badge.sale .b_sale {
			display: inline;
		}

		.badge.sale .b_default {
			display: none;
		}

		.badge_inline {
			display: none;
			flex-shrink: 0;
			white-space: nowrap;
		}

		.cta {
			display: inline-flex;
			align-items: center;
			gap: 3px;
			white-space: nowrap;
			color: #000;
			transition: all 0.2s ease;
		}

		.cta .arrow {
			flex-shrink: 0;
		}

		.badge_txt {
			display: block;
			align-self: flex-start;
			margin-top: 8px;
			font-size: 10px;
			font-weight: 700;
			letter-spacing: 0.3px;
			color: #ff2a2a;
		}

		.pnm {
			margin-top: 3px;
		}

		.cta_box {
			display: flex;
			align-items: center;
			gap: 6px;
			border-top: 1px solid #ddd;
			padding-top: 8px;
		}

		.cta {
			font-size: 12px;
			font-weight: 600;
			letter-spacing: -0.5px;
		}

		/* 대체 배너 */
		.fallback_banner {
			display: none;
			position: relative;
			width: 100%;
			height: 100%;
			overflow: hidden;
		}

		.fallback_link {
			display: block;
			width: 100%;
			height: 100%;
			cursor: pointer;
		}

		.fallback_banner img {
			width: 100%;
			height: 100%;
			object-fit: contain;
			background-position: center center;
		}
	</style>
</head>

<body>
	<div class="mobon_reset" id="noHiddenMobon">
		<div class="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
		<div class="mobon_banner">
			<div class="slider_wrap">
			</div>

			<div class="bg">
				<div class="shop_logo">
					<img src="{{logo}}" alt="로고" onerror="this.onerror=null; this.src='{{HTTP}}/rtb/images/mobon.jpg'">
				</div>
				<span class="badge badge_txt"><span class="b_default">SNS핫템</span><span class="b_sale">비밀특가</span></span>
				<p class="pnm"></p>

				<div class="slider_controls">
					<div class="slider_btns">
						<button type="button" class="slider_btn prev_btn">
							<svg width="8" height="102" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
								stroke-linecap="round" stroke-linejoin="round">
								<polyline points="15 18 9 12 15 6"></polyline>
							</svg>
						</button>
						<button type="button" class="slider_btn next_btn">
							<svg width="8" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
								stroke-linecap="round" stroke-linejoin="round">
								<polyline points="9 18 15 12 9 6"></polyline>
							</svg>
						</button>
					</div>
					<div class="slider_pagination"><span class="current_idx">1</span> / <span class="total_idx">4</span>
					</div>
				</div>

				<div class="cta_box">
					<span class="badge badge_inline"><span class="b_default">SNS핫템</span><span class="b_sale">비밀특가</span></span>
					<span class="cta"><span class="cta_txt">지금 구매 찬스</span><svg class="arrow" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg></span>
				</div>
			</div>
		</div>
	</div>


	<!-- 노출 추적 태그 -->
	{{wp_imgtag}}

	<!-- 대체 배너 영역 -->
	<div class="fallback_banner" id="hiddenMobon">
		<div class="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
		<div class="fallback_link" onclick="window.open('https://mobon.net/bridge/')">
			<img src="{{HTTP}}/servlet/image/mobon/200x200.png" alt="대체배너">
		</div>
	</div>

	<script>
		(() => {
			const frameWidth = {{w}};
			const frameHeight = {{h}};
			const mainBanner = document.getElementById('noHiddenMobon');
			const fallbackBanner = document.getElementById('hiddenMobon');
			const sliderWrap = document.querySelector('.slider_wrap');
			const prevBtn = document.querySelector('.prev_btn');
			const nextBtn = document.querySelector('.next_btn');
			const currentIdxEl = document.querySelector('.current_idx');
			const totalIdxEl = document.querySelector('.total_idx');
			const pnmEl = document.querySelector('.pnm');
			const ctaBoxEl = document.querySelector('.cta_box');
			const badgeEls = document.querySelectorAll('.badge');
			const allProducts = window.__mobonProducts;
			const imageHtml = allProducts.map((item, index) => {
				const activeClass = index === 0 ? 'active' : '';
				const srcAttr = index === 0 ?
					`src="${item.img}" fetchpriority="high"` :
					`data-src="${item.img}"`;
				return `<img class="img ${activeClass}" ${srcAttr} decoding="async" data-pcode="${item.pcode}" alt="${item.pnm}">`;
			}).join('');

			sliderWrap.innerHTML = imageHtml;

			const images = document.querySelectorAll('.slider_wrap .img');

			const loadRestImages = () => {
				images.forEach(img => {
					if (img.dataset.src) {
						img.src = img.dataset.src;
						delete img.dataset.src;
					}
				});
			};

			if (images[0]) {
				if (images[0].complete) {
					loadRestImages();
				} else {
					images[0].addEventListener('load', loadRestImages, { once: true });
					images[0].addEventListener('error', loadRestImages, { once: true });
				}
			}

			const handleImageErrors = () => {
				let isFallbackTriggered = false;
				const handleImageError = (event) => {
					if (isFallbackTriggered) return;
					isFallbackTriggered = true;
					const pcode = event.target.dataset.pcode || '';
					if (mainBanner) mainBanner.style.display = 'none';
					if (fallbackBanner) {
						fallbackBanner.style.display = 'block';
						fallbackBanner.style.width = `${frameWidth}px`;
						fallbackBanner.style.height = `${frameHeight}px`;
					}
					const errorUrl =
						`{{HTTP_DR}}/rtbShop?uid=${encodeURIComponent("{{UUID}}")}&u={{USER}}&pc=${pcode}&itlTpCode={{ITL_TP_CODE}}`;
					(new Image()).src = errorUrl;
				};
				images.forEach(img => {
					if (img.getAttribute('src') && img.complete && img.naturalHeight === 0) {
						handleImageError({
							target: img
						});
					} else {
						img.addEventListener('error', handleImageError);
					}
				});
			};
			handleImageErrors();


			const sliderControls = document.querySelector('.slider_controls');
			let currentIndex = 0;
			const totalImages = images.length;
			let intervalId;

			totalIdxEl.textContent = totalImages;

			if (totalImages <= 1) {
				sliderControls.style.display = 'none';
				ctaBoxEl.style.marginTop = 'auto';
			}

			const checkPanning = (img) => {
				const wrap = img.parentElement;
				if (!wrap.clientWidth || !wrap.clientHeight) return;

				const wrapRatio = wrap.clientWidth / wrap.clientHeight;
				const imgRatio = img.naturalWidth / img.naturalHeight;

				const overflowPx = imgRatio > wrapRatio ?
					(wrap.clientHeight * imgRatio) - wrap.clientWidth :
					(wrap.clientWidth / imgRatio) - wrap.clientHeight;

				const overflowRatio = imgRatio > wrapRatio ?
					overflowPx / wrap.clientWidth :
					overflowPx / wrap.clientHeight;

				if (overflowRatio > 0.3) {
					img.classList.add('is-panning');
					img.style.animationDuration = overflowPx <= 40 ? '3s' : '5s';
				} else {
					img.classList.remove('is-panning');
					img.style.animationDuration = '';
				}
			};

			function showImage(index) {
				images.forEach(img => img.classList.remove('active'));
				if (images[index]) {
					images[index].classList.add('active');

					if (images[index].complete && images[index].naturalWidth > 0) {
						checkPanning(images[index]);
					} else {
						images[index].addEventListener('load', () => checkPanning(images[index]), {
							once: true
						});
					}
				}
				currentIdxEl.textContent = index + 1;

				const product = allProducts[index];
				if (product) {
					pnmEl.textContent = product.pnm;

					const isSale = !!product.prdt_prmct;
					ctaBoxEl.classList.toggle('sale', isSale);
					badgeEls.forEach(b => b.classList.toggle('sale', isSale));
				}
			}

			function nextImage() {
				currentIndex = (currentIndex + 1) % totalImages;
				showImage(currentIndex);
			}

			function prevImage() {
				currentIndex = (currentIndex - 1 + totalImages) % totalImages;
				showImage(currentIndex);
			}

			function startSlider() {
				if (totalImages <= 1) return;
				stopSlider();
				/* 자동 슬라이드 3초 간격 */
				intervalId = setInterval(nextImage, 3000);
			}

			function stopSlider() {
				clearInterval(intervalId);
			}

			const bannerContainer = document.querySelector('.mobon_banner');
			bannerContainer.addEventListener('mouseenter', stopSlider);
			bannerContainer.addEventListener('mouseleave', startSlider);
			bannerContainer.addEventListener('click', () => {
				const product = allProducts[currentIndex];
				if (product && product.purl) {
					window.open(product.purl);
				}
			});

			prevBtn.addEventListener('click', (e) => {
				e.stopPropagation();
				prevImage();
			});

			nextBtn.addEventListener('click', (e) => {
				e.stopPropagation();
				nextImage();
			});

			showImage(currentIndex);

			startSlider();
		})();
	</script>
</body>

</html>
