<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>구글RTB 배너 (가격 없음)</title>
	<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
	<style>
		/* 1. 웹 폰트 head 에서 비동기 로드 */

		/* 2. 배너 & 이미지 규격 */
		:root {
			--width: 320px;
			--height: 50px;
		}

		/* 3. 공통사항 */
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		.mobonLogo {
			position: absolute;
			top: 2px;
			right: 2px;
			width: 11px;
			height: 11px;
			background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo02.png') center center;
			background-size: 11px 11px;
			opacity: 0.8;
			z-index: 1001;
			cursor: pointer;
		}

		.mobonLogo:hover {
			width: 73px;
			height: 15px;
			background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo_over02.png') center center;
			background-size: 73px 15px;
		}

		/* 4. 해당 사이즈 배너 */
		.mobon_reset {
			position: relative;
			width: var(--width);
			height: var(--height);
			font-family: "pretendard", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
			overflow: hidden;
		}

		.mobon_banner {
			display: flex;
			width: 100%;
			height: 100%;
			background-color: #fff;
			cursor: pointer;
		}

		.slider_wrap {
			position: relative;
			flex-shrink: 0;
			width: 70px;
			height: 100%;
			overflow: hidden;
		}

		.img {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			object-fit: cover;
			object-position: center;
			opacity: 0;
			transition: opacity 0.5s ease;
		}

		.img.active {
			opacity: 1;
		}

		.img.is-panning {
			object-position: left top;
			animation: panImage 5s ease-in-out infinite alternate;
		}

		@keyframes panImage {
			0% {
				object-position: left top;
			}

			100% {
				object-position: right bottom;
			}
		}

		.bg {
			display: flex;
			flex: 1;
			min-width: 0;
		}

		.text_wrap {
			display: flex;
			flex-direction: column;
			justify-content: center;
			flex: 1;
			min-width: 0;
			padding: 0 10px;
		}

		.pnm {
			font-size: 11px;
			font-weight: 400;
			line-height: 1.2;
			letter-spacing: -0.5px;
			color: #201e1d;
			word-break: break-all;
			display: -webkit-box;
			-webkit-line-clamp: 1;
			-webkit-box-orient: vertical;
			overflow: hidden;
			margin-bottom: 3px;
		}

		.flex {
			display: flex;
			justify-content: space-between;
			align-items: baseline;
		}







		.progress_bar {
			position: absolute;
			bottom: 0;
			left: 0;
			width: 100%;
			height: 2px;
			background-color: transparent;
			z-index: 9999;
		}

		.progress_fill {
			height: 100%;
			width: 0%;
			background-color: #ff2a2a;
		}

		.progress_fill.animate {
			width: 100%;
			transition: width 3s linear;
		}

		/* 5. 가격 없음: 배지(비밀특가/SNS핫템) + CTA */
		.badge .b_sale {
			display: none;
		}

		.badge.sale .b_sale {
			display: inline;
		}

		.badge.sale .b_default {
			display: none;
		}

		.badge_inline {
			display: none;
			flex-shrink: 0;
			white-space: nowrap;
		}

		.cta {
			display: inline-flex;
			align-items: center;
			gap: 3px;
			white-space: nowrap;
			color: #000;
			transition: all 0.2s ease;
		}

		.cta .arrow {
			flex-shrink: 0;
		}

		.flex {
			align-items: center;
		}

		.cta_box {
			display: flex;
			align-items: center;
			gap: 4px;
		}

		.cta {
			font-size: 13px;
			font-weight: 600;
			letter-spacing: -0.5px;
		}

		/* 모바일형 배지: SNS 핫템/비밀특가 */
		.link_txt {
			flex-shrink: 0;
			white-space: nowrap;
		}

		.link_txt {
			font-size: 9px;
			letter-spacing: 1px;
			color: #201e1d;
		}

		.link_txt.badge {
			font-size: 9px;
			font-weight: 700;
			letter-spacing: 1px;
			color: #ff2a2a;
		}

	</style>
</head>

<body>
	<div class="mobon_reset">
		<div class="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
		<div class="mobon_banner">
			<div class="slider_wrap">
			</div>

			<div class="bg">
				<div class="text_wrap">
					<p class="pnm">쿨링 썸머 카라넥 원피스</p>
					<div class="flex">
						<div class="cta_box">
							<span class="badge badge_inline"><span class="b_default">SNS핫템</span><span class="b_sale">비밀특가</span></span>
							<span class="cta"><span class="cta_txt">지금 구매 찬스</span><svg class="arrow" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg></span>
						</div>
						<div class="link_txt badge"><span class="b_default">SNS 핫템</span><span class="b_sale">비밀특가</span></div>
					</div>
				</div>


			</div>
			<div class="progress_bar">
				<div class="progress_fill"></div>
			</div>
		</div>
	</div>

	<script>
		(() => {
			const sliderWrap = document.querySelector('.slider_wrap');
			const pnmEl = document.querySelector('.pnm');
			const ctaBoxEl = document.querySelector('.cta_box');
			const badgeEls = document.querySelectorAll('.badge');

			const allProducts = [{
					img: "https://cafe24img.poxo.com/dabainsang/web/product/small/202607/e623213db5bca94aa297685e252f0857.webp",
					pnm: "코튼 벨티드 원피스 코튼 벨티드 원피스",
					dc_rate: "25",
					prdt_prmct: "149,000",
					price: "198,000",
					pcode: "test1",
					purl: "javascript:void(0)",
					advrtsReplcCode: "01",
					advrtsReplcNm: ""
				},
				{
					img: "https://cafe24img.poxo.com/dabainsang/web/product/small/202607/34d5572c55d7962dc09e3688c031d90e.jpg",
					pnm: "베이직 라운드 반팔 티셔츠",
					dc_rate: "15",
					prdt_prmct: "9,989,900",
					price: "19,000",
					pcode: "test2",
					purl: "javascript:void(0)",
					advrtsReplcCode: "01",
					advrtsReplcNm: ""
				},
				{
					img: "https://cafe24img.poxo.com/dabainsang/web/product/small/202607/228785c2d74d7238046842d7afaab05b.webp",
					pnm: "와이드 핏 데님 팬츠",
					dc_rate: "20",
					prdt_prmct: "29,900",
					price: "38,000",
					pcode: "test3",
					purl: "javascript:void(0)",
					advrtsReplcCode: "01",
					advrtsReplcNm: ""
				},
				{
					img: "https://cafe24img.poxo.com/dabainsang/web/product/small/202605/4d1d0b5a8cb9825defe09be105af08cb.jpg",
					pnm: "여름 린넨 밴딩 쇼츠",
					dc_rate: "",
					prdt_prmct: "",
					price: "28,000",
					pcode: "test4",
					purl: "javascript:void(0)",
					advrtsReplcCode: "01",
					advrtsReplcNm: ""
				}
			];
			/* 미리보기 전용: ?long=1 긴 상품명, ?sale=1|0 비밀특가/SNS핫템 강제 */
			(() => {
				const p = new URLSearchParams(window.location.search);
				if (p.get('long') === '1') allProducts.forEach(x => { x.pnm = '[핫딜] 쿨링 썸머 카라넥 린넨 블렌드 롱 원피스 여름 신상 데일리룩 하객룩 출근룩 휴양지룩 프리사이즈 체형커버 허리밴딩 사이드슬릿 벨트세트 당일출고 무료배송 재입고 베스트셀러 한정수량'; });
				const s = p.get('sale');
				if (s === '1') allProducts.forEach(x => { if (!x.prdt_prmct) x.prdt_prmct = x.price; });
				if (s === '0') allProducts.forEach(x => { x.prdt_prmct = ''; x.dc_rate = ''; });
			})();

			const urlParams = new URLSearchParams(window.location.search);
			const itemsCount = urlParams.get('items');
			if(itemsCount) {
				allProducts.length = Math.min(allProducts.length, parseInt(itemsCount, 10));
			}

			const imageHtml = allProducts.map((item, index) => {
				const activeClass = index === 0 ? 'active' : '';
				const srcAttr = index === 0 ?
					`src="${item.img}" fetchpriority="high"` :
					`data-src="${item.img}"`;
				return `<img class="img ${activeClass}" ${srcAttr} decoding="async" data-pcode="${item.pcode}" alt="${item.pnm}">`;
			}).join('');

			sliderWrap.innerHTML = imageHtml;

			const images = document.querySelectorAll('.slider_wrap .img');

			const loadRestImages = () => {
				images.forEach(img => {
					if (img.dataset.src) {
						img.src = img.dataset.src;
						delete img.dataset.src;
					}
				});
			};

			if (images[0]) {
				if (images[0].complete) {
					loadRestImages();
				} else {
					images[0].addEventListener('load', loadRestImages, { once: true });
					images[0].addEventListener('error', loadRestImages, { once: true });
				}
			}

			let currentIndex = 0;
			const totalImages = images.length;
			let intervalId;
			const progressFill = document.querySelector('.progress_fill');


			const checkPanning = (img) => {
				const wrap = img.parentElement;
				if (!wrap.clientWidth || !wrap.clientHeight) return;

				const wrapRatio = wrap.clientWidth / wrap.clientHeight;
				const imgRatio = img.naturalWidth / img.naturalHeight;

				const overflowPx = imgRatio > wrapRatio ?
					(wrap.clientHeight * imgRatio) - wrap.clientWidth :
					(wrap.clientWidth / imgRatio) - wrap.clientHeight;

				const overflowRatio = imgRatio > wrapRatio ?
					overflowPx / wrap.clientWidth :
					overflowPx / wrap.clientHeight;

				if (overflowRatio > 0.3) {
					img.classList.add('is-panning');
					img.style.animationDuration = overflowPx <= 40 ? '3s' : '5s';
				} else {
					img.classList.remove('is-panning');
					img.style.animationDuration = '';
				}
			};

			function showImage(index) {
				images.forEach(img => img.classList.remove('active'));
				if (images[index]) {
					images[index].classList.add('active');

					if (images[index].complete && images[index].naturalWidth > 0) {
						checkPanning(images[index]);
					} else {
						images[index].addEventListener('load', () => checkPanning(images[index]), {
							once: true
						});
					}
				}

				const product = allProducts[index];
				if (product) {
					pnmEl.textContent = product.pnm;

					const isSale = !!product.prdt_prmct;
					ctaBoxEl.classList.toggle('sale', isSale);
					badgeEls.forEach(b => b.classList.toggle('sale', isSale));

					if (pnmEl.animate) {
						pnmEl.animate([{
								opacity: 0,
								transform: 'translateY(4px)'
							},
							{
								opacity: 1,
								transform: 'translateY(0)'
							}
						], {
							duration: 400,
							easing: 'ease-out'
						});

						ctaBoxEl.animate([{
								opacity: 0,
								transform: 'translateY(4px)'
							},
							{
								opacity: 1,
								transform: 'translateY(0)'
							}
						], {
							duration: 400,
							delay: 50,
							easing: 'ease-out',
							fill: 'backwards'
						});
					}
				}
			}

			function nextImage() {
				currentIndex = (currentIndex + 1) % totalImages;
				showImage(currentIndex);
			}

			let sliderAnim = null;

			function startSlider() {
				if (totalImages <= 1) return;

				if (sliderAnim) {
					sliderAnim.play();
					return;
				}

				if (progressFill) {
					progressFill.style.width = '0%';
					sliderAnim = progressFill.animate([{
							width: '0%',
							offset: 0
						},
						{
							width: '100%',
							offset: 3000 / 3500
						},
						{
							width: '100%',
							offset: 1
						}
					], {
						duration: 3500,
						easing: 'linear',
						fill: 'forwards'
					});

					sliderAnim.onfinish = () => {
						nextImage();
						sliderAnim = null;
						startSlider();
					};
				}
			}

			function stopSlider() {
				if (sliderAnim) {
					sliderAnim.pause();
				}
			}

			const bannerContainer = document.querySelector('.mobon_banner');
			bannerContainer.addEventListener('mouseenter', stopSlider);
			bannerContainer.addEventListener('mouseleave', startSlider);

			showImage(currentIndex);

			startSlider();
		})();
	</script>
</body>

</html>
