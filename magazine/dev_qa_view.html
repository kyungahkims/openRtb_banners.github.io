	&lt;!-- 노출 추적 태그 --&gt;
	

	&lt;!-- 대체 배너 영역 --&gt;
	&lt;div class=&quot;fallback_banner&quot; id=&quot;hiddenMobon&quot;&gt;
		&lt;div class=&quot;mobonLogo&quot; onclick=&quot;window.open('https://img.mobon.net/ad/linfo.php')&quot;&gt;&lt;/div&gt;
		&lt;div class=&quot;fallback_link&quot; onclick=&quot;window.open('https://mobon.net/bridge/')&quot;&gt;
			&lt;img src=&quot;https://img.mobon.net/servlet/image/mobon/120x600.png&quot; alt=&quot;대체배너&quot;&gt;
		&lt;/div&gt;
	&lt;/div&gt;

	&lt;script&gt;
		(() =&gt; {
			const frameWidth = 120;
			const frameHeight = 600;
			const mainBanner = document.getElementById('noHiddenMobon');
			const fallbackBanner = document.getElementById('hiddenMobon');
			const mobonBannerWrap = document.querySelector('.mobon_banner_wrap');
			const mobonReset = document.querySelector('.mobon_reset');
			const allProducts = window.__mobonProducts;
			if (allProducts.length &gt; 4) allProducts.length = 4;
			mobonBannerWrap.innerHTML = allProducts.map((item, index) =&gt; {
				const isSale = item.prdt_prmct ? &quot;sale&quot; : &quot;&quot;;
				let priceText = `${item.price}원`;

				return `
					&lt;div class=&quot;mobon_banner ${index === 0 ? 'active' : ''}&quot; data-index=&quot;${index}&quot;&gt;
						&lt;div class=&quot;badge&quot;&gt;핫템&lt;/div&gt;
						&lt;div class=&quot;slider_wrap&quot;&gt;
							&lt;img class=&quot;img&quot; src=&quot;${item.img}&quot; alt=&quot;${item.pnm}&quot; fetchpriority=&quot;${index === 0 ? 'high' : 'low'}&quot; decoding=&quot;async&quot;&gt;
						&lt;/div&gt;
						&lt;div class=&quot;bg&quot;&gt;
							&lt;p class=&quot;pnm&quot;&gt;${item.pnm}&lt;/p&gt;
							&lt;div class=&quot;price_box ${isSale}&quot;&gt;
								${item.dc_rate ? `&lt;div class=&quot;sale_rate&quot;&gt;${item.dc_rate}&lt;span&gt;%&lt;/span&gt;&lt;/div&gt;` : ''}
								${item.prdt_prmct ? `&lt;div class=&quot;sale_price&quot;&gt;${item.prdt_prmct}원&lt;/div&gt;` : ''}
								&lt;div class=&quot;original_price&quot;&gt;${priceText}&lt;/div&gt;
							&lt;/div&gt;
						&lt;/div&gt;
					&lt;/div&gt;
				`;
			}).join('');

			const mobonBanners = document.querySelectorAll('.mobon_banner_wrap .mobon_banner');
			const totalCards = mobonBanners.length;
			if (totalCards &lt;= 1) {
				const activeBanner = document.querySelector('.mobon_banner.active');
				if (activeBanner) {
					activeBanner.style.flex = '0 0 100%';
				}
			}
			let currentIndex = 0;
			let intervalId;

			const checkPanning = (img) =&gt; {
				const wrap = img.parentElement;
				if (!wrap.clientWidth || !wrap.clientHeight) return;

				const wrapRatio = wrap.clientWidth / wrap.clientHeight;
				const imgRatio = img.naturalWidth / img.naturalHeight;

				const overflowPx = imgRatio &gt; wrapRatio ?
					(wrap.clientHeight * imgRatio) - wrap.clientWidth :
					(wrap.clientWidth / imgRatio) - wrap.clientHeight;

				const overflowRatio = imgRatio &gt; wrapRatio ?
					overflowPx / wrap.clientWidth :
					overflowPx / wrap.clientHeight;

				if (overflowRatio &gt; 0.3) {
					img.classList.add('is-panning');
					img.style.animationDuration = overflowPx &lt;= 40 ? '3s' : '5s';
				} else {
					img.classList.remove('is-panning');
					img.style.animationDuration = '';
				}
			};

			function updatePanningForAll() {
				mobonBanners.forEach(card =&gt; {
					const img = card.querySelector('.img');
					if (img.complete &amp;&amp; img.naturalWidth &gt; 0) {
						checkPanning(img);
					}
				});
			}

			function showCard(index) {
				mobonBanners.forEach((card, i) =&gt; {
					if (i === index) {
						card.classList.add('active');
					} else {
						card.classList.remove('active');
					}
				});

				setTimeout(updatePanningForAll, 350);
			}

			function nextCard() {
				currentIndex = (currentIndex + 1) % totalCards;
				showCard(currentIndex);
			}

			function startSlider() {
				if (totalCards &lt;= 1) return;
				stopSlider();
				intervalId = setInterval(nextCard, 3000);
			}

			function stopSlider() {
				clearInterval(intervalId);
			}

			let hoverTimeout;
			mobonBanners.forEach(card =&gt; {
				const img = card.querySelector('.img');
				img.addEventListener('load', () =&gt; checkPanning(img), {
					once: true
				});

				card.addEventListener('mouseenter', () =&gt; {
					clearTimeout(hoverTimeout);
					hoverTimeout = setTimeout(() =&gt; {
						currentIndex = parseInt(card.getAttribute('data-index'));
						showCard(currentIndex);
					}, 150);
				});

				card.addEventListener('mouseleave', () =&gt; {
					clearTimeout(hoverTimeout);
				});

				card.addEventListener('click', (e) =&gt; {
					e.stopPropagation();
					const index = parseInt(card.getAttribute('data-index'));
					const purl = allProducts[index].purl;
					if (purl &amp;&amp; purl !== &quot;javascript:void(0)&quot;) {
						window.open(purl, '_blank');
					}
				});
			});

			mobonReset.addEventListener('mouseenter', stopSlider);
			mobonReset.addEventListener('mouseleave', startSlider);


			const shopLogo = document.querySelector('.shop_logo');
			if (shopLogo) {
				shopLogo.style.cursor = 'pointer';
				shopLogo.addEventListener('click', (e) =&gt; {
					e.stopPropagation();
					const purl = allProducts[currentIndex].purl;
					if (purl &amp;&amp; purl !== &quot;javascript:void(0)&quot;) {
						window.open(purl, '_blank');
					}
				});
			}

			updatePanningForAll();
			startSlider();

			const handleImageErrors = () =&gt; {
				const allBannerImages = document.querySelectorAll('.img');
				let isFallbackTriggered = false;
				const handleImageError = (event) =&gt; {
					if (isFallbackTriggered) return;
					isFallbackTriggered = true;
					const pcode = event.target.dataset.pcode || '';
					if (mainBanner) mainBanner.style.display = 'none';
					if (fallbackBanner) {
						fallbackBanner.style.display = 'block';
						fallbackBanner.style.width = `${frameWidth}px`;
						fallbackBanner.style.height = `${frameHeight}px`;
					}
					const errorUrl =
						`https://img.mobon.net/rtbShop?uid=${encodeURIComponent(&quot;qa-uuid&quot;)}&amp;u=qa-user&amp;pc=${pcode}&amp;itlTpCode=qa`;
					(new Image()).src = errorUrl;
				};
				allBannerImages.forEach(img =&gt; {
					if (img.getAttribute('src') &amp;&amp; img.complete &amp;&amp; img.naturalHeight === 0) {
						handleImageError({
							target: img
						});
					} else {
						img.addEventListener('error', handleImageError);
					}
				});
			};
			handleImageErrors();
		})();
	&lt;/script&gt;
&lt;/body&gt;

		&lt;div class=&quot;mobonLogo&quot; onclick=&quot;window.open('https://img.mobon.net/ad/linfo.php')&quot;&gt;&lt;/div&gt;
		&lt;div class=&quot;fallback_link&quot; onclick=&quot;window.open('https://mobon.net/bridge/')&quot;&gt;
			&lt;img src=&quot;https://img.mobon.net/servlet/image/mobon/160x600.png&quot; alt=&quot;대체배너&quot;&gt;
		&lt;/div&gt;

	&lt;script&gt;
		(() =&gt; {
			const frameWidth = 160;
			const frameHeight = 600;
			const mainBanner = document.getElementById('noHiddenMobon');
			const fallbackBanner = document.getElementById('hiddenMobon');
			const mobonBannerWrap = document.querySelector('.mobon_banner_wrap');
			const mobonReset = document.querySelector('.mobon_reset');
			const allProducts = window.__mobonProducts;
			if (allProducts.length &gt; 4) allProducts.length = 4;
			mobonBannerWrap.innerHTML = allProducts.map((item, index) =&gt; {
				const isSale = item.prdt_prmct ? &quot;sale&quot; : &quot;&quot;;
				let priceText = `${item.price}원`;

				return `
					&lt;div class=&quot;mobon_banner ${index === 0 ? 'active' : ''}&quot; data-index=&quot;${index}&quot;&gt;
						&lt;div class=&quot;badge&quot;&gt;SNS 핫템&lt;/div&gt;
						&lt;div class=&quot;slider_wrap&quot;&gt;
							&lt;img class=&quot;img&quot; src=&quot;${item.img}&quot; alt=&quot;${item.pnm}&quot; fetchpriority=&quot;${index === 0 ? 'high' : 'low'}&quot; decoding=&quot;async&quot;&gt;
						&lt;/div&gt;
						&lt;div class=&quot;bg&quot;&gt;
							&lt;p class=&quot;pnm&quot;&gt;${item.pnm}&lt;/p&gt;
							&lt;div class=&quot;price_box ${isSale}&quot;&gt;
								${item.dc_rate ? `&lt;div class=&quot;sale_rate&quot;&gt;${item.dc_rate}&lt;span&gt;%&lt;/span&gt;&lt;/div&gt;` : ''}
								${item.prdt_prmct ? `&lt;div class=&quot;sale_price&quot;&gt;${item.prdt_prmct}원&lt;/div&gt;` : ''}
								&lt;div class=&quot;original_price&quot;&gt;${priceText}&lt;/div&gt;
							&lt;/div&gt;
						&lt;/div&gt;
					&lt;/div&gt;
				`;
			}).join('');

			const mobonBanners = document.querySelectorAll('.mobon_banner_wrap .mobon_banner');
			const totalCards = mobonBanners.length;
			if (totalCards &lt;= 1) {
				const activeBanner = document.querySelector('.mobon_banner.active');
				if (activeBanner) {
					activeBanner.style.flex = '0 0 100%';
				}
			}
			let currentIndex = 0;
			let intervalId;

			const checkPanning = (img) =&gt; {
				const wrap = img.parentElement;
				if (!wrap.clientWidth || !wrap.clientHeight) return;

				const wrapRatio = wrap.clientWidth / wrap.clientHeight;
				const imgRatio = img.naturalWidth / img.naturalHeight;

				const overflowPx = imgRatio &gt; wrapRatio ?
					(wrap.clientHeight * imgRatio) - wrap.clientWidth :
					(wrap.clientWidth / imgRatio) - wrap.clientHeight;

				const overflowRatio = imgRatio &gt; wrapRatio ?
					overflowPx / wrap.clientWidth :
					overflowPx / wrap.clientHeight;

				if (overflowRatio &gt; 0.3) {
					img.classList.add('is-panning');
					img.style.animationDuration = overflowPx &lt;= 40 ? '3s' : '5s';
				} else {
					img.classList.remove('is-panning');
					img.style.animationDuration = '';
				}
			};

			function updatePanningForAll() {
				mobonBanners.forEach(card =&gt; {
					const img = card.querySelector('.img');
					if (img.complete &amp;&amp; img.naturalWidth &gt; 0) {
						checkPanning(img);
					}
				});
			}

			function showCard(index) {
				mobonBanners.forEach((card, i) =&gt; {
					if (i === index) {
						card.classList.add('active');
					} else {
						card.classList.remove('active');
					}
				});

				setTimeout(updatePanningForAll, 350);
			}

			function nextCard() {
				currentIndex = (currentIndex + 1) % totalCards;
				showCard(currentIndex);
			}

			function startSlider() {
				if (totalCards &lt;= 1) return;
				stopSlider();
				intervalId = setInterval(nextCard, 3000);
			}

			function stopSlider() {
				clearInterval(intervalId);
			}

			let hoverTimeout;
			mobonBanners.forEach(card =&gt; {
				const img = card.querySelector('.img');
				img.addEventListener('load', () =&gt; checkPanning(img), {
					once: true
				});

				card.addEventListener('mouseenter', () =&gt; {
					clearTimeout(hoverTimeout);
					hoverTimeout = setTimeout(() =&gt; {
						currentIndex = parseInt(card.getAttribute('data-index'));
						showCard(currentIndex);
					}, 150);
				});

				card.addEventListener('mouseleave', () =&gt; {
					clearTimeout(hoverTimeout);
				});

				card.addEventListener('click', (e) =&gt; {
					e.stopPropagation();
					const index = parseInt(card.getAttribute('data-index'));
					const purl = allProducts[index].purl;
					if (purl &amp;&amp; purl !== &quot;javascript:void(0)&quot;) {
						window.open(purl, '_blank');
					}
				});
			});

			mobonReset.addEventListener('mouseenter', stopSlider);
			mobonReset.addEventListener('mouseleave', startSlider);


			const shopLogo = document.querySelector('.shop_logo');
			if (shopLogo) {
				shopLogo.style.cursor = 'pointer';
				shopLogo.addEventListener('click', (e) =&gt; {
					e.stopPropagation();
					const purl = allProducts[currentIndex].purl;
					if (purl &amp;&amp; purl !== &quot;javascript:void(0)&quot;) {
						window.open(purl, '_blank');
					}
				});
			}

			updatePanningForAll();
			startSlider();

			const handleImageErrors = () =&gt; {
				const allBannerImages = document.querySelectorAll('.img');
				let isFallbackTriggered = false;
				const handleImageError = (event) =&gt; {
					if (isFallbackTriggered) return;
					isFallbackTriggered = true;
					const pcode = event.target.dataset.pcode || '';
					if (mainBanner) mainBanner.style.display = 'none';
					if (fallbackBanner) {
						fallbackBanner.style.display = 'block';
						fallbackBanner.style.width = `${frameWidth}px`;
						fallbackBanner.style.height = `${frameHeight}px`;
					}
					const errorUrl =
						`https://img.mobon.net/rtbShop?uid=${encodeURIComponent(&quot;qa-uuid&quot;)}&amp;u=qa-user&amp;pc=${pcode}&amp;itlTpCode=qa`;
					(new Image()).src = errorUrl;
				};
				allBannerImages.forEach(img =&gt; {
					if (img.getAttribute('src') &amp;&amp; img.complete &amp;&amp; img.naturalHeight === 0) {
						handleImageError({
							target: img
						});
					} else {
						img.addEventListener('error', handleImageError);
					}
				});
			};
			handleImageErrors();
		})();
	&lt;/script&gt;

			});

				e.stopPropagation();
				nextImage();
			});

			showImage(currentIndex);

			startSlider();
		})();

			const fallbackBanner = document.getElementById('hiddenMobon');

			const pnmEl = document.querySelector('.pnm');

			const salePriceEl = document.querySelector('.sale_price');
			const originalPriceEl = document.querySelector('.original_price');
			const allProducts = window.__mobonProducts;

			const imageHtml = allProducts.map((item, index) =&gt; {
				const activeClass = index === 0 ? 'active' : '';
				const srcAttr = index === 0 ?
					`src=&quot;${item.img}&quot; fetchpriority=&quot;high&quot;` :
					`data-src=&quot;${item.img}&quot;`;
				return `&lt;img class=&quot;img ${activeClass}&quot; ${srcAttr} decoding=&quot;async&quot; data-pcode=&quot;${item.pcode}&quot; alt=&quot;${item.pnm}&quot;&gt;`;
			}).join('');

			sliderWrap.innerHTML = imageHtml;

			const images = document.querySelectorAll('.slider_wrap .img');

			const loadRestImages = () =&gt; {
				images.forEach(img =&gt; {
					if (img.dataset.src) {
						img.src = img.dataset.src;
						delete img.dataset.src;
					}
				});
			};

			if (images[0]) {
				if (images[0].complete) {
					loadRestImages();

				let isFallbackTriggered = false;
				const handleImageError = (event) =&gt; {
					if (isFallbackTriggered) return;
					isFallbackTriggered = true;
					const pcode = event.target.dataset.pcode || '';
					if (mainBanner) mainBanner.style.display = 'none';
					if (fallbackBanner) {
						fallbackBanner.style.display = 'block';
						fallbackBanner.style.width = `${frameWidth}px`;
						fallbackBanner.style.height = `${frameHeight}px`;
					}
					const errorUrl =

					(new Image()).src = errorUrl;
				};
				images.forEach(img =&gt; {
					if (img.getAttribute('src') &amp;&amp; img.complete &amp;&amp; img.naturalHeight === 0) {

						});

					}
				});

			totalIdxEl.textContent = totalImages;

			if (totalImages &lt;= 1) {
				sliderControls.style.display = 'none';
				priceBoxEl.style.marginTop = 'auto';
			}

			const checkPanning = (img) =&gt; {
				const wrap = img.parentElement;
				if (!wrap.clientWidth || !wrap.clientHeight) return;

				const wrapRatio = wrap.clientWidth / wrap.clientHeight;
				const imgRatio = img.naturalWidth / img.naturalHeight;

				const overflowPx = imgRatio &gt; wrapRatio ?
					(wrap.clientHeight * imgRatio) - wrap.clientWidth :
					(wrap.clientWidth / imgRatio) - wrap.clientHeight;

				const overflowRatio = imgRatio &gt; wrapRatio ?
					overflowPx / wrap.clientWidth :
					overflowPx / wrap.clientHeight;

				if (overflowRatio &gt; 0.3) {
					img.classList.add('is-panning');
					img.style.animationDuration = overflowPx &lt;= 40 ? '3s' : '5s';
				} else {
					img.classList.remove('is-panning');
					img.style.animationDuration = '';
				}
			};

			function showImage(index) {
				images.forEach(img =&gt; img.classList.remove('active'));
				if (images[index]) {
					images[index].classList.add('active');

					if (images[index].complete &amp;&amp; images[index].naturalWidth &gt; 0) {
						checkPanning(images[index]);
					} else {
						images[index].addEventListener('load', () =&gt; checkPanning(images[index]), {
							once: true
						});
					}
				}
				currentIdxEl.textContent = index + 1;

				const product = allProducts[index];
				if (product) {
					pnmEl.textContent = product.pnm;

					let priceText = `${product.price}원`;

					if (product.prdt_prmct) {
						priceBoxEl.classList.add('sale');
						saleRateEl.innerHTML = (product.dc_rate ? product.dc_rate + '&lt;span&gt;%&lt;/span&gt;' : '');
						salePriceEl.textContent = `${product.prdt_prmct}원`;
						originalPriceEl.textContent = priceText;
					} else {
						priceBoxEl.classList.remove('sale');
						saleRateEl.innerHTML = '';
						salePriceEl.textContent = '';
						originalPriceEl.textContent = priceText;
					}
				}
			}

			function nextImage() {
				currentIndex = (currentIndex + 1) % totalImages;
				showImage(currentIndex);
			}

			function prevImage() {
				currentIndex = (currentIndex - 1 + totalImages) % totalImages;
				showImage(currentIndex);
			}

			function startSlider() {
				if (totalImages &lt;= 1) return;
				stopSlider();
				/* 3초 마다 */
				intervalId = setInterval(nextImage, 3000);
			}

			function stopSlider() {
				clearInterval(intervalId);
			}

			const bannerContainer = document.querySelector('.mobon_banner');
			bannerContainer.addEventListener('mouseenter', stopSlider);
			bannerContainer.addEventListener('mouseleave', startSlider);
			bannerContainer.addEventListener('click', () =&gt; {
				const product = allProducts[currentIndex];
				if (product &amp;&amp; product.purl) {
					window.open(product.purl);
				}
			});

			prevBtn.addEventListener('click', (e) =&gt; {
				e.stopPropagation();
				prevImage();
			});

			nextBtn.addEventListener('click', (e) =&gt; {
				e.stopPropagation();
				nextImage();
			});

			showImage(currentIndex);

			startSlider();
		})();
	&lt;/script&gt;

	&lt;script&gt;
		(() =&gt; {
			const frameWidth = 300;
			const frameHeight = 100;
			const mainBanner = document.getElementById('noHiddenMobon');
			const fallbackBanner = document.getElementById('hiddenMobon');
			const sliderWrap = document.querySelector('.slider_wrap');
			const prevBtn = document.querySelector('.prev_btn');
			const nextBtn = document.querySelector('.next_btn');
			const currentIdxEl = document.querySelector('.current_idx');
			const totalIdxEl = document.querySelector('.total_idx');
			const pnmEl = document.querySelector('.pnm');
			const priceBoxEl = document.querySelector('.price_box');
			const saleRateEl = document.querySelector('.sale_rate');
			const salePriceEl = document.querySelector('.sale_price');
			const originalPriceEl = document.querySelector('.original_price');
			const allProducts = window.__mobonProducts;

			const imageHtml = allProducts.map((item, index) =&gt; {
				const activeClass = index === 0 ? 'active' : '';
				const srcAttr = index === 0 ?
					`src=&quot;${item.img}&quot; fetchpriority=&quot;high&quot;` :
					`data-src=&quot;${item.img}&quot;`;
				return `&lt;img class=&quot;img ${activeClass}&quot; ${srcAttr} decoding=&quot;async&quot; data-pcode=&quot;${item.pcode}&quot; alt=&quot;${item.pnm}&quot;&gt;`;
			}).join('');

			sliderWrap.innerHTML = imageHtml;

			const images = document.querySelectorAll('.slider_wrap .img');

			const loadRestImages = () =&gt; {
				images.forEach(img =&gt; {
					if (img.dataset.src) {
						img.src = img.dataset.src;
						delete img.dataset.src;
					}
				});
			};

			if (images[0]) {
				if (images[0].complete) {
					loadRestImages();
				} else {
					images[0].addEventListener('load', loadRestImages, { once: true });
					images[0].addEventListener('error', loadRestImages, { once: true });
				}
			}

			const handleImageErrors = () =&gt; {
				let isFallbackTriggered = false;
				const handleImageError = (event) =&gt; {
					if (isFallbackTriggered) return;
					isFallbackTriggered = true;
					const pcode = event.target.dataset.pcode || '';
					if (mainBanner) mainBanner.style.display = 'none';
					if (fallbackBanner) {
						fallbackBanner.style.display = 'block';
						fallbackBanner.style.width = `${frameWidth}px`;
						fallbackBanner.style.height = `${frameHeight}px`;
					}
					const errorUrl =
						`https://img.mobon.net/rtbShop?uid=${encodeURIComponent(&quot;qa-uuid&quot;)}&amp;u=qa-user&amp;pc=${pcode}&amp;itlTpCode=qa`;
					(new Image()).src = errorUrl;
				};
				images.forEach(img =&gt; {
					if (img.getAttribute('src') &amp;&amp; img.complete &amp;&amp; img.naturalHeight === 0) {
						handleImageError({
							target: img
						});
					} else {
						img.addEventListener('error', handleImageError);
					}
				});
			};
			handleImageErrors();


			const sliderControls = document.querySelector('.slider_controls');
			let currentIndex = 0;
			const totalImages = images.length;
			let intervalId;
			const progressFill = document.querySelector('.progress_fill');

			totalIdxEl.textContent = totalImages;

			if (totalImages &lt;= 1) {
				const paginationWrap = document.querySelector('.pagination_wrap');
				if (paginationWrap) paginationWrap.style.display = 'none';
				const sliderControls = document.querySelector('.slider_controls');
				if (sliderControls) sliderControls.style.justifyContent = 'flex-end';
			}

			const checkPanning = (img) =&gt; {
				const wrap = img.parentElement;
				if (!wrap.clientWidth || !wrap.clientHeight) return;

				const wrapRatio = wrap.clientWidth / wrap.clientHeight;
				const imgRatio = img.naturalWidth / img.naturalHeight;

				const overflowPx = imgRatio &gt; wrapRatio ?
					(wrap.clientHeight * imgRatio) - wrap.clientWidth :
					(wrap.clientWidth / imgRatio) - wrap.clientHeight;

				const overflowRatio = imgRatio &gt; wrapRatio ?
					overflowPx / wrap.clientWidth :
					overflowPx / wrap.clientHeight;

				if (overflowRatio &gt; 0.3) {
					img.classList.add('is-panning');
					img.style.animationDuration = overflowPx &lt;= 40 ? '3s' : '5s';
				} else {
					img.classList.remove('is-panning');
					img.style.animationDuration = '';
				}
			};

			function showImage(index) {
				images.forEach(img =&gt; img.classList.remove('active'));
				if (images[index]) {
					images[index].classList.add('active');

					if (images[index].complete &amp;&amp; images[index].naturalWidth &gt; 0) {
						checkPanning(images[index]);
					} else {
						images[index].addEventListener('load', () =&gt; checkPanning(images[index]), {
							once: true
						});
					}
				}
				currentIdxEl.textContent = index + 1;

				const product = allProducts[index];
				if (product) {
					pnmEl.textContent = product.pnm;

					let priceText = `${product.price}원`;

					if (product.prdt_prmct) {
						priceBoxEl.classList.add('sale');
						saleRateEl.innerHTML = (product.dc_rate ? product.dc_rate + '&lt;span&gt;%&lt;/span&gt;' : '');
						salePriceEl.textContent = `${product.prdt_prmct}원`;
						originalPriceEl.textContent = priceText;
					} else {
						priceBoxEl.classList.remove('sale');
						saleRateEl.innerHTML = '';
						salePriceEl.textContent = '';
						originalPriceEl.textContent = priceText;
					}

					if (pnmEl.animate) {
						pnmEl.animate([{
								opacity: 0,
								transform: 'translateY(4px)'
							},
							{
								opacity: 1,
								transform: 'translateY(0)'
							}
						], {
							duration: 400,
							easing: 'ease-out'
						});

						priceBoxEl.animate([{
								opacity: 0,
								transform: 'translateY(4px)'
							},
							{
								opacity: 1,
								transform: 'translateY(0)'
							}
						], {
							duration: 400,
							delay: 50,
							easing: 'ease-out',
							fill: 'backwards'
						});
					}
				}
			}

			let sliderAnim = null;

			function nextImage() {
				currentIndex = (currentIndex + 1) % totalImages;
				showImage(currentIndex);
				if (sliderAnim) {
					sliderAnim.cancel();
					sliderAnim = null;
				}
				if (progressFill) {
					progressFill.style.width = '0%';
				}
			}

			function prevImage() {
				currentIndex = (currentIndex - 1 + totalImages) % totalImages;
				showImage(currentIndex);
				if (sliderAnim) {
					sliderAnim.cancel();
					sliderAnim = null;
				}
				if (progressFill) {
					progressFill.style.width = '0%';
				}
			}

			function startSlider() {
				if (totalImages &lt;= 1) return;

				if (sliderAnim) {
					sliderAnim.play();
					return;
				}

				if (progressFill) {
					progressFill.style.width = '0%';
					sliderAnim = progressFill.animate([{
							width: '0%',
							offset: 0
						},
						{
							width: '100%',
							offset: 3000 / 3500
						},
						{
							width: '100%',
							offset: 1
						}
					], {
						duration: 3500,
						easing: 'linear',
						fill: 'forwards'
					});

					sliderAnim.onfinish = () =&gt; {
						nextImage();
						sliderAnim = null;
						startSlider();
					};
				}
			}

			function stopSlider() {
				if (sliderAnim) {
					sliderAnim.pause();
				}
			}

			const bannerContainer = document.querySelector('.mobon_banner');
			bannerContainer.addEventListener('mouseenter', stopSlider);
			bannerContainer.addEventListener('mouseleave', startSlider);
			bannerContainer.addEventListener('click', () =&gt; {
				const product = allProducts[currentIndex];
				if (product &amp;&amp; product.purl) {
					window.open(product.purl);
				}
			});

			prevBtn.addEventListener('click', (e) =&gt; {
				e.stopPropagation();
				prevImage();
			});

			nextBtn.addEventListener('click', (e) =&gt; {
				e.stopPropagation();
				nextImage();
			});

			showImage(currentIndex);

			startSlider();
		})();
	&lt;/script&gt;

	&lt;script&gt;
		(() =&gt; {
			const frameWidth = 300;
			const frameHeight = 150;
			const mainBanner = document.getElementById('noHiddenMobon');
			const fallbackBanner = document.getElementById('hiddenMobon');
			const sliderWrap = document.querySelector('.slider_wrap');
			const prevBtn = document.querySelector('.prev_btn');
			const nextBtn = document.querySelector('.next_btn');
			const currentIdxEl = document.querySelector('.current_idx');
			const totalIdxEl = document.querySelector('.total_idx');
			const pnmEl = document.querySelector('.pnm');
			const priceBoxEl = document.querySelector('.price_box');
			const saleRateEl = document.querySelector('.sale_rate');
			const salePriceEl = document.querySelector('.sale_price');
			const originalPriceEl = document.querySelector('.original_price');
			const allProducts = window.__mobonProducts;

			const imageHtml = allProducts.map((item, index) =&gt; {
				const activeClass = index === 0 ? 'active' : '';
				const srcAttr = index === 0 ?
					`src=&quot;${item.img}&quot; fetchpriority=&quot;high&quot;` :
					`data-src=&quot;${item.img}&quot;`;
				return `&lt;img class=&quot;img ${activeClass}&quot; ${srcAttr} decoding=&quot;async&quot; data-pcode=&quot;${item.pcode}&quot; alt=&quot;${item.pnm}&quot;&gt;`;
			}).join('');

			sliderWrap.innerHTML = imageHtml;

			const images = document.querySelectorAll('.slider_wrap .img');

			const loadRestImages = () =&gt; {
				images.forEach(img =&gt; {
					if (img.dataset.src) {
						img.src = img.dataset.src;
						delete img.dataset.src;
					}
				});
			};

			if (images[0]) {
				if (images[0].complete) {
					loadRestImages();
				} else {
					images[0].addEventListener('load', loadRestImages, { once: true });
					images[0].addEventListener('error', loadRestImages, { once: true });
				}
			}

			const handleImageErrors = () =&gt; {
				let isFallbackTriggered = false;
				const handleImageError = (event) =&gt; {
					if (isFallbackTriggered) return;
					isFallbackTriggered = true;
					const pcode = event.target.dataset.pcode || '';
					if (mainBanner) mainBanner.style.display = 'none';
					if (fallbackBanner) {
						fallbackBanner.style.display = 'block';
						fallbackBanner.style.width = `${frameWidth}px`;
						fallbackBanner.style.height = `${frameHeight}px`;
					}
					const errorUrl =
						`https://img.mobon.net/rtbShop?uid=${encodeURIComponent(&quot;qa-uuid&quot;)}&amp;u=qa-user&amp;pc=${pcode}&amp;itlTpCode=qa`;
					(new Image()).src = errorUrl;
				};
				images.forEach(img =&gt; {
					if (img.getAttribute('src') &amp;&amp; img.complete &amp;&amp; img.naturalHeight === 0) {
						handleImageError({
							target: img
						});
					} else {
						img.addEventListener('error', handleImageError);
					}
				});
			};
			handleImageErrors();


			const sliderControls = document.querySelector('.slider_controls');
			let currentIndex = 0;
			const totalImages = images.length;
			let intervalId;
			const progressFill = document.querySelector('.progress_fill');

			totalIdxEl.textContent = totalImages;

			if (totalImages &lt;= 1) {
				const paginationWrap = document.querySelector('.pagination_wrap');
				if (paginationWrap) paginationWrap.style.display = 'none';
				const sliderControls = document.querySelector('.slider_controls');
				if (sliderControls) sliderControls.style.justifyContent = 'flex-end';
			}

			const checkPanning = (img) =&gt; {
				const wrap = img.parentElement;
				if (!wrap.clientWidth || !wrap.clientHeight) return;

				const wrapRatio = wrap.clientWidth / wrap.clientHeight;
				const imgRatio = img.naturalWidth / img.naturalHeight;

				const overflowPx = imgRatio &gt; wrapRatio ?
					(wrap.clientHeight * imgRatio) - wrap.clientWidth :
					(wrap.clientWidth / imgRatio) - wrap.clientHeight;

				const overflowRatio = imgRatio &gt; wrapRatio ?
					overflowPx / wrap.clientWidth :
					overflowPx / wrap.clientHeight;

				if (overflowRatio &gt; 0.3) {
					img.classList.add('is-panning');
					img.style.animationDuration = overflowPx &lt;= 40 ? '3s' : '5s';
				} else {
					img.classList.remove('is-panning');
					img.style.animationDuration = '';
				}
			};

			function showImage(index) {
				images.forEach(img =&gt; img.classList.remove('active'));
				if (images[index]) {
					images[index].classList.add('active');

					if (images[index].complete &amp;&amp; images[index].naturalWidth &gt; 0) {
						checkPanning(images[index]);
					} else {
						images[index].addEventListener('load', () =&gt; checkPanning(images[index]), {
							once: true
						});
					}
				}
				currentIdxEl.textContent = index + 1;

				const product = allProducts[index];
				if (product) {
					pnmEl.textContent = product.pnm;

					let priceText = `${product.price}원`;

					if (product.prdt_prmct) {
						priceBoxEl.classList.add('sale');
						saleRateEl.innerHTML = (product.dc_rate ? product.dc_rate + '&lt;span&gt;%&lt;/span&gt;' : '');
						salePriceEl.textContent = `${product.prdt_prmct}원`;
						originalPriceEl.textContent = priceText;
					} else {
						priceBoxEl.classList.remove('sale');
						saleRateEl.innerHTML = '';
						salePriceEl.textContent = '';
						originalPriceEl.textContent = priceText;
					}

					if (pnmEl.animate) {
						pnmEl.animate([{
								opacity: 0,
								transform: 'translateY(4px)'
							},
							{
								opacity: 1,
								transform: 'translateY(0)'
							}
						], {
							duration: 400,
							easing: 'ease-out'
						});

						priceBoxEl.animate([{
								opacity: 0,
								transform: 'translateY(4px)'
							},
							{
								opacity: 1,
								transform: 'translateY(0)'
							}
						], {
							duration: 400,
							delay: 50,
							easing: 'ease-out',
							fill: 'backwards'
						});
					}
				}
			}

			let sliderAnim = null;

			function nextImage() {
				currentIndex = (currentIndex + 1) % totalImages;
				showImage(currentIndex);
				if (sliderAnim) {
					sliderAnim.cancel();
					sliderAnim = null;
				}
				if (progressFill) {
					progressFill.style.width = '0%';
				}
			}

			function prevImage() {
				currentIndex = (currentIndex - 1 + totalImages) % totalImages;
				showImage(currentIndex);
				if (sliderAnim) {
					sliderAnim.cancel();
					sliderAnim = null;
				}
				if (progressFill) {
					progressFill.style.width = '0%';
				}
			}

			function startSlider() {
				if (totalImages &lt;= 1) return;

				if (sliderAnim) {
					sliderAnim.play();
					return;
				}

				if (progressFill) {
					progressFill.style.width = '0%';
					sliderAnim = progressFill.animate([{
							width: '0%',
							offset: 0
						},
						{
							width: '100%',
							offset: 3000 / 3500
						},
						{
							width: '100%',
							offset: 1
						}
					], {
						duration: 3500,
						easing: 'linear',
						fill: 'forwards'
					});

					sliderAnim.onfinish = () =&gt; {
						nextImage();
						sliderAnim = null;
						startSlider();
					};
				}
			}

			function stopSlider() {
				if (sliderAnim) {
					sliderAnim.pause();
				}
			}

			const bannerContainer = document.querySelector('.mobon_banner');
			bannerContainer.addEventListener('mouseenter', stopSlider);
			bannerContainer.addEventListener('mouseleave', startSlider);
			bannerContainer.addEventListener('click', () =&gt; {
				const product = allProducts[currentIndex];
				if (product &amp;&amp; product.purl) {
					window.open(product.purl);
				}
			});

			prevBtn.addEventListener('click', (e) =&gt; {
				e.stopPropagation();
				prevImage();
			});

			nextBtn.addEventListener('click', (e) =&gt; {
				e.stopPropagation();
				nextImage();
			});

			showImage(currentIndex);

			startSlider();
		})();
	&lt;/script&gt;
&lt;/body&gt;

	&lt;script&gt;
		(() =&gt; {
			const frameWidth = 300;
			const frameHeight = 250;
			const mainBanner = document.getElementById('noHiddenMobon');
			const fallbackBanner = document.getElementById('hiddenMobon');
			const sliderWrap = document.querySelector('.slider_wrap');
			const prevBtn = document.querySelector('.prev_btn');
			const nextBtn = document.querySelector('.next_btn');
			const currentIdxEl = document.querySelector('.current_idx');
			const totalIdxEl = document.querySelector('.total_idx');
			const pnmEl = document.querySelector('.pnm');
			const priceBoxEl = document.querySelector('.price_box');
			const saleRateEl = document.querySelector('.sale_rate');
			const salePriceEl = document.querySelector('.sale_price');
			const originalPriceEl = document.querySelector('.original_price');
			const allProducts = window.__mobonProducts;

			const imageHtml = allProducts.map((item, index) =&gt; {
				const activeClass = index === 0 ? 'active' : '';
				const srcAttr = index === 0 ?
					`src=&quot;${item.img}&quot; fetchpriority=&quot;high&quot;` :
					`data-src=&quot;${item.img}&quot;`;
				return `&lt;img class=&quot;img ${activeClass}&quot; ${srcAttr} decoding=&quot;async&quot; data-pcode=&quot;${item.pcode}&quot; alt=&quot;${item.pnm}&quot;&gt;`;
			}).join('');

			sliderWrap.innerHTML = imageHtml;

			const images = document.querySelectorAll('.slider_wrap .img');

			const loadRestImages = () =&gt; {
				images.forEach(img =&gt; {
					if (img.dataset.src) {
						img.src = img.dataset.src;
						delete img.dataset.src;
					}
				});
			};

			if (images[0]) {
				if (images[0].complete) {
					loadRestImages();
				} else {
					images[0].addEventListener('load', loadRestImages, { once: true });
					images[0].addEventListener('error', loadRestImages, { once: true });
				}
			}

			const handleImageErrors = () =&gt; {
				let isFallbackTriggered = false;
				const handleImageError = (event) =&gt; {
					if (isFallbackTriggered) return;
					isFallbackTriggered = true;
					const pcode = event.target.dataset.pcode || '';
					if (mainBanner) mainBanner.style.display = 'none';
					if (fallbackBanner) {
						fallbackBanner.style.display = 'block';
						fallbackBanner.style.width = `${frameWidth}px`;
						fallbackBanner.style.height = `${frameHeight}px`;
					}
					const errorUrl =
						`https://img.mobon.net/rtbShop?uid=${encodeURIComponent(&quot;qa-uuid&quot;)}&amp;u=qa-user&amp;pc=${pcode}&amp;itlTpCode=qa`;
					(new Image()).src = errorUrl;
				};
				images.forEach(img =&gt; {
					if (img.getAttribute('src') &amp;&amp; img.complete &amp;&amp; img.naturalHeight === 0) {
						handleImageError({
							target: img
						});
					} else {
						img.addEventListener('error', handleImageError);
					}
				});
			};
			handleImageErrors();


			const sliderControls = document.querySelector('.slider_controls');
			let currentIndex = 0;
			const totalImages = images.length;
			let intervalId;

			totalIdxEl.textContent = totalImages;

			if (totalImages &lt;= 1) {
				sliderControls.style.display = 'none';
				priceBoxEl.style.marginTop = 'auto';
			}

			const checkPanning = (img) =&gt; {
				const wrap = img.parentElement;
				if (!wrap.clientWidth || !wrap.clientHeight) return;

				const wrapRatio = wrap.clientWidth / wrap.clientHeight;
				const imgRatio = img.naturalWidth / img.naturalHeight;

				const overflowPx = imgRatio &gt; wrapRatio ?
					(wrap.clientHeight * imgRatio) - wrap.clientWidth :
					(wrap.clientWidth / imgRatio) - wrap.clientHeight;

				const overflowRatio = imgRatio &gt; wrapRatio ?
					overflowPx / wrap.clientWidth :
					overflowPx / wrap.clientHeight;

				if (overflowRatio &gt; 0.3) {
					img.classList.add('is-panning');
					img.style.animationDuration = overflowPx &lt;= 40 ? '3s' : '5s';
				} else {
					img.classList.remove('is-panning');
					img.style.animationDuration = '';
				}
			};

			function showImage(index) {
				images.forEach(img =&gt; img.classList.remove('active'));
				if (images[index]) {
					images[index].classList.add('active');

					if (images[index].complete &amp;&amp; images[index].naturalWidth &gt; 0) {
						checkPanning(images[index]);
					} else {
						images[index].addEventListener('load', () =&gt; checkPanning(images[index]), {
							once: true
						});
					}
				}
				currentIdxEl.textContent = index + 1;

				const product = allProducts[index];
				if (product) {
					pnmEl.textContent = product.pnm;

					let priceText = `${product.price}원`;

					if (product.prdt_prmct) {
						priceBoxEl.classList.add('sale');
						saleRateEl.innerHTML = (product.dc_rate ? product.dc_rate + '&lt;span&gt;%&lt;/span&gt;' : '');
						salePriceEl.textContent = `${product.prdt_prmct}원`;
						originalPriceEl.textContent = priceText;
					} else {
						priceBoxEl.classList.remove('sale');
						saleRateEl.innerHTML = '';
						salePriceEl.textContent = '';
						originalPriceEl.textContent = priceText;
					}
				}
			}

			function nextImage() {
				currentIndex = (currentIndex + 1) % totalImages;
				showImage(currentIndex);
			}

			function prevImage() {
				currentIndex = (currentIndex - 1 + totalImages) % totalImages;
				showImage(currentIndex);
			}

			function startSlider() {
				if (totalImages &lt;= 1) return;
				stopSlider();
				/* 3초 마다 */
				intervalId = setInterval(nextImage, 3000);
			}

			function stopSlider() {
				clearInterval(intervalId);
			}

			const bannerContainer = document.querySelector('.mobon_banner');
			bannerContainer.addEventListener('mouseenter', stopSlider);
			bannerContainer.addEventListener('mouseleave', startSlider);
			bannerContainer.addEventListener('click', () =&gt; {
				const product = allProducts[currentIndex];
				if (product &amp;&amp; product.purl) {
					window.open(product.purl);
				}
			});

			prevBtn.addEventListener('click', (e) =&gt; {
				e.stopPropagation();
				prevImage();
			});

			nextBtn.addEventListener('click', (e) =&gt; {
				e.stopPropagation();
				nextImage();
			});

			showImage(currentIndex);

			startSlider();
		})();
	&lt;/script&gt;

		&lt;div class=&quot;mobonLogo&quot; onclick=&quot;window.open('https://img.mobon.net/ad/linfo.php')&quot;&gt;&lt;/div&gt;

	&lt;script&gt;
		(() =&gt; {
			const frameWidth = 300;
			const frameHeight = 50;
			const mainBanner = document.getElementById('noHiddenMobon');
			const fallbackBanner = document.getElementById('hiddenMobon');
			const sliderWrap = document.querySelector('.slider_wrap');
			const pnmEl = document.querySelector('.pnm');
			const priceBoxEl = document.querySelector('.price_box');
			const saleRateEl = document.querySelector('.sale_rate');
			const salePriceEl = document.querySelector('.sale_price');
			const originalPriceEl = document.querySelector('.original_price');
			const allProducts = window.__mobonProducts;
			
			const imageHtml = allProducts.map((item, index) =&gt; {
				const activeClass = index === 0 ? 'active' : '';
				const srcAttr = index === 0 ?
					`src=&quot;${item.img}&quot; fetchpriority=&quot;high&quot;` :
					`data-src=&quot;${item.img}&quot;`;
				return `&lt;img class=&quot;img ${activeClass}&quot; ${srcAttr} decoding=&quot;async&quot; data-pcode=&quot;${item.pcode}&quot; alt=&quot;${item.pnm}&quot;&gt;`;
			}).join('');

			sliderWrap.innerHTML = imageHtml;

			const images = document.querySelectorAll('.slider_wrap .img');

			const loadRestImages = () =&gt; {
				images.forEach(img =&gt; {
					if (img.dataset.src) {
						img.src = img.dataset.src;
						delete img.dataset.src;
					}
				});
			};

			if (images[0]) {
				if (images[0].complete) {
					loadRestImages();
				} else {
					images[0].addEventListener('load', loadRestImages, { once: true });
					images[0].addEventListener('error', loadRestImages, { once: true });
				}
			}

			const handleImageErrors = () =&gt; {
				let isFallbackTriggered = false;
				const handleImageError = (event) =&gt; {
					if (isFallbackTriggered) return;
					isFallbackTriggered = true;
					const pcode = event.target.dataset.pcode || '';
					if (mainBanner) mainBanner.style.display = 'none';
					if (fallbackBanner) {
						fallbackBanner.style.display = 'block';
						fallbackBanner.style.width = `${frameWidth}px`;
						fallbackBanner.style.height = `${frameHeight}px`;
					}
					const errorUrl =
						`https://img.mobon.net/rtbShop?uid=${encodeURIComponent(&quot;qa-uuid&quot;)}&amp;u=qa-user&amp;pc=${pcode}&amp;itlTpCode=qa`;
					(new Image()).src = errorUrl;
				};
				images.forEach(img =&gt; {
					if (img.getAttribute('src') &amp;&amp; img.complete &amp;&amp; img.naturalHeight === 0) {
						handleImageError({
							target: img
						});
					} else {
						img.addEventListener('error', handleImageError);
					}
				});
			};
			handleImageErrors();


			let currentIndex = 0;
			const totalImages = images.length;
			let intervalId;
			const progressFill = document.querySelector('.progress_fill');

			const checkPanning = (img) =&gt; {
				const wrap = img.parentElement;
				if (!wrap.clientWidth || !wrap.clientHeight) return;

				const wrapRatio = wrap.clientWidth / wrap.clientHeight;
				const imgRatio = img.naturalWidth / img.naturalHeight;

				const overflowPx = imgRatio &gt; wrapRatio ?
					(wrap.clientHeight * imgRatio) - wrap.clientWidth :
					(wrap.clientWidth / imgRatio) - wrap.clientHeight;

				const overflowRatio = imgRatio &gt; wrapRatio ?
					overflowPx / wrap.clientWidth :
					overflowPx / wrap.clientHeight;

				if (overflowRatio &gt; 0.3) {
					img.classList.add('is-panning');
					img.style.animationDuration = overflowPx &lt;= 40 ? '3s' : '5s';
				} else {
					img.classList.remove('is-panning');
					img.style.animationDuration = '';
				}
			};

			function showImage(index) {
				images.forEach(img =&gt; img.classList.remove('active'));
				if (images[index]) {
					images[index].classList.add('active');

					if (images[index].complete &amp;&amp; images[index].naturalWidth &gt; 0) {
						checkPanning(images[index]);
					} else {
						images[index].addEventListener('load', () =&gt; checkPanning(images[index]), {
							once: true
						});
					}
				}

				const product = allProducts[index];
				if (product) {
					pnmEl.textContent = product.pnm;

					let priceText = `${product.price}원`;

					if (product.prdt_prmct) {
						priceBoxEl.classList.add('sale');
						saleRateEl.innerHTML = (product.dc_rate ? product.dc_rate + '&lt;span&gt;%&lt;/span&gt;' : '');
						salePriceEl.textContent = `${product.prdt_prmct}원`;
						originalPriceEl.textContent = priceText;
					} else {
						priceBoxEl.classList.remove('sale');
						saleRateEl.innerHTML = '';
						salePriceEl.textContent = '';
						originalPriceEl.textContent = priceText;
					}

					if (pnmEl.animate) {
						pnmEl.animate([{
								opacity: 0,
								transform: 'translateY(4px)'
							},
							{
								opacity: 1,
								transform: 'translateY(0)'
							}
						], {
							duration: 400,
							easing: 'ease-out'
						});

						priceBoxEl.animate([{
								opacity: 0,
								transform: 'translateY(4px)'
							},
							{
								opacity: 1,
								transform: 'translateY(0)'
							}
						], {
							duration: 400,
							delay: 50,
							easing: 'ease-out',
							fill: 'backwards'
						});
					}
				}
			}

			function nextImage() {
				currentIndex = (currentIndex + 1) % totalImages;
				showImage(currentIndex);
			}

			let sliderAnim = null;

			function startSlider() {
				if (totalImages &lt;= 1) return;

				if (sliderAnim) {
					sliderAnim.play();
					return;
				}

				if (progressFill) {
					progressFill.style.width = '0%';
					sliderAnim = progressFill.animate([{
							width: '0%',
							offset: 0
						},
						{
							width: '100%',
							offset: 3000 / 3500
						},
						{
							width: '100%',
							offset: 1
						}
					], {
						duration: 3500,
						easing: 'linear',
						fill: 'forwards'
					});

					sliderAnim.onfinish = () =&gt; {
						nextImage();
						sliderAnim = null;
						startSlider();
					};
				}
			}

			function stopSlider() {
				if (sliderAnim) {
					sliderAnim.pause();
				}
			}

			const bannerContainer = document.querySelector('.mobon_banner');
			bannerContainer.addEventListener('mouseenter', stopSlider);
			bannerContainer.addEventListener('mouseleave', startSlider);
			bannerContainer.addEventListener('click', () =&gt; {
				const product = allProducts[currentIndex];
				if (product &amp;&amp; product.purl) {
					window.open(product.purl);
				}
			});

			showImage(currentIndex);

			startSlider();
		})();
	&lt;/script&gt;

	&lt;script&gt;
		(() =&gt; {
			const frameWidth = 300;
			const frameHeight = 600;
			const mainBanner = document.getElementById('noHiddenMobon');
			const fallbackBanner = document.getElementById('hiddenMobon');
			const mainImgEl = document.querySelector('.img');
			const pnmEl = document.querySelector('.pnm');
			const priceBoxEl = document.querySelector('.price_box');
			const saleRateEl = document.querySelector('.sale_rate');
			const salePriceEl = document.querySelector('.sale_price');
			const originalPriceEl = document.querySelector('.original_price');
			const mobonBannerWrap = document.querySelector('.mobon_banner_wrap');

			const allProducts = window.__mobonProducts;
			if (allProducts.length &gt; 4) allProducts.length = 4;
			mobonBannerWrap.innerHTML = allProducts.map((item, index) =&gt; {
				return `&lt;div class=&quot;mobon_banner&quot; data-index=&quot;${index}&quot;&gt;
							&lt;img class=&quot;img&quot; src=&quot;${item.img}&quot; alt=&quot;${item.pnm}&quot; fetchpriority=&quot;${index === 0 ? 'high' : 'low'}&quot; decoding=&quot;async&quot;&gt;
						&lt;/div&gt;`;
			}).join('');

			const mobonBanners = document.querySelectorAll('.mobon_banner_wrap .mobon_banner');
			const mobonBanner = document.querySelector('.mobon_banner');

			let currentIndex = 0;
			const totalImages = allProducts.length;
			if (totalImages &lt;= 1) {
				mobonBannerWrap.style.display = 'none';
			}
			let intervalId;

			const checkPanning = (img) =&gt; {
				const wrap = img.parentElement;
				if (!wrap.clientWidth || !wrap.clientHeight) return;

				const wrapRatio = wrap.clientWidth / wrap.clientHeight;
				const imgRatio = img.naturalWidth / img.naturalHeight;

				const overflowPx = imgRatio &gt; wrapRatio ?
					(wrap.clientHeight * imgRatio) - wrap.clientWidth :
					(wrap.clientWidth / imgRatio) - wrap.clientHeight;

				const overflowRatio = imgRatio &gt; wrapRatio ?
					overflowPx / wrap.clientWidth :
					overflowPx / wrap.clientHeight;

				if (overflowRatio &gt; 0.3) {
					img.classList.add('is-panning');
					img.style.animationDuration = overflowPx &lt;= 40 ? '3s' : '5s';
				} else {
					img.classList.remove('is-panning');
					img.style.animationDuration = '';
				}
			};

			mobonBanners.forEach(banner =&gt; {
				const thumbImg = banner.querySelector('.img');
				if (thumbImg) {
					if (thumbImg.complete &amp;&amp; thumbImg.naturalWidth &gt; 0) {
						checkPanning(thumbImg);
					} else {
						thumbImg.addEventListener('load', () =&gt; checkPanning(thumbImg), { once: true });
					}
				}
			});

			function showProduct(index) {
				mobonBanners.forEach(t =&gt; t.classList.remove('active'));
				if (mobonBanners[index]) {
					mobonBanners[index].classList.add('active');
				}

				const product = allProducts[index];
				if (product) {
					mainImgEl.src = product.img;

					if (mainImgEl.complete &amp;&amp; mainImgEl.naturalWidth &gt; 0) {
						checkPanning(mainImgEl);
					} else {
						mainImgEl.addEventListener('load', () =&gt; checkPanning(mainImgEl), {
							once: true
						});
					}

					pnmEl.textContent = product.pnm;

					let priceText = `${product.price}원`;

					if (product.prdt_prmct) {
						priceBoxEl.classList.add('sale');
						saleRateEl.innerHTML = (product.dc_rate ? product.dc_rate + '&lt;span&gt;%&lt;/span&gt;' : '');
						salePriceEl.innerHTML = `${product.prdt_prmct}원`;
						originalPriceEl.textContent = priceText;
					} else {
						priceBoxEl.classList.remove('sale');
						saleRateEl.innerHTML = '';
						salePriceEl.textContent = '';
						originalPriceEl.textContent = priceText;
					}
				}
			}

			function nextProduct() {
				currentIndex = (currentIndex + 1) % totalImages;
				showProduct(currentIndex);
			}

			function startSlider() {
				if (totalImages &lt;= 1) return;
				stopSlider();
				intervalId = setInterval(nextProduct, 3000);
			}

			function stopSlider() {
				clearInterval(intervalId);
			}

			mobonBanner.addEventListener('mouseenter', stopSlider);
			mobonBanner.addEventListener('mouseleave', startSlider);

			mobonBanners.forEach(thumb =&gt; {
				thumb.addEventListener('mouseenter', () =&gt; {
					currentIndex = parseInt(thumb.getAttribute('data-index'));
					showProduct(currentIndex);
				});

				thumb.addEventListener('click', (e) =&gt; {
					e.stopPropagation();
					const index = parseInt(thumb.getAttribute('data-index'));
					const purl = allProducts[index].purl;
					if (purl &amp;&amp; purl !== &quot;javascript:void(0)&quot;) {
						window.open(purl, '_blank');
					}
				});
			});

			mobonBanner.addEventListener('click', () =&gt; {
				const purl = allProducts[currentIndex].purl;
				if (purl &amp;&amp; purl !== &quot;javascript:void(0)&quot;) {
					window.open(purl, '_blank');
				}
			});

			showProduct(currentIndex);
			startSlider();
		
			const handleImageErrors = () =&gt; {
				const allBannerImages = document.querySelectorAll('.img');
				let isFallbackTriggered = false;
				const handleImageError = (event) =&gt; {
					if (isFallbackTriggered) return;
					isFallbackTriggered = true;
					const pcode = event.target.dataset.pcode || '';
					if (mainBanner) mainBanner.style.display = 'none';
					if (fallbackBanner) {
						fallbackBanner.style.display = 'block';
						fallbackBanner.style.width = `${frameWidth}px`;
						fallbackBanner.style.height = `${frameHeight}px`;
					}
					const errorUrl = `https://img.mobon.net/rtbShop?uid=${encodeURIComponent(&quot;qa-uuid&quot;)}&amp;u=qa-user&amp;pc=${pcode}&amp;itlTpCode=qa`;
					(new Image()).src = errorUrl;
				};
				allBannerImages.forEach(img =&gt; {
					if (img.getAttribute('src') &amp;&amp; img.complete &amp;&amp; img.naturalHeight === 0) {
						handleImageError({ target: img });
					} else {
						img.addEventListener('error', handleImageError);
					}
				});
			};
			handleImageErrors();
		})();
	&lt;/script&gt;

			const totalIdxEl = document.querySelector('.total_idx');
			const pnmEl = document.querySelector('.pnm');
			const priceBoxEl = document.querySelector('.price_box');
			const saleRateEl = document.querySelector('.sale_rate');
			const salePriceEl = document.querySelector('.sale_price');
			const originalPriceEl = document.querySelector('.original_price');
			const allProducts = window.__mobonProducts;

			const imageHtml = allProducts.map((item, index) =&gt; {
				const activeClass = index === 0 ? 'active' : '';
				const srcAttr = index === 0 ?
					`src=&quot;${item.img}&quot; fetchpriority=&quot;high&quot;` :
					`data-src=&quot;${item.img}&quot;`;
				return `&lt;img class=&quot;img ${activeClass}&quot; ${srcAttr} decoding=&quot;async&quot; data-pcode=&quot;${item.pcode}&quot; alt=&quot;${item.pnm}&quot;&gt;`;
			}).join('');

			sliderWrap.innerHTML = imageHtml;

			const images = document.querySelectorAll('.slider_wrap .img');

			const loadRestImages = () =&gt; {
				images.forEach(img =&gt; {
					if (img.dataset.src) {
						img.src = img.dataset.src;
						delete img.dataset.src;
					}
				});
			};

			if (images[0]) {
				if (images[0].complete) {
					loadRestImages();

					if (isFallbackTriggered) return;
					isFallbackTriggered = true;
					const pcode = event.target.dataset.pcode || '';
					if (mainBanner) mainBanner.style.display = 'none';
					if (fallbackBanner) {
						fallbackBanner.style.display = 'block';
						fallbackBanner.style.width = `${frameWidth}px`;
						fallbackBanner.style.height = `${frameHeight}px`;
					}
					const errorUrl =
						`https://img.mobon.net/rtbShop?uid=${encodeURIComponent(&quot;qa-uuid&quot;)}&amp;u=qa-user&amp;pc=${pcode}&amp;itlTpCode=qa`;
					(new Image()).src = errorUrl;
				};
				images.forEach(img =&gt; {
					if (img.getAttribute('src') &amp;&amp; img.complete &amp;&amp; img.naturalHeight === 0) {
						handleImageError({

						});
					} else {
						img.addEventListener('error', handleImageError);
					}
				});

			handleImageErrors();


			const sliderControls = document.querySelector('.slider_controls');
			let currentIndex = 0;

			totalIdxEl.textContent = totalImages;

			if (totalImages &lt;= 1) {
				sliderControls.style.display = 'none';
				priceBoxEl.style.marginTop = 'auto';
			}

			const checkPanning = (img) =&gt; {
				const wrap = img.parentElement;
				if (!wrap.clientWidth || !wrap.clientHeight) return;

				const wrapRatio = wrap.clientWidth / wrap.clientHeight;
				const imgRatio = img.naturalWidth / img.naturalHeight;

				const overflowPx = imgRatio &gt; wrapRatio ?
					(wrap.clientHeight * imgRatio) - wrap.clientWidth :
					(wrap.clientWidth / imgRatio) - wrap.clientHeight;

				const overflowRatio = imgRatio &gt; wrapRatio ?
					overflowPx / wrap.clientWidth :
					overflowPx / wrap.clientHeight;

				if (overflowRatio &gt; 0.3) {
					img.classList.add('is-panning');
					img.style.animationDuration = overflowPx &lt;= 40 ? '3s' : '5s';
				} else {
					img.classList.remove('is-panning');
					img.style.animationDuration = '';
				}
			};

			function showImage(index) {
				images.forEach(img =&gt; img.classList.remove('active'));
				if (images[index]) {
					images[index].classList.add('active');

					if (images[index].complete &amp;&amp; images[index].naturalWidth &gt; 0) {
						checkPanning(images[index]);
					} else {
						images[index].addEventListener('load', () =&gt; checkPanning(images[index]), {
							once: true
						});
					}
				}
				currentIdxEl.textContent = index + 1;

				const product = allProducts[index];
				if (product) {
					pnmEl.textContent = product.pnm;

					let priceText = `${product.price}원`;

					if (product.prdt_prmct) {
						priceBoxEl.classList.add('sale');
						saleRateEl.innerHTML = (product.dc_rate ? product.dc_rate + '&lt;span&gt;%&lt;/span&gt;' : '');
						salePriceEl.textContent = `${product.prdt_prmct}원`;
						originalPriceEl.textContent = priceText;
					} else {
						priceBoxEl.classList.remove('sale');
						saleRateEl.innerHTML = '';
						salePriceEl.textContent = '';
						originalPriceEl.textContent = priceText;
					}
				}
			}

			function nextImage() {
				currentIndex = (currentIndex + 1) % totalImages;
				showImage(currentIndex);
			}

			function prevImage() {
				currentIndex = (currentIndex - 1 + totalImages) % totalImages;
				showImage(currentIndex);
			}

			function startSlider() {
				if (totalImages &lt;= 1) return;
				stopSlider();
				/* 3초 마다 */
				intervalId = setInterval(nextImage, 3000);
			}

			function stopSlider() {
				clearInterval(intervalId);
			}

			const bannerContainer = document.querySelector('.mobon_banner');
			bannerContainer.addEventListener('mouseenter', stopSlider);
			bannerContainer.addEventListener('mouseleave', startSlider);
			bannerContainer.addEventListener('click', () =&gt; {
				const product = allProducts[currentIndex];
				if (product &amp;&amp; product.purl) {
					window.open(product.purl);
				}
			});

			prevBtn.addEventListener('click', (e) =&gt; {
				e.stopPropagation();
				prevImage();
			});

			nextBtn.addEventListener('click', (e) =&gt; {
				e.stopPropagation();
				nextImage();
			});

			showImage(currentIndex);

			startSlider();
		})();
	&lt;/script&gt;

	&lt;script&gt;
		(() =&gt; {
			const frameWidth = 468;
			const frameHeight = 60;
			const mainBanner = document.getElementById('noHiddenMobon');
			const fallbackBanner = document.getElementById('hiddenMobon');
			const mainImgEl = document.querySelector('.img');
			const pnmEl = document.querySelector('.pnm');
			const priceBoxEl = document.querySelector('.price_box');
			const saleRateEl = document.querySelector('.sale_rate');
			const salePriceEl = document.querySelector('.sale_price');
			const originalPriceEl = document.querySelector('.original_price');
			const mobonBannerWrap = document.querySelector('.mobon_banner_wrap');
			const allProducts = window.__mobonProducts;
			if (allProducts.length &gt; 4) allProducts.length = 4;
			mobonBannerWrap.innerHTML = allProducts.map((item, index) =&gt; {
				return `&lt;div class=&quot;mobon_banner&quot; data-index=&quot;${index}&quot;&gt;
							&lt;img class=&quot;img&quot; src=&quot;${item.img}&quot; alt=&quot;${item.pnm}&quot; fetchpriority=&quot;${index === 0 ? 'high' : 'low'}&quot; decoding=&quot;async&quot;&gt;
						&lt;/div&gt;`;
			}).join('');

			const mobonBanners = document.querySelectorAll('.mobon_banner_wrap .mobon_banner');
			const mobonBanner = document.querySelector('.mobon_banner');

			let currentIndex = 0;
			const totalImages = allProducts.length;
			if (totalImages &lt;= 1) {
				mobonBannerWrap.style.display = 'none';
			}
			let intervalId;

			const checkPanning = (img) =&gt; {
				const wrap = img.parentElement;
				if (!wrap.clientWidth || !wrap.clientHeight) return;

				const wrapRatio = wrap.clientWidth / wrap.clientHeight;
				const imgRatio = img.naturalWidth / img.naturalHeight;

				const overflowPx = imgRatio &gt; wrapRatio ?
					(wrap.clientHeight * imgRatio) - wrap.clientWidth :
					(wrap.clientWidth / imgRatio) - wrap.clientHeight;

				const overflowRatio = imgRatio &gt; wrapRatio ?
					overflowPx / wrap.clientWidth :
					overflowPx / wrap.clientHeight;

				if (overflowRatio &gt; 0.3) {
					img.classList.add('is-panning');
					img.style.animationDuration = overflowPx &lt;= 40 ? '3s' : '5s';
				} else {
					img.classList.remove('is-panning');
					img.style.animationDuration = '';
				}
			};

			mobonBanners.forEach(banner =&gt; {
				const thumbImg = banner.querySelector('.img');
				if (thumbImg) {
					if (thumbImg.complete &amp;&amp; thumbImg.naturalWidth &gt; 0) {
						checkPanning(thumbImg);
					} else {
						thumbImg.addEventListener('load', () =&gt; checkPanning(thumbImg), {
							once: true
						});
					}
				}
			});

			function showProduct(index) {
				mobonBanners.forEach(t =&gt; t.classList.remove('active'));
				if (mobonBanners[index]) {
					mobonBanners[index].classList.add('active');
				}

				const product = allProducts[index];
				if (product) {
					mainImgEl.src = product.img;

					if (mainImgEl.complete &amp;&amp; mainImgEl.naturalWidth &gt; 0) {
						checkPanning(mainImgEl);
					} else {
						mainImgEl.addEventListener('load', () =&gt; checkPanning(mainImgEl), {
							once: true
						});
					}

					pnmEl.textContent = product.pnm;

					let priceText = `${product.price}원`;

					if (product.prdt_prmct) {
						priceBoxEl.classList.add('sale');
						saleRateEl.innerHTML = (product.dc_rate ? product.dc_rate + '&lt;span&gt;%&lt;/span&gt;' : '');
						salePriceEl.innerHTML = `${product.prdt_prmct}원`;
						originalPriceEl.textContent = priceText;
					} else {
						priceBoxEl.classList.remove('sale');
						saleRateEl.innerHTML = '';
						salePriceEl.textContent = '';
						originalPriceEl.textContent = priceText;
					}
				}
			}

			function nextProduct() {
				currentIndex = (currentIndex + 1) % totalImages;
				showProduct(currentIndex);
			}

			function startSlider() {
				if (totalImages &lt;= 1) return;
				stopSlider();
				intervalId = setInterval(nextProduct, 3000);
			}

			function stopSlider() {
				clearInterval(intervalId);
			}

			mobonBanner.addEventListener('mouseenter', stopSlider);
			mobonBanner.addEventListener('mouseleave', startSlider);

			mobonBanners.forEach(thumb =&gt; {
				thumb.addEventListener('mouseenter', () =&gt; {
					currentIndex = parseInt(thumb.getAttribute('data-index'));
					showProduct(currentIndex);
				});

				thumb.addEventListener('click', (e) =&gt; {
					e.stopPropagation();
					const index = parseInt(thumb.getAttribute('data-index'));
					const purl = allProducts[index].purl;
					if (purl &amp;&amp; purl !== &quot;javascript:void(0)&quot;) {
						window.open(purl, '_blank');
					}
				});
			});

			mobonBanner.addEventListener('click', () =&gt; {
				const purl = allProducts[currentIndex].purl;
				if (purl &amp;&amp; purl !== &quot;javascript:void(0)&quot;) {
					window.open(purl, '_blank');
				}
			});

			showProduct(currentIndex);
			startSlider();

			const handleImageErrors = () =&gt; {
				const allBannerImages = document.querySelectorAll('.img');
				let isFallbackTriggered = false;
				const handleImageError = (event) =&gt; {
					if (isFallbackTriggered) return;
					isFallbackTriggered = true;
					const pcode = event.target.dataset.pcode || '';
					if (mainBanner) mainBanner.style.display = 'none';
					if (fallbackBanner) {
						fallbackBanner.style.display = 'block';
						fallbackBanner.style.width = `${frameWidth}px`;
						fallbackBanner.style.height = `${frameHeight}px`;
					}
					const errorUrl =
						`https://img.mobon.net/rtbShop?uid=${encodeURIComponent(&quot;qa-uuid&quot;)}&amp;u=qa-user&amp;pc=${pcode}&amp;itlTpCode=qa`;
					(new Image()).src = errorUrl;
				};
				allBannerImages.forEach(img =&gt; {
					if (img.getAttribute('src') &amp;&amp; img.complete &amp;&amp; img.naturalHeight === 0) {
						handleImageError({
							target: img
						});
					} else {
						img.addEventListener('error', handleImageError);
					}
				});
			};
			handleImageErrors();
		})();
	&lt;/script&gt;

					currentIndex = parseInt(thumb.getAttribute('data-index'));
					showProduct(currentIndex);
				});

				thumb.addEventListener('click', (e) =&gt; {
					e.stopPropagation();
					const index = parseInt(thumb.getAttribute('data-index'));
					const purl = allProducts[index].purl;
					if (purl &amp;&amp; purl !== &quot;javascript:void(0)&quot;) {
						window.open(purl, '_blank');
					}
				});
			});

			mobonBanner.addEventListener('click', () =&gt; {
				const purl = allProducts[currentIndex].purl;
				if (purl &amp;&amp; purl !== &quot;javascript:void(0)&quot;) {
					window.open(purl, '_blank');
				}
			});

			showProduct(currentIndex);
			startSlider();

			const handleImageErrors = () =&gt; {
				const allBannerImages = document.querySelectorAll('.img');
				let isFallbackTriggered = false;
				const handleImageError = (event) =&gt; {
					if (isFallbackTriggered) return;
					isFallbackTriggered = true;
					const pcode = event.target.dataset.pcode || '';
					if (mainBanner) mainBanner.style.display = 'none';
					if (fallbackBanner) {
						fallbackBanner.style.display = 'block';
						fallbackBanner.style.width = `${frameWidth}px`;
						fallbackBanner.style.height = `${frameHeight}px`;
					}
					const errorUrl =
						`https://img.mobon.net/rtbShop?uid=${encodeURIComponent(&quot;qa-uuid&quot;)}&amp;u=qa-user&amp;pc=${pcode}&amp;itlTpCode=qa`;
					(new Image()).src = errorUrl;
				};
				allBannerImages.forEach(img =&gt; {
					if (img.getAttribute('src') &amp;&amp; img.complete &amp;&amp; img.naturalHeight === 0) {
						handleImageError({
							target: img
						});
					} else {
						img.addEventListener('error', handleImageError);
					}
				});
			};
			handleImageErrors();
		})();
	&lt;/script&gt;
&lt;/body&gt;

&lt;/html&gt;"></iframe>
		</div>
	</div>

	<script>
		setTimeout(() => {
			let pass = 0, fail = 0;
			document.querySelectorAll('.item').forEach(item => {
				const iframe = item.querySelector('iframe');
				const box = item.querySelector('.result');
				const msgs = [];
				const info = [];
				try {
					const d = iframe.contentDocument;
					const main = d.getElementById('noHiddenMobon');
					const fb = d.getElementById('hiddenMobon');
					const imgs = [...d.querySelectorAll('.img')];

					if (!main || main.style.display === 'none') msgs.push('본 배너 숨김');
					if (fb && fb.style.display === 'block') msgs.push('대체 배너로 전환됨');
					if (!imgs.length) msgs.push('상품 이미지 없음');
					const noSrc = imgs.filter(i => !i.getAttribute('src'));
					if (noSrc.length) msgs.push(noSrc.length + '장 src 미할당');
					const broken = imgs.filter(i => i.complete && i.naturalHeight === 0);
					if (broken.length) msgs.push(broken.length + '장 로드 실패');
					const pnm = d.querySelector('.pnm');
					if (pnm && !pnm.textContent.trim()) msgs.push('상품명 비어있음');
					// 가격은 정가/할인가 중 하나라도 채워져 있으면 정상 (할인 없는 상품은 할인가 칸이 빈다)
					const priceEls = [...d.querySelectorAll('.original_price, .sale_price')];
					if (priceEls.length && !priceEls.some(el => el.textContent.trim())) msgs.push('가격 전부 비어있음');
					info.push('이미지 ' + imgs.length + '장');
				} catch (e) {
					msgs.push('검사 실패: ' + e.message);
				}
				const bad = msgs.length > 0;
				box.className = 'result ' + (bad ? 'fail' : 'pass');
				box.textContent = (bad ? '문제: ' + msgs.join(', ') + ' / ' : '정상 · ') + info.join(', ');
				bad ? fail++ : pass++;
			});
			const s = document.getElementById('summary');
			s.textContent = '통과 ' + pass + ' / 문제 ' + fail;
			s.className = 'summary ' + (fail ? 'fail' : 'pass');
		}, 4000);
	</script>
