<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>카카오 배너</title>
	<style>
		/* 1. 웹 폰트 */
		@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");
		@import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap");

		/* 2. 배너 & 이미지 규격 */
		:root {
			--width: 250px;
			--height: 250px;
		}

		/* 3. 공통사항 */
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		.mobonLogo {
			position: absolute;
			top: 2px;
			right: 2px;
			width: 11px;
			height: 11px;
			background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo02.png') center center;
			background-size: 11px 11px;
			opacity: 0.8;
			z-index: 1001;
			cursor: pointer;
		}

		.mobonLogo:hover {
			width: 73px;
			height: 15px;
			background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo_over02.png') center center;
			background-size: 73px 15px;
		}

		/* 4. 해당 사이즈 배너 */
		.mobon_reset {
			position: relative;
			width: var(--width);
			height: var(--height);
			font-family: "pretendard", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
			color: #fff;
			background: #111;
			overflow: hidden;
		}

		.mobon_banner_wrap {
			position: relative;
			width: 100%;
			height: 100%;
			cursor: pointer;
			display: flex;
			gap: 2px;
		}

		img {
			display: block;
		}

		.pnm {
			overflow: hidden;
			white-space: nowrap;
			text-overflow: ellipsis;
			max-width: 100%;
			min-width: 0;
			font-size: 11px !important;
		}

		.from {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 5px;
			font-size: 11px;
			color: rgba(255,255,255,.75);
		}

		.from .was {
			text-decoration: line-through;
			text-decoration-color: #e8232a;
			text-decoration-thickness: 1.5px;
		}

		.from .dn {
			font-weight: 800;
			align-items: center;
			gap: 1px;
			background: #e8232a;
			color: #fff;
			border-radius: 2px;
			font-family: Montserrat, pretendard, sans-serif;
			display: inline-block;
			font-size: 12px !important;
			padding: 2px 7px;
		}

		.from .dn::before {
			content: '';
		}

		.swap .from .dn {
			animation: dnpop .5s .3s cubic-bezier(.2,1.8,.4,1) both;
		}

		@keyframes dnpop {
			from {
				transform: scale(.4);
				opacity: 0;
			}

			to {
				transform: scale(1);
				opacity: 1;
			}
		}

		.odo {
			display: flex;
			align-items: baseline;
			line-height: 1;
			color: #fff;
			font-family: "Montserrat", "pretendard", sans-serif;
			font-weight: 700;
			letter-spacing: -1px;
			justify-content: flex-start;
			text-shadow: 0 2px 8px rgba(0,0,0,.45);
			font-size: 17px !important;
		}

		.odo .d {
			position: relative;
			display: inline-block;
			overflow: hidden;
			height: 1em;
		}

		.odo .d .col {
			display: flex;
			flex-direction: column;
			transition: transform .7s cubic-bezier(.2, .8, .2, 1);
		}

		.odo .d .col span {
			display: block;
			height: 1em;
			line-height: 1;
		}

		.odo .s {
			display: inline-block;
		}

		.odo .won {
			font-weight: 700;
			font-size: .68em !important;
			margin-left: 2px;
		}

		img.is-panning {
			animation: panImage var(--pd, 10s) ease-in-out infinite;
		}

		@keyframes panImage {
			0%, 100% {
				object-position: 50% 50%;
			}

			25% {
				object-position: 0% 0%;
			}

			75% {
				object-position: 100% 100%;
			}
		}

		.mobon_banner_wrap > .thumb {
			position: relative;
			flex: 1;
			overflow: hidden;
			transition: flex .7s cubic-bezier(.65, 0, .25, 1), opacity .5s;
			opacity: .7;
		}

		.mobon_banner_wrap > .thumb.active {
			flex: 3.2;
			opacity: 1;
		}

		.mobon_banner_wrap > .thumb img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.cap {
			position: absolute;
			left: 0;
			bottom: 0;
			z-index: 3;
			width: 151px;
			padding: 10px 10px;
			overflow: hidden;
			display: flex;
			flex-direction: column;
			gap: 2px;
			pointer-events: none;
			transition: left .7s cubic-bezier(.65, 0, .25, 1);
			top: 0;
			justify-content: flex-end;
			background: linear-gradient(to top, rgba(0,0,0,.7), rgba(0,0,0,0) 110px);
		}

		.cap .from {
			justify-content: flex-start;
			font-size: 10px;
		}

		.cap .pnm {
			font-size: 10px;
			max-width: 100%;
		}

		.main_img {
			display: none;
		}

		.badge {
			align-self: flex-start;
			font-weight: 800;
			color: #fff;
			background: #e8232a;
			padding: 2px 7px;
			border-radius: 2px;
			margin-bottom: 3px;
			padding-left: 7.5px;
			padding-right: 7.5px;
			font-size: 11px;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			height: 19px;
			line-height: 1;
			padding-top: 1px;
			padding-bottom: 0;
			box-sizing: border-box;
		}

		.badge.reg {
			background: #111;
		}

		.badge:not(.reg) {
			color: #e8232a;
			background: #fff;
			border: 1px solid #e8232a;
			padding: 1px 6px;
			padding-left: 7.5px;
			padding-right: 7.5px;
		}

		.thumb.active::after {
			content: '';
			position: absolute;
			inset: -30%;
			z-index: 4;
			pointer-events: none;
			mix-blend-mode: soft-light;
			background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.75), rgba(255,255,255,0) 35%);
			animation: lxsp 5.6s ease-in-out infinite alternate;
		}

		@keyframes lxsp {
			0% {
				transform: translate(-22%, -18%);
			}

			100% {
				transform: translate(22%, 12%);
			}
		}

		.cap .badge {
			position: absolute;
			left: 10px;
			top: 10px;
			margin: 0;
		}

		/* 5. 대체 배너 */
		.fallback_banner {
			display: none;
			position: relative;
			width: var(--width);
			height: var(--height);
			overflow: hidden;
		}

		.fallback_link {
			display: block;
			width: 100%;
			height: 100%;
			cursor: pointer;
		}

		.fallback_banner img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}
	</style>
</head>

<body>
	<div class="mobon_reset" id="noHiddenMobon">
		<div class="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
		<div class="mobon_banner_wrap" onclick="window.open(this.dataset.purl)" data-purl="{{purl1}}">
			<!-- 썸네일 리스트 -->
			<div class="thumb active" onclick="event.stopPropagation(); window.open('{{purl1}}')" data-purl="{{purl1}}" data-pnm="{{pnm1}}" data-price="{{price1}}" data-sale="{{price2_1}}" data-rate="{{discount1}}" data-box="{{box1}}"><img class="img" src="{{img1}}" data-pcode="{{pcode1}}" alt="{{pnm1}}"></div>
			<div class="thumb" onclick="event.stopPropagation(); window.open('{{purl2}}')" data-purl="{{purl2}}" data-pnm="{{pnm2}}" data-price="{{price2}}" data-sale="{{price2_2}}" data-rate="{{discount2}}" data-box="{{box2}}"><img class="img" src="{{img2}}" data-pcode="{{pcode2}}" alt="{{pnm2}}"></div>
			<div class="thumb" onclick="event.stopPropagation(); window.open('{{purl3}}')" data-purl="{{purl3}}" data-pnm="{{pnm3}}" data-price="{{price3}}" data-sale="{{price2_3}}" data-rate="{{discount3}}" data-box="{{box3}}"><img class="img" src="{{img3}}" data-pcode="{{pcode3}}" alt="{{pnm3}}"></div>
			<!-- 가격 -->
			<div class="cap">
				<span class="badge"></span>
				<div class="from"></div>
				<div class="odo"></div>
				<p class="pnm">{{pnm1}}</p>
			</div>
			<img class="main_img" src="{{img1}}" alt="">
		</div>
	</div>
	<!-- 노출 추적 태그 -->
	{{wp_imgtag}}

	<!-- 대체 배너 영역 -->
	<div class="fallback_banner" id="hiddenMobon">
		<div class="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
		<div class="fallback_link" onclick="window.open('https://mobon.net/bridge/')">
			<img src="{{HTTP}}/servlet/image/mobon/250x250.png" alt="대체배너">
		</div>
	</div>

	<!-- 이미지 에러 감지 -->
	<script>
		(() => {
			const mainBanner = document.getElementById('noHiddenMobon');
			const fallbackBanner = document.getElementById('hiddenMobon');
			const images = document.querySelectorAll('.img');

			let isFallbackTriggered = false;

			const handleImageError = (event) => {
				if (isFallbackTriggered) return;
				isFallbackTriggered = true;

				const pcode = event.target.dataset.pcode || '';

				if (mainBanner) mainBanner.style.display = 'none';
				if (fallbackBanner) fallbackBanner.style.display = 'block';

				const errorUrl =
					`{{HTTP_DR}}/rtbShop?uid=${encodeURIComponent("{{UUID}}")}&u={{USER}}&pc=${pcode}&itlTpCode={{ITL_TP_CODE}}`;
				(new Image()).src = errorUrl;
			};

			images.forEach(img => {
				if (img.complete && img.naturalHeight === 0) {
					handleImageError({
						target: img
					});
				} else {
					img.addEventListener('error', handleImageError);
				}
			});
		})();
	</script>

	<!-- 서버 치환값 정리 -->
	<script>
		(() => {
			const wrap = document.querySelector('.mobon_banner_wrap');
			const clean = (v) => /\{\{/.test(v || '') ? '' : (v || '').trim();
			const num = (v) => +String(v).replace(/[^0-9]/g, '');
			document.querySelectorAll('.thumb').forEach(t => {
				const d = t.dataset;
				const box = clean(d.box);
				const price = clean(d.price).replace(/원/g, '').trim();
				const sale = clean(d.sale).replace(/원/g, '').trim();
				const isSale = box ? /sale/i.test(box) : (!!sale && num(sale) > 0 && num(sale) < num(price));
				let rate = clean(d.rate).replace(/%/g, '').trim();
				if (isSale && !/^[0-9]+$/.test(rate) && num(price) > num(sale)) rate = String(Math.round((1 - num(sale) / num(price)) * 100));
				d.price = price;
				d.sale = isSale ? sale : '';
				d.rate = isSale ? rate : '';
			});
			document.addEventListener('bshow', e => { if (wrap && e.detail.d.purl) wrap.dataset.purl = e.detail.d.purl; });
		})();
	</script>

	<script>
		// 상품 전환
		(() => {
			const reset = document.querySelector('.mobon_reset');
			const mainImgs = Array.from(document.querySelectorAll('.main_img'));
			const thumbs = Array.from(document.querySelectorAll('.thumb'));
			const pnmEl = document.querySelector('.pnm');
			let current = 0;
			let timer = null;

			const show = (i) => {
				const t = thumbs[i];
				if (!t) return;
				current = i;
				thumbs.forEach(x => x.classList.remove('active'));
				t.classList.add('active');

				const img = t.querySelector('img');
				document.querySelectorAll('.prev_img').forEach(p => { if (mainImgs[0]) p.src = mainImgs[0].src; });
				if (img) mainImgs.forEach(m => { m.src = img.src; m.alt = img.alt; });

				// 전환 애니메이션 재시작
				reset.classList.remove('swap');
				void reset.offsetWidth;
				reset.classList.add('swap');

				if (pnmEl) pnmEl.textContent = t.dataset.pnm;
				document.dispatchEvent(new CustomEvent('bshow', { detail: { i, d: t.dataset } }));
			};

			// 3초마다 다음 상품, 마우스 올리면 멈춤
			const stop = () => {
				clearInterval(timer);
				timer = null;
			};
			const start = () => {
				stop();
				if (thumbs.length > 1) timer = setInterval(() => show((current + 1) % thumbs.length), 3000);
			};

			// 썸네일 호버 시 전환
			let lastX = null;
			let lastY = null;
			const hover = (e, i) => {
				const moved = e.clientX !== lastX || e.clientY !== lastY;
				lastX = e.clientX;
				lastY = e.clientY;
				if (moved && i !== current) show(i);
			};
			thumbs.forEach((t, i) => {
				t.addEventListener('mouseenter', e => hover(e, i));
				t.addEventListener('mousemove', e => hover(e, i));
			});
			reset.addEventListener('mouseenter', stop);
			reset.addEventListener('mouseleave', start);
			show(0);
			start();
		})();

		// 가격
		(() => {
			const odo = document.querySelector('.odo');
			const from = document.querySelector('.from');
			let cols = [];

			const build = (str) => {
				odo.innerHTML = '';
				cols = [...str].map(ch => {
					if (/[0-9]/.test(ch)) {
						const d = document.createElement('span');
						d.className = 'd';
						const c = document.createElement('span');
						c.className = 'col';
						c.innerHTML = '0123456789'.split('').map(n => '<span>' + n + '</span>').join('');
						d.appendChild(c);
						odo.appendChild(d);
						return c;
					}
					const s = document.createElement('span');
					s.className = 's';
					s.textContent = ch;
					odo.appendChild(s);
					return null;
				});
				const w = document.createElement('span');
				w.className = 'won';
				w.textContent = '원';
				odo.appendChild(w);
			};

			const set = (str) => {
				[...str].forEach((ch, i) => {
					const c = cols[i];
					if (c) c.style.transform = 'translateY(-' + (+ch) + 'em)';
				});
			};

			const apply = (d) => {
				const sale = !!d.sale;
				const target = sale ? d.sale : d.price;
				const same = cols.length === target.length && [...target].every((ch, i) => (/[0-9]/.test(ch)) === !!cols[i]);
				if (!same) {
					build(target);
					set(sale ? d.price : target);
				} else if (sale) {
					set(d.price);
				}
				requestAnimationFrame(() => requestAnimationFrame(() => set(target)));
				from.innerHTML = sale ?
					'<span class="was">' + d.price + '원</span><span class="dn">' + d.rate + '%</span>' :
					'<span>정상가</span>';
			};

			document.addEventListener('bshow', e => apply(e.detail.d));
			const first = document.querySelector('.thumb');
			if (first) apply(first.dataset);
		})();

		// 가격 칸 위치
		(() => {
			const cap = document.querySelector('.cap');
			const narrow = (250 - 4) / 5.2;
			document.addEventListener('bshow', e => { cap.style.left = (e.detail.i * (narrow + 2)) + 'px'; });
		})();

		// 배지
		(() => {
			const badge = document.querySelector('.badge');
			const setBadge = (d) => {
				badge.textContent = d.sale ? '비밀특가' : 'SNS 핫템';
				badge.classList.toggle('reg', !d.sale);
			};
			document.addEventListener('bshow', e => setBadge(e.detail.d));
			const first = document.querySelector('.thumb');
			if (first) setBadge(first.dataset);
		})();

		// 이미지 패닝
		(() => {
			const check = (img, fresh) => {
				const wrap = img.parentElement;
				if (!img.naturalWidth || !wrap.clientWidth || !wrap.clientHeight) return;
				const wrapRatio = wrap.clientWidth / wrap.clientHeight;
				const imgRatio = img.naturalWidth / img.naturalHeight;
				const overflowPx = imgRatio > wrapRatio ?
					wrap.clientHeight * imgRatio - wrap.clientWidth :
					wrap.clientWidth / imgRatio - wrap.clientHeight;
				const overflowRatio = imgRatio > wrapRatio ? overflowPx / wrap.clientWidth : overflowPx / wrap.clientHeight;
				if (overflowRatio > 0.3) {
					if (!img.classList.contains('is-panning')) {
						img.style.setProperty('--pd', overflowPx <= 40 ? '6s' : '10s');
						img.classList.add('is-panning');
					}
				} else if (fresh) {
					img.classList.remove('is-panning');
				}
			};
			const imgs = () => Array.from(document.querySelectorAll('.mobon_banner_wrap img')).filter(i => i.offsetParent !== null);
			const all = () => imgs().forEach(check);
			document.querySelectorAll('.mobon_banner_wrap img').forEach(i => i.addEventListener('load', () => check(i, true)));
			document.addEventListener('bshow', () => {
				all();
				setTimeout(all, 760);
			});
			all();
		})();
	</script>
</body>

</html>
