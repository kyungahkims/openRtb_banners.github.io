<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Kakao Accordion · Tetris Banners Preview</title>
	<style>
		@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");

		html {
			scroll-behavior: smooth;
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: "pretendard";
			background-color: #f4f5f7;
			padding: 30px 30px 10px;
		}

		.control-panel {
			position: sticky;
			top: 0;
			background: rgba(255, 255, 255, 0.75);
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
			padding: 16px 40px;
			margin: -30px -30px 40px -30px;
			border-bottom: 1px solid rgba(0, 0, 0, 0.06);
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
			z-index: 100;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 28px;
		}

		.control-panel h1 {
			flex-shrink: 0;
			font-size: 22px;
			font-weight: 800;
			color: #1a1a1a;
			letter-spacing: -0.5px;
		}

		.control-panel p {
			flex: 1;
			line-height: 1.7;
			font-size: 14px;
			color: #444;
		}

		.control-panel p b {
			color: #1a1a1a;
			margin-right: 2px;
		}

		/* 제목과 배너 3개가 한 줄에 */
		.section {
			display: flex;
			align-items: flex-start;
			gap: 30px;
			scroll-margin-top: 115px;
		}

		/* 섹션 사이 여백 */
		.section+.section {
			margin-top: 40px;
		}

		.section-title {
			flex: 0 0 100px;
			padding-top: 30px;
			font-size: 20px;
			font-weight: 800;
			color: #1a1a1a;
		}

		/* 3 사이즈 한 줄에 나란히 (좁으면 줄바꿈) */
		.banner-grid.row {
			display: flex;
			flex-direction: row;
			flex-wrap: wrap;
			gap: 40px;
			align-items: flex-start;
		}

		.banner-container {
			display: flex;
			flex-direction: column;
			align-items: center;
			background: #ffffff;
			padding: 30px;
			border-radius: 16px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
			transition: transform 0.2s ease;
		}

		.banner-container:hover {
			transform: translateY(-5px);
		}

		.banner-title {
			font-size: 18px;
			font-weight: 700;
			margin-bottom: 20px;
			color: #1a1a1a;
			letter-spacing: -0.5px;
		}

		iframe {
			box-sizing: content-box;
			display: block;
			border: 1px solid #e6e6e6;
			background-color: #fff;
		}

		@media (max-width: 600px) {
			body {
				padding: 20px 10px;
			}

			.control-panel {
				margin: -20px -10px 30px -10px;
				padding: 12px 16px;
				flex-direction: column;
				align-items: flex-start;
				gap: 6px;
			}

			.section {
				flex-direction: column;
				gap: 10px;
			}

			.section-title {
				flex: none;
				padding-top: 0;
			}

			.banner-container {
				width: 100%;
				max-width: 100%;
				padding: 30px 0;
			}

			.banner-title {
				font-size: 14px;
				margin-bottom: 15px;
			}
		}
	</style>
</head>

<body>
	<div class="control-panel">
		<h1>Kakao ACCORDION · TETRIS</h1>
		<p><b>컨셉 :</b> 최대한 깔끔한 레이아웃, 가격 · 할인가 강조, 상품 사진으로 꽉 채움<br><b>구성 :</b> <b style="color:#e8232a">정방형(300x250 · 250x250) 상품 3개 / 가로형(728x90) 상품 6개 (고정)</b> ·3초마다 전환 · 할인 상품
			"비밀특가" / 정상가 상품 "SNS 핫템"</p>
	</div>

	<div class="section" id="section-accordion">
		<h2 class="section-title">아코디언</h2>
		<div class="banner-grid row">
			<div class="banner-container">
				<div class="banner-title">300 x 250</div>
				<iframe src="accordion/ui/openRtb_accordion_300x250_ui.html" width="300" height="250"
					scrolling="no"></iframe>
			</div>
			<div class="banner-container">
				<div class="banner-title">250 x 250</div>
				<iframe src="accordion/ui/openRtb_accordion_250x250_ui.html" width="250" height="250"
					scrolling="no"></iframe>
			</div>
			<div class="banner-container">
				<div class="banner-title">728 x 90</div>
				<iframe src="accordion/ui/openRtb_accordion_728x90_ui.html" width="728" height="90"
					scrolling="no"></iframe>
			</div>
		</div>
	</div>

	<div class="section" id="section-tetris">
		<h2 class="section-title">테트리스</h2>
		<div class="banner-grid row">
			<div class="banner-container">
				<div class="banner-title">300 x 250</div>
				<iframe src="tetris/ui/openRtb_tetris_300x250_ui.html" width="300" height="250" scrolling="no"></iframe>
			</div>
			<div class="banner-container">
				<div class="banner-title">250 x 250</div>
				<iframe src="tetris/ui/openRtb_tetris_250x250_ui.html" width="250" height="250" scrolling="no"></iframe>
			</div>
			<div class="banner-container">
				<div class="banner-title">728 x 90</div>
				<iframe src="tetris/ui/openRtb_tetris_728x90_ui.html" width="728" height="90" scrolling="no"></iframe>
			</div>
		</div>
	</div>
</body>

</html>
