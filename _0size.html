<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배너 사이즈 완료 체크리스트</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            padding: 20px;
            max-width: 450px;
            margin: 0 auto;
            color: #333;
        }
        h2 {
            font-size: 22px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        
        /* 탭 UI 스타일 */
        .tabs {
            display: flex;
            margin-bottom: 15px;
            background: #f4f4f4;
            border-radius: 8px;
            overflow: hidden;
        }
        .tab-btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            color: #666;
            transition: 0.2s;
        }
        .tab-btn:hover { background: #e0e0e0; }
        .tab-btn.active {
            background: #333;
            color: #fff;
        }
        .tab-btn span {
            font-size: 13px;
            opacity: 0.8;
            margin-left: 4px;
            font-weight: normal;
        }
        
        /* 컨텐츠 영역 */
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* 카테고리 (타입) 제목 */
        .category-title {
            font-size: 14px;
            background: #eef2f5;
            padding: 8px 12px;
            margin-top: 15px;
            border-radius: 6px;
            font-weight: bold;
            color: #2c3e50;
        }
        
        /* 배너 리스트 */
        .banner-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        .banner-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 10px;
            border-bottom: 1px solid #eee;
            font-size: 16px;
            transition: background-color 0.2s;
        }
        .banner-list li:hover {
            background-color: #fcfcfc;
        }
        
        /* 상태 변경 Select */
        .status-select {
            padding: 5px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            outline: none;
            background-color: #fff;
        }
        .status-select:focus { border-color: #888; }
        
        /* 완료된 항목 스타일 */
        .tab-content#content-done .banner-list li { color: #aaa; }
        .tab-content#content-done .banner-size-text { text-decoration: line-through; }
        
        /* 비어있을 때 메시지 */
        .empty-msg {
            padding: 30px;
            text-align: center;
            color: #999;
            font-size: 14px;
        }
        
        /* 초기화 버튼 */
        .reset-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 30px;
            border: 1px solid #ddd;
            background: #fff;
            color: #666;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .reset-btn:hover { background: #f9f9f9; color: #d32f2f; border-color: #d32f2f; }
    </style>
</head>
<body>

    <h2>배너 사이즈 작업 체크리스트</h2>

    <!-- 탭 영역 -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="todo">대기 <span id="count-todo"></span></button>
        <button class="tab-btn" data-tab="progress">작업중 <span id="count-progress"></span></button>
        <button class="tab-btn" data-tab="done">완료 <span id="count-done"></span></button>
    </div>

    <!-- 탭 컨텐츠 영역 -->
    <div id="content-todo" class="tab-content active"></div>
    <div id="content-progress" class="tab-content"></div>
    <div id="content-done" class="tab-content"></div>

    <button class="reset-btn" id="reset-btn">모든 진행상태 초기화</button>

    <script>
        // 1. 배너 데이터 정의 (타입별 분류)
        const banners = [
            { size: '320x50', type: '📱 모바일형' },
            { size: '320x100', type: '📱 모바일형' },
            { size: '300x50', type: '📱 모바일형' },
            
            { size: '300x250', type: '⏹️ 박스형' },
            { size: '250x250', type: '⏹️ 박스형' },
            { size: '200x200', type: '⏹️ 박스형' },
            { size: '336x280', type: '⏹️ 박스형' },
            { size: '300x100', type: '⏹️ 박스형' },
            
            { size: '728x90', type: '↔️ 가로형' },
            { size: '970x250', type: '↔️ 가로형' },
            { size: '234x60', type: '↔️ 가로형' },
            
            { size: '160x600', type: '↕️ 세로형' },
            { size: '120x600', type: '↕️ 세로형' },
            { size: '300x600', type: '↕️ 세로형' }
        ];

        // 2. 데이터 불러오기 및 구버전 데이터 호환
        let savedData = JSON.parse(localStorage.getItem('bannerStatus')) || {};
        const oldData = JSON.parse(localStorage.getItem('bannerChecklist'));
        
        // 이전에 체크박스(true/false)로 쓰던 데이터가 있으면 3단계 상태로 변환
        if (oldData && Object.keys(savedData).length === 0) {
            for (let key in oldData) {
                savedData[key] = oldData[key] ? 'done' : 'todo';
            }
            localStorage.removeItem('bannerChecklist'); // 이전 데이터 삭제
            localStorage.setItem('bannerStatus', JSON.stringify(savedData));
        }

        // 기본 상태 설정 (데이터가 비어있을 경우 '대기'로 설정)
        banners.forEach(b => {
            if (!savedData[b.size]) savedData[b.size] = 'todo';
        });

        // 3. 화면 렌더링 함수
        function render() {
            const tabs = ['todo', 'progress', 'done'];
            
            tabs.forEach(tabId => {
                const container = document.getElementById(`content-${tabId}`);
                container.innerHTML = ''; 
                
                // 현재 탭 상태에 맞는 배너만 필터링
                const filtered = banners.filter(b => savedData[b.size] === tabId);
                
                // 탭의 숫자 카운트 업데이트
                document.getElementById(`count-${tabId}`).innerText = `(${filtered.length})`;
                
                // 항목이 비어있을 때
                if (filtered.length === 0) {
                    container.innerHTML = '<div class="empty-msg">해당 상태의 배너가 없습니다.</div>';
                    return;
                }
                
                // 타입별 그룹화
                const grouped = {};
                filtered.forEach(b => {
                    if (!grouped[b.type]) grouped[b.type] = [];
                    grouped[b.type].push(b);
                });
                
                // HTML 동적 생성
                for (const type in grouped) {
                    const typeTitle = document.createElement('div');
                    typeTitle.className = 'category-title';
                    typeTitle.innerText = type;
                    container.appendChild(typeTitle);
                    
                    const ul = document.createElement('ul');
                    ul.className = 'banner-list';
                    
                    grouped[type].forEach(b => {
                        const li = document.createElement('li');
                        
                        const sizeText = document.createElement('span');
                        sizeText.className = 'banner-size-text';
                        sizeText.innerText = b.size;
                        
                        const select = document.createElement('select');
                        select.className = 'status-select';
                        select.innerHTML = `
                            <option value="todo" ${tabId === 'todo' ? 'selected' : ''}>대기</option>
                            <option value="progress" ${tabId === 'progress' ? 'selected' : ''}>작업중</option>
                            <option value="done" ${tabId === 'done' ? 'selected' : ''}>완료</option>
                        `;
                        
                        // Select 선택 변경 시 동작
                        select.addEventListener('change', (e) => {
                            savedData[b.size] = e.target.value;
                            localStorage.setItem('bannerStatus', JSON.stringify(savedData));
                            render(); // 상태가 바뀌면 탭에서 즉시 이동하도록 다시 그리기
                        });
                        
                        li.appendChild(sizeText);
                        li.appendChild(select);
                        ul.appendChild(li);
                    });
                    
                    container.appendChild(ul);
                }
            });
        }

        // 4. 탭 클릭 이벤트 설정
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                btn.classList.add('active');
                document.getElementById(`content-${btn.dataset.tab}`).classList.add('active');
            });
        });

        // 5. 초기화 버튼 이벤트
        document.getElementById('reset-btn').addEventListener('click', () => {
            if(confirm('모든 배너의 진행 상태를 "대기"로 초기화하시겠습니까?')) {
                banners.forEach(b => savedData[b.size] = 'todo');
                localStorage.setItem('bannerStatus', JSON.stringify(savedData));
                render();
            }
        });

        // 스크립트 로드 시 최초 렌더링
        render();
    </script>
</body>
</html>
