<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>구글RTB 배너</title>
	<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
	<style>
		/* 1. 배너 & 이미지 규격 */
		:root {
			--width: 100%;
			--height: 100%;
		}

		/* 2. 공통사항 */
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		html,
		body {
			width: 100%;
			height: 100%;
		}

		.mobonLogo {
			position: absolute;
			top: 2px;
			right: 2px;
			width: 11px;
			height: 11px;
			background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo02.png') center center;
			background-size: 11px 11px;
			opacity: 0.8;
			z-index: 1001;
			cursor: pointer;
		}

		.mobonLogo:hover {
			width: 73px;
			height: 15px;
			background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo_over02.png') center center;
			background-size: 73px 15px;
		}

		.mobon_reset {
			position: relative;
			width: var(--width);
			height: var(--height);
			font-family: "pretendard", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
			overflow: hidden;
		}

		.mobon_banner {
			position: relative;
			width: 100%;
			height: 100%;
			overflow: hidden;
			cursor: pointer;
			background: #222;
		}

		.bgfill {
			position: absolute;
			inset: -20px;
			width: calc(100% + 40px);
			height: calc(100% + 40px);
			object-fit: cover;
			filter: blur(18px) brightness(0.85) saturate(1.2);
		}

		.frame {
			position: absolute;
			inset: 0;
			z-index: 1;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		.img {
			display: block;
			max-width: 100vw;
			max-height: 100vh;
			object-fit: contain;
		}

		.mobon_banner {
			perspective: 800px;
		}

		.tile {
			--cols: 3;
			--rows: 2;
			--c: var(--c3);
			--r: var(--r3);
			--k: var(--k3);
			--anim: var(--a3);
			--tbt: var(--t3);
			position: absolute;
			z-index: 1;
			left: calc(var(--c) * 100vw / var(--cols));
			top: calc(var(--r) * 100vh / var(--rows));
			width: calc(100vw / var(--cols) + 1px);
			height: calc(100vh / var(--rows) + 1px);
			transform-style: preserve-3d;
			animation: var(--anim) 7s cubic-bezier(0.45, 0, 0.2, 1) infinite;
			animation-delay: calc(var(--k) * 0.08s);
		}

		@media (min-aspect-ratio: 3/1) {
			.tile {
				--cols: 6;
				--rows: 1;
				--c: var(--c6);
				--r: 0;
				--k: var(--k6);
				--anim: var(--a6);
				--tbt: var(--t6);
			}
		}

		@media (max-aspect-ratio: 1/2) {
			.tile {
				--cols: 2;
				--rows: 3;
				--c: var(--c2);
				--r: var(--r2);
				--k: var(--k2);
				--anim: var(--a2);
				--tbt: var(--t2);
			}
		}

		.tile > div {
			position: absolute;
			inset: 0;
			overflow: hidden;
			backface-visibility: hidden;
			-webkit-backface-visibility: hidden;
		}

		.tile .full {
			position: absolute;
			left: calc(var(--c) * -100vw / var(--cols));
			top: calc(var(--r) * -100vh / var(--rows));
			width: 100vw;
			height: 100vh;
		}

		.tile .tf::after {
			content: "";
			position: absolute;
			inset: 0;
			z-index: 2;
			background: #000;
			opacity: 0;
			animation: shade 7s cubic-bezier(0.45, 0, 0.2, 1) infinite;
			animation-delay: inherit;
		}

		.tile .tb {
			transform: var(--tbt);
		}

		.tile .tb::after {
			content: "";
			position: absolute;
			inset: 0;
			background: rgba(0, 0, 0, 0.22);
			box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.09);
		}

		@keyframes fy {
			0%, 57.14% {
				transform: rotateY(0);
			}

			68.57%, 88.57% {
				transform: rotateY(180deg);
			}

			100% {
				transform: rotateY(360deg);
			}
		}

		@keyframes fx {
			0%, 57.14% {
				transform: rotateX(0);
			}

			68.57%, 88.57% {
				transform: rotateX(180deg);
			}

			100% {
				transform: rotateX(360deg);
			}
		}

		@keyframes shade {
			0%, 57.14% {
				opacity: 0;
			}

			62.86% {
				opacity: 0.4;
			}

			68.57%, 88.57% {
				opacity: 0;
			}

			94.29% {
				opacity: 0.4;
			}

			100% {
				opacity: 0;
			}
		}

		.cta {
			position: absolute;
			inset: 0;
			z-index: 3;
			display: flex;
			align-items: center;
			justify-content: center;
			pointer-events: none;
			opacity: 0;
			animation: cta 7s ease infinite;
		}

		.go {
			position: relative;
			z-index: 1;
			display: inline-flex;
			align-items: center;
			gap: 0.25em;
			padding: 0.66em 0.9em 0.66em 1.2em;
			border-radius: 999px;
			background: #fff;
			color: #111;
			box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
			font-size: clamp(12px, 6vmin, 18px);
			font-weight: 800;
			letter-spacing: -0.02em;
			line-height: 1.2;
			white-space: nowrap;
			animation: ctaPop 7s ease infinite;
		}

		.go .arrow {
			width: 1em;
			height: 1em;
		}

		@media (min-aspect-ratio: 3/1) {
			.go {
				font-size: clamp(11px, 15vh, 16px);
			}
		}

		@media (max-width: 120px) {
			.go {
				font-size: 10px;
				padding: 0.5em 0.6em 0.5em 0.8em;
				gap: 0.15em;
			}
		}

		@keyframes cta {
			0%, 70% {
				opacity: 0;
			}

			71.14%, 86% {
				opacity: 1;
			}

			87.14%, 100% {
				opacity: 0;
			}
		}

		@keyframes ctaPop {
			0%, 70% {
				transform: scale(0.88);
			}

			72.14%, 100% {
				transform: scale(1);
			}
		}
	</style>
</head>

<body>
	<div class="mobon_reset">
		<div class="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
		<div class="mobon_banner">
			<img class="bgfill" src="https://manage.mobon.net/ad/imgfile//20240617185940-tJb4iOIAxf-336x280.jpg" alt="" aria-hidden="true">
			<div class="tile" style="--c3:0;--r3:0;--c6:0;--c2:0;--r2:0;--k3:0;--a3:fy;--t3:rotateY(180deg);--k6:0;--a6:fy;--t6:rotateY(180deg);--k2:0;--a2:fy;--t2:rotateY(180deg)">
				<div class="tf"><div class="full"><div class="frame"><img class="img" src="https://manage.mobon.net/ad/imgfile//20240617185940-tJb4iOIAxf-336x280.jpg" alt="배너 이미지"></div></div></div>
				<div class="tb"><div class="full"><img class="bgfill" src="https://manage.mobon.net/ad/imgfile//20240617185940-tJb4iOIAxf-336x280.jpg" alt="" aria-hidden="true"></div></div>
			</div>
			<div class="tile" style="--c3:1;--r3:0;--c6:1;--c2:1;--r2:0;--k3:1;--a3:fx;--t3:rotateX(180deg);--k6:1;--a6:fx;--t6:rotateX(180deg);--k2:1;--a2:fx;--t2:rotateX(180deg)">
				<div class="tf"><div class="full"><div class="frame"><img class="img" src="https://manage.mobon.net/ad/imgfile//20240617185940-tJb4iOIAxf-336x280.jpg" alt=""></div></div></div>
				<div class="tb"><div class="full"><img class="bgfill" src="https://manage.mobon.net/ad/imgfile//20240617185940-tJb4iOIAxf-336x280.jpg" alt="" aria-hidden="true"></div></div>
			</div>
			<div class="tile" style="--c3:2;--r3:0;--c6:2;--c2:0;--r2:1;--k3:0;--a3:fy;--t3:rotateY(180deg);--k6:0;--a6:fy;--t6:rotateY(180deg);--k2:1;--a2:fx;--t2:rotateX(180deg)">
				<div class="tf"><div class="full"><div class="frame"><img class="img" src="https://manage.mobon.net/ad/imgfile//20240617185940-tJb4iOIAxf-336x280.jpg" alt=""></div></div></div>
				<div class="tb"><div class="full"><img class="bgfill" src="https://manage.mobon.net/ad/imgfile//20240617185940-tJb4iOIAxf-336x280.jpg" alt="" aria-hidden="true"></div></div>
			</div>
			<div class="tile" style="--c3:0;--r3:1;--c6:3;--c2:1;--r2:1;--k3:1;--a3:fx;--t3:rotateX(180deg);--k6:1;--a6:fx;--t6:rotateX(180deg);--k2:0;--a2:fy;--t2:rotateY(180deg)">
				<div class="tf"><div class="full"><div class="frame"><img class="img" src="https://manage.mobon.net/ad/imgfile//20240617185940-tJb4iOIAxf-336x280.jpg" alt=""></div></div></div>
				<div class="tb"><div class="full"><img class="bgfill" src="https://manage.mobon.net/ad/imgfile//20240617185940-tJb4iOIAxf-336x280.jpg" alt="" aria-hidden="true"></div></div>
			</div>
			<div class="tile" style="--c3:1;--r3:1;--c6:4;--c2:0;--r2:2;--k3:0;--a3:fy;--t3:rotateY(180deg);--k6:0;--a6:fy;--t6:rotateY(180deg);--k2:0;--a2:fy;--t2:rotateY(180deg)">
				<div class="tf"><div class="full"><div class="frame"><img class="img" src="https://manage.mobon.net/ad/imgfile//20240617185940-tJb4iOIAxf-336x280.jpg" alt=""></div></div></div>
				<div class="tb"><div class="full"><img class="bgfill" src="https://manage.mobon.net/ad/imgfile//20240617185940-tJb4iOIAxf-336x280.jpg" alt="" aria-hidden="true"></div></div>
			</div>
			<div class="tile" style="--c3:2;--r3:1;--c6:5;--c2:1;--r2:2;--k3:1;--a3:fx;--t3:rotateX(180deg);--k6:1;--a6:fx;--t6:rotateX(180deg);--k2:1;--a2:fx;--t2:rotateX(180deg)">
				<div class="tf"><div class="full"><div class="frame"><img class="img" src="https://manage.mobon.net/ad/imgfile//20240617185940-tJb4iOIAxf-336x280.jpg" alt=""></div></div></div>
				<div class="tb"><div class="full"><img class="bgfill" src="https://manage.mobon.net/ad/imgfile//20240617185940-tJb4iOIAxf-336x280.jpg" alt="" aria-hidden="true"></div></div>
			</div>
			<div class="cta"><span class="go">지금 구매 찬스 <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg></span></div>
		</div>
	</div>
	<script>
		// 미리보기 전용 : ?img= 로 광고주 이미지 교체
		(() => {
			const src = new URLSearchParams(location.search).get('img');
			if (!src) return;
			document.querySelectorAll('.img, .bgfill').forEach(el => el.src = src);
		})();
	</script>
</body>

</html>
