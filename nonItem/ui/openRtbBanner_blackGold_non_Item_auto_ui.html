<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>구글RTB 배너</title>
	<style>
		/* 1. 배너 & 이미지 규격 */
		:root {
			--width: 300px;
			--height: 250px;
		}

		/* 2. 공통사항 */
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		.mobonLogo {
			position: absolute;
			top: 2px;
			right: 2px;
			width: 11px;
			height: 11px;
			background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo02.png') center center;
			background-size: 11px 11px;
			opacity: 0.8;
			z-index: 1001;
			cursor: pointer;
		}

		.mobonLogo:hover {
			width: 73px;
			height: 15px;
			background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo_over02.png') center center;
			background-size: 73px 15px;
		}

		.mobon_reset {
			position: relative;
			width: var(--width);
			height: var(--height);
			overflow: hidden;
		}

		.mobon_banner {
			display: flex;
			justify-content: center;
			align-items: center;
			width: 100%;
			height: 100%;
			cursor: pointer;
		}

		.img {
			width: 100%;
			height: 100%;
			object-fit: contain;
			object-position: center;
		}
	</style>
</head>

<body>
	<div class="mobon_reset">
		<div class="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
		<div class="mobon_banner">
			<img class="img" src="https://manage.mobon.net/ad/imgfile//20240617185940-tJb4iOIAxf-336x280.jpg" alt="배너이미지">
		</div>
	</div>
</body>

</html>
