<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>구글RTB 배너</title>
	<script>
		window.__mobonProducts = [{{productList}}];
		window.__mobonPreload = (() => {
			try {
				const first = window.__mobonProducts[0];
				if (!first || !first.img) return;
				const link = document.createElement('link');
				link.rel = 'preload';
				link.as = 'image';
				link.href = first.img;
				link.fetchPriority = 'high';
				document.head.appendChild(link);
			} catch (e) {}
		})();
	</script>
	<style>
		/* 1. 웹 폰트 */
		@import url("https://fonts.googleapis.com/css2?family=Anton&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap");
		@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");

		/* 2. 배너 & 이미지 규격 */
		:root {
			--width: 300px;
			--height: 250px;
		}

		/* 3. 공통사항 */
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		.mobonLogo {
			position: absolute;
			top: 2px;
			right: 2px;
			width: 11px;
			height: 11px;
			background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo02.png') center center;
			background-size: 11px 11px;
			opacity: 0.8;
			z-index: 1001;
			cursor: pointer;
		}

		.mobonLogo:hover {
			width: 73px;
			height: 15px;
			background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo_over02.png') center center;
			background-size: 73px 15px;
		}

		/* 4. 해당 사이즈 배너 */
		.mobon_reset {
			position: relative;
			width: var(--width);
			height: var(--height);
			font-family: "Noto Sans KR", sans-serif;
			overflow: hidden;
		}

		.mobon_banner {
			display: flex;
			flex-direction: column;
			width: 100%;
			height: 100%;
			color: #fff;
			background-color: #d90f27;
			cursor: pointer;
		}

		.ticker {
			display: flex;
			align-items: center;
			flex-shrink: 0;
			height: 22px;
			background-color: #111;
			overflow: hidden;
		}

		.ticker_track {
			display: flex;
			font-family: "Anton", "Noto Sans KR", sans-serif;
			font-size: 12px;
			letter-spacing: 1px;
			white-space: nowrap;
			color: #ffe600;
			animation: tickerMove 7s linear infinite;
		}

		.ticker_track span {
			padding-right: 22px;
		}

		.ticker_track i {
			position: relative;
			top: -1px;
			font-style: normal;
		}

		@keyframes tickerMove {
			0% {
				transform: translateX(0);
			}

			100% {
				transform: translateX(-50%);
			}
		}

		.content {
			position: relative;
			display: flex;
			flex: 1;
			min-height: 0;
		}

		.slider_wrap {
			position: relative;
			flex-shrink: 0;
			width: 128px;
			height: 100%;
			border-right: 3px solid #ffe600;
			overflow: hidden;
		}

		.img {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			object-fit: cover;
			object-position: center;
			opacity: 0;
			transition: opacity 0.5s ease;
		}

		.img.active {
			opacity: 1;
		}

		.img.is-panning {
			object-position: left top;
			animation: panImage 5s ease-in-out infinite alternate;
		}

		@keyframes panImage {
			0% {
				object-position: left top;
			}

			100% {
				object-position: right bottom;
			}
		}

		.badge {
			position: absolute;
			top: 7px;
			left: 5px;
			font-family: "Black Han Sans", sans-serif;
			font-size: 12px;
			line-height: 1;
			color: #111;
			background-color: #ffe600;
			animation: badgeShake 0.25s ease-in-out infinite;
			padding: 5px 6px 1px;
			z-index: 2;
		}

		@keyframes badgeShake {

			0%,
			100% {
				transform: rotate(-2deg);
			}

			50% {
				transform: rotate(2deg);
			}
		}

		.bg {
			position: relative;
			display: flex;
			flex-direction: column;
			flex: 1;
			min-width: 0;
			padding: 9px 10px 9px 12px;
			z-index: 1;
		}

		.title {
			font-family: "Anton", sans-serif;
			font-size: 23px;
			line-height: 1;
			white-space: nowrap;
			color: #ffe600;
			text-shadow: 2px 2px 0 #111;
			animation: titleFlash 0.8s steps(2) infinite;
		}

		@keyframes titleFlash {

			0%,
			100% {
				opacity: 1;
			}

			50% {
				opacity: 0.4;
			}
		}

		.pick_tag {
			align-self: flex-start;
			font-size: 10px;
			font-weight: 700;
			background-color: #111;
			margin-top: 8px;
			padding: 3px 7px;
		}

		.pnm {
			font-family: "pretendard", sans-serif;
			font-size: 16px;
			font-weight: 900;
			line-height: 1.25;
			letter-spacing: -0.5px;
			word-break: break-all;
			overflow-wrap: break-word;
			display: -webkit-box;
			-webkit-line-clamp: 2;
			-webkit-box-orient: vertical;
			overflow: hidden;
			margin-top: 10px;
		}

		.price_box {
			position: relative;
			white-space: nowrap;
			border-top: 2px dashed rgba(255, 255, 255, 0.65);
			margin-top: auto;
			margin-right: -10px;
			padding: 10px 10px 0 0;
		}

		.price_box::after {
			content: "";
			position: absolute;
			top: -7px;
			right: -6px;
			width: 12px;
			height: 12px;
			border-radius: 50%;
			background-color: #111;
		}

		.sale .sale_rate,
		.sale .sale_price {
			display: block;
		}

		.sale .original_price {
			display: none;
		}

		.sale .sale_rate:empty {
			display: none;
		}

		.sale_rate {
			display: none;
			position: absolute;
			bottom: 26px;
			left: -41px;
			width: 54px;
			height: 54px;
			font-family: "Anton", sans-serif;
			font-size: 20px;
			line-height: 1;
			text-align: center;
			color: #111;
			background-color: #ffe600;
			padding-top: 12px;
			clip-path: polygon(50.0% 0.0%, 58.4% 7.8%, 69.1% 3.8%, 73.9% 14.2%, 85.4% 14.6%, 85.8% 26.1%, 96.2% 30.9%, 92.2% 41.6%, 100.0% 50.0%, 92.2% 58.4%, 96.2% 69.1%, 85.8% 73.9%, 85.4% 85.4%, 73.9% 85.8%, 69.1% 96.2%, 58.4% 92.2%, 50.0% 100.0%, 41.6% 92.2%, 30.9% 96.2%, 26.1% 85.8%, 14.6% 85.4%, 14.2% 73.9%, 3.8% 69.1%, 7.8% 58.4%, 0.0% 50.0%, 7.8% 41.6%, 3.8% 30.9%, 14.2% 26.1%, 14.6% 14.6%, 26.1% 14.2%, 30.9% 3.8%, 41.6% 7.8%);
			transform: rotate(-10deg);
		}

		.sale_rate::after {
			content: "OFF";
			display: block;
			font-size: 10px;
			letter-spacing: 0.5px;
		}

		.sale_price,
		.original_price {
			font-family: "Anton", sans-serif;
			font-size: 25px;
			line-height: 1;
			text-shadow: 2px 2px 0 #111;
			transform-origin: left bottom;
		}

		.sale_price {
			display: none;
		}

		.original_price {
			display: block;
		}

		.sale_price span,
		.original_price span {
			margin-left: 5px;
			font-family: "Noto Sans KR", sans-serif;
			font-size: 12px;
			font-weight: 900;
		}

		.price_box.pop .sale_price,
		.price_box.pop .original_price {
			animation: pricePop 0.45s ease-out;
		}

		.price_box.pop .sale_rate {
			animation: ratePop 0.5s ease-out;
		}

		@keyframes pricePop {
			0% {
				transform: scale(0.8);
				opacity: 0;
			}

			60% {
				transform: scale(1.08);
				opacity: 1;
			}

			100% {
				transform: scale(1);
			}
		}

		@keyframes ratePop {
			0% {
				transform: rotate(-40deg) scale(0.4);
				opacity: 0;
			}

			60% {
				transform: rotate(0deg) scale(1.15);
				opacity: 1;
			}

			100% {
				transform: rotate(-10deg) scale(1);
			}
		}

		.slider_controls {
			display: flex;
			align-items: center;
			justify-content: space-between;
			margin-top: 10px;
		}

		.slider_btns {
			display: flex;
			gap: 4px;
		}

		.slider_btn {
			display: flex;
			align-items: center;
			justify-content: center;
			width: 18px;
			height: 18px;
			color: #fff;
			border: 1px solid #fff;
			background-color: transparent;
			transition: all 0.2s ease;
			cursor: pointer;
		}

		.slider_btn:hover {
			color: #d90f27;
			background-color: #fff;
		}

		.slider_pagination {
			font-size: 10px;
			font-weight: 700;
		}
		/* 대체 배너 */
		.fallback_banner {
			display: none;
			position: relative;
			width: 100%;
			height: 100%;
			overflow: hidden;
		}

		.fallback_link {
			display: block;
			width: 100%;
			height: 100%;
			cursor: pointer;
		}

		.fallback_banner img {
			width: 100%;
			height: 100%;
			object-fit: contain;
			background-position: center center;
		}
		/* 29초에 스크립트가 .is-anim-stopped 추가 → 티커·타이틀 애니메이션 정지 (구글 규정 : 30초 내 정지) */
		.is-anim-stopped .ticker_track {
			animation-play-state: paused;
		}

		.is-anim-stopped .title {
			animation: none;
		}
	</style>
</head>

<body>
	<div class="mobon_reset" id="noHiddenMobon">
		<div class="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
		<div class="mobon_banner">
			<div class="ticker">
				<div class="ticker_track">
					<span>TODAY'S PICK <i>✦ 오늘의 추천 ✦</i> TODAY'S PICK <i>✦ 오늘의 추천 ✦</i> TODAY'S PICK <i>✦ 오늘의 추천 ✦</i></span>
					<span>TODAY'S PICK <i>✦ 오늘의 추천 ✦</i> TODAY'S PICK <i>✦ 오늘의 추천 ✦</i> TODAY'S PICK <i>✦ 오늘의 추천 ✦</i></span>
				</div>
			</div>

			<div class="content">
				<div class="slider_wrap">
				</div>
				<div class="badge">HOT</div>

				<div class="bg">
					<p class="title">TODAY'S PICK</p>
					<p class="pick_tag">SNS 핫템</p>
					<p class="pnm"></p>

					<!-- 할인 상품인 경우 .price_box에 .sale 추가 -->
					<div class="price_box sale">
						<div class="sale_rate"></div>
						<div class="sale_price"></div>
						<div class="original_price"></div>
					</div>

					<div class="slider_controls">
						<div class="slider_btns">
							<button type="button" class="slider_btn prev_btn">
								<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
									stroke-linecap="round" stroke-linejoin="round">
									<polyline points="15 18 9 12 15 6"></polyline>
								</svg>
							</button>
							<button type="button" class="slider_btn next_btn">
								<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
									stroke-linecap="round" stroke-linejoin="round">
									<polyline points="9 18 15 12 9 6"></polyline>
								</svg>
							</button>
						</div>
						<div class="slider_pagination"><span class="current_idx">1</span> / <span class="total_idx">4</span>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- 노출 추적 태그 -->
	{{wp_imgtag}}

	<!-- 대체 배너 영역 -->
	<div class="fallback_banner" id="hiddenMobon">
		<div class="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
		<div class="fallback_link" onclick="window.open('https://mobon.net/bridge/')">
			<img src="{{HTTP}}/servlet/image/mobon/300x250.png" alt="대체배너">
		</div>
	</div>

	<script>
		document.addEventListener('DOMContentLoaded', () => {
			const frameWidth = {{w}};
			const frameHeight = {{h}};
			const mainBanner = document.getElementById('noHiddenMobon');
			const fallbackBanner = document.getElementById('hiddenMobon');
			const sliderWrap = document.querySelector('.slider_wrap');
			const prevBtn = document.querySelector('.prev_btn');
			const nextBtn = document.querySelector('.next_btn');
			const currentIdxEl = document.querySelector('.current_idx');
			const totalIdxEl = document.querySelector('.total_idx');
			const pnmEl = document.querySelector('.pnm');
			const priceBoxEl = document.querySelector('.price_box');
			const saleRateEl = document.querySelector('.sale_rate');
			const salePriceEl = document.querySelector('.sale_price');
			const originalPriceEl = document.querySelector('.original_price');

			const allProducts = window.__mobonProducts;


			const imageHtml = allProducts.map((item, index) => {
				const activeClass = index === 0 ? 'active' : '';
				return `<img class="img ${activeClass}" src="${item.img}" data-pcode="${item.pcode}" alt="${item.pnm}">`;
			}).join('');

			sliderWrap.innerHTML = imageHtml;

			const images = document.querySelectorAll('.slider_wrap .img');

			const sliderControls = document.querySelector('.slider_controls');
			let currentIndex = 0;
			const totalImages = images.length;
			let intervalId;

			totalIdxEl.textContent = totalImages;

			if (totalImages <= 1) {
				sliderControls.style.display = 'none';
			}

			const checkPanning = (img) => {
				const wrap = img.parentElement;
				if (!wrap.clientWidth || !wrap.clientHeight) return;

				const wrapRatio = wrap.clientWidth / wrap.clientHeight;
				const imgRatio = img.naturalWidth / img.naturalHeight;

				const overflowPx = imgRatio > wrapRatio ?
					(wrap.clientHeight * imgRatio) - wrap.clientWidth :
					(wrap.clientWidth / imgRatio) - wrap.clientHeight;

				const overflowRatio = imgRatio > wrapRatio ?
					overflowPx / wrap.clientWidth :
					overflowPx / wrap.clientHeight;

				if (overflowRatio > 0.3) {
					img.classList.add('is-panning');
					img.style.animationDuration = overflowPx <= 40 ? '3s' : '5s';
				} else {
					img.classList.remove('is-panning');
					img.style.animationDuration = '';
				}
			};

			function showImage(index) {
				images.forEach(img => img.classList.remove('active'));
				if (images[index]) {
					images[index].classList.add('active');

					if (images[index].complete && images[index].naturalWidth > 0) {
						checkPanning(images[index]);
					} else {
						images[index].addEventListener('load', () => checkPanning(images[index]), {
							once: true
						});
					}
				}
				currentIdxEl.textContent = index + 1;

				priceBoxEl.classList.remove('pop');
				void priceBoxEl.offsetWidth;
				priceBoxEl.classList.add('pop');

				const product = allProducts[index];
				if (product) {
					const isSale = Boolean(product.prdt_prmct);

					pnmEl.textContent = product.pnm;
					priceBoxEl.classList.toggle('sale', isSale);
					saleRateEl.innerHTML = isSale && product.dc_rate ? `${product.dc_rate}<span>%</span>` : '';
					salePriceEl.innerHTML = isSale ? `${product.prdt_prmct}<span>원</span>` : '';
					originalPriceEl.innerHTML = `${product.price}<span>원</span>`;
				}
			}

			function nextImage() {
				currentIndex = (currentIndex + 1) % totalImages;
				showImage(currentIndex);
			}

			function prevImage() {
				currentIndex = (currentIndex - 1 + totalImages) % totalImages;
				showImage(currentIndex);
			}

			function startSlider() {
				if (totalImages <= 1) return;
				stopSlider();
				/* 3초 마다 */
				intervalId = setInterval(nextImage, 3000);
			}

			function stopSlider() {
				clearInterval(intervalId);
			}

			const bannerContainer = document.querySelector('.mobon_banner');
			bannerContainer.addEventListener('mouseenter', stopSlider);
			bannerContainer.addEventListener('mouseleave', startSlider);

			bannerContainer.addEventListener('click', () => {
				const product = allProducts[currentIndex];
				if (product && product.purl) {
					window.open(product.purl);
				}
			});

			prevBtn.addEventListener('click', (e) => {
				e.stopPropagation();
				prevImage();
			});

			nextBtn.addEventListener('click', (e) => {
				e.stopPropagation();
				nextImage();
			});

			showImage(currentIndex);

			/* 이미지 에러 감지 → 대체 배너 */
			const handleImageErrors = () => {
				const allBannerImages = document.querySelectorAll('#noHiddenMobon img');
				let isFallbackTriggered = false;
				const handleImageError = (event) => {
					if (isFallbackTriggered) return;
					isFallbackTriggered = true;
					const pcode = event.target.dataset.pcode || '';
					if (mainBanner) mainBanner.style.display = 'none';
					if (fallbackBanner) {
						fallbackBanner.style.display = 'block';
						fallbackBanner.style.width = `${frameWidth}px`;
						fallbackBanner.style.height = `${frameHeight}px`;
					}
					const errorUrl =
						`{{HTTP_DR}}/rtbShop?uid=${encodeURIComponent("{{UUID}}")}&u={{USER}}&pc=${pcode}&itlTpCode={{ITL_TP_CODE}}`;
					(new Image()).src = errorUrl;
				};
				allBannerImages.forEach(img => {
					if (img.getAttribute('src') && img.complete && img.naturalHeight === 0) {
						handleImageError({
							target: img
						});
					} else {
						img.addEventListener('error', handleImageError);
					}
				});
			};
			handleImageErrors();

			startSlider();
		});
	</script>
	<script>
		/* 구글 규정 : 30초 내 애니메이션 정지 → 29초에 티커·타이틀 정지 */
		setTimeout(() => {
			document.documentElement.classList.add('is-anim-stopped');
		}, 29000);
	</script>
</body>

</html>
