<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>구글RTB 배너</title>
	<script>
		window.__mobonProducts = [{{productList}}];
		window.__mobonPreload = (() => {
			try {
				const first = window.__mobonProducts[0];
				if (!first || !first.img) return;
				const link = document.createElement('link');
				link.rel = 'preload';
				link.as = 'image';
				link.href = first.img;
				link.fetchPriority = 'high';
				document.head.appendChild(link);
			} catch (e) {}
		})();
	</script>
	<style>
		/* 1. 웹 폰트 */
		@import url("https://fonts.googleapis.com/css2?family=Anton&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap");
		@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");

		/* 2. 배너 & 이미지 규격 */
		:root {
			--width: 120px;
			--height: 600px;
			--active-banner-height: 210px;
		}

		/* 3. 공통사항 */
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		.mobonLogo {
			position: absolute;
			top: 2px;
			right: 2px;
			width: 11px;
			height: 11px;
			background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo02.png') center center;
			background-size: 11px 11px;
			opacity: 0.8;
			z-index: 1001;
			cursor: pointer;
		}

		.mobonLogo:hover {
			width: 73px;
			height: 15px;
			background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo_over02.png') center center;
			background-size: 73px 15px;
		}

		/* 4. 해당 사이즈 배너 */
		.mobon_reset {
			position: relative;
			width: var(--width);
			height: var(--height);
			font-family: "Noto Sans KR", sans-serif;
			overflow: hidden;
		}

		.mobon_banner {
			display: flex;
			flex-direction: column;
			width: 100%;
			height: 100%;
			color: #fff;
			background-color: #d90f27;
			cursor: pointer;
		}

		.ticker {
			display: flex;
			align-items: center;
			flex-shrink: 0;
			height: 22px;
			background-color: #111;
			overflow: hidden;
		}

		.ticker_track {
			display: flex;
			font-family: "Anton", "Noto Sans KR", sans-serif;
			font-size: 12px;
			letter-spacing: 1px;
			white-space: nowrap;
			color: #ffe600;
			animation: tickerMove 7s linear infinite;
		}

		.ticker_track span {
			padding-right: 22px;
		}

		.ticker_track i {
			position: relative;
			top: -1px;
			font-style: normal;
		}

		@keyframes tickerMove {
			0% {
				transform: translateX(0);
			}

			100% {
				transform: translateX(-50%);
			}
		}

		.head {
			display: flex;
			flex-direction: column;
			align-items: flex-start;
			flex-shrink: 0;
			border-bottom: 3px solid #ffe600;
			padding: 8px 8px 7px 9px;
		}

		.title {
			font-family: "Anton", sans-serif;
			font-size: 19px;
			line-height: 1;
			white-space: nowrap;
			color: #ffe600;
			text-shadow: 2px 2px 0 #111;
			animation: titleFlash 0.8s steps(2) infinite;
		}

		@keyframes titleFlash {

			0%,
			100% {
				opacity: 1;
			}

			50% {
				opacity: 0.4;
			}
		}

		.pick_tag {
			font-size: 9px;
			font-weight: 700;
			background-color: #111;
			margin-top: 5px;
			padding: 2px 6px;
		}

		.card_wrap {
			display: flex;
			flex-direction: column;
			flex: 1;
			gap: 4px;
			min-height: 0;
			padding: 4px;
		}

		.card {
			position: relative;
			display: flex;
			flex-direction: column;
			flex: 1 1 0%;
			border: 2px solid rgba(255, 255, 255, 0.45);
			background-color: #111;
			transition: flex 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), border-color 0.3s;
			overflow: hidden;
			cursor: pointer;
		}

		.card.active {
			flex: 0 0 var(--active-banner-height);
			border-color: #ffe600;
		}

		.badge {
			display: none;
			position: absolute;
			top: 4px;
			left: 3px;
			font-family: "Black Han Sans", sans-serif;
			font-size: 10px;
			line-height: 1;
			color: #111;
			background-color: #ffe600;
			animation: badgeShake 0.25s ease-in-out infinite;
			padding: 4px 5px 1px;
			z-index: 2;
		}

		.card.active .badge {
			display: block;
		}

		@keyframes badgeShake {

			0%,
			100% {
				transform: rotate(-2deg);
			}

			50% {
				transform: rotate(2deg);
			}
		}

		.img_wrap {
			flex: 1 1 auto;
			width: 100%;
			min-height: 0;
			overflow: hidden;
		}

		.img {
			display: block;
			width: 100%;
			height: 100%;
			object-fit: cover;
			object-position: center;
			opacity: 0.85;
			transition: opacity 0.3s ease;
		}

		.card.active .img {
			opacity: 1;
		}

		.img.is-panning {
			object-position: left top;
			animation: panImage 5s ease-in-out infinite alternate;
		}

		@keyframes panImage {
			0% {
				object-position: left top;
			}

			100% {
				object-position: right bottom;
			}
		}

		.bg {
			display: flex;
			flex-direction: column;
			flex-shrink: 0;
			height: 0;
			opacity: 0;
			background-color: #d90f27;
			padding: 0;
			overflow: hidden;
		}

		.card.active .bg {
			height: auto;
			opacity: 1;
			padding: 6px 6px 7px;
		}

		.pnm {
			font-family: "pretendard", sans-serif;
			font-size: 12px;
			font-weight: 900;
			line-height: 1.25;
			letter-spacing: -0.5px;
			word-break: break-all;
			overflow-wrap: break-word;
			display: -webkit-box;
			-webkit-line-clamp: 2;
			-webkit-box-orient: vertical;
			overflow: hidden;
		}

		.price_box {
			position: relative;
			display: flex;
			align-items: center;
			gap: 3px;
			white-space: nowrap;
			border-top: 2px dashed rgba(255, 255, 255, 0.65);
			margin: 5px -6px 0;
			padding: 6px 6px 0;
		}

		.price_box::after,
		.price_box::before {
			content: "";
			position: absolute;
			top: -5px;
			width: 8px;
			height: 8px;
			border-radius: 50%;
			background-color: #111;
		}

		.price_box::before {
			left: -3px;
		}

		.price_box::after {
			right: -3px;
		}

		.sale .sale_rate,
		.sale .sale_price {
			display: block;
		}

		.sale .original_price {
			display: none;
		}

		.sale .sale_rate:empty {
			display: none;
		}

		.sale_rate {
			display: none;
			flex-shrink: 0;
			width: 26px;
			height: 26px;
			font-family: "Anton", sans-serif;
			font-size: 10px;
			line-height: 1;
			text-align: center;
			color: #111;
			background-color: #ffe600;
			padding-top: 6px;
			clip-path: polygon(50.0% 0.0%, 58.4% 7.8%, 69.1% 3.8%, 73.9% 14.2%, 85.4% 14.6%, 85.8% 26.1%, 96.2% 30.9%, 92.2% 41.6%, 100.0% 50.0%, 92.2% 58.4%, 96.2% 69.1%, 85.8% 73.9%, 85.4% 85.4%, 73.9% 85.8%, 69.1% 96.2%, 58.4% 92.2%, 50.0% 100.0%, 41.6% 92.2%, 30.9% 96.2%, 26.1% 85.8%, 14.6% 85.4%, 14.2% 73.9%, 3.8% 69.1%, 7.8% 58.4%, 0.0% 50.0%, 7.8% 41.6%, 3.8% 30.9%, 14.2% 26.1%, 14.6% 14.6%, 26.1% 14.2%, 30.9% 3.8%, 41.6% 7.8%);
			transform: rotate(-10deg);
		}

		.sale_rate::after {
			content: "OFF";
			display: block;
			font-size: 6px;
			letter-spacing: 0.5px;
		}

		.sale_price,
		.original_price {
			font-family: "Anton", sans-serif;
			font-size: 13px;
			line-height: 1;
			text-shadow: 2px 2px 0 #111;
			transform-origin: left bottom;
		}

		.sale_price {
			display: none;
		}

		.original_price {
			display: block;
		}

		.sale_price span,
		.original_price span {
			margin-left: 3px;
			font-family: "Noto Sans KR", sans-serif;
			font-size: 9px;
			font-weight: 900;
		}

		.price_box.pop .sale_price,
		.price_box.pop .original_price {
			animation: pricePop 0.45s ease-out;
		}

		.price_box.pop .sale_rate {
			animation: ratePop 0.5s ease-out;
		}

		@keyframes pricePop {
			0% {
				transform: scale(0.8);
				opacity: 0;
			}

			60% {
				transform: scale(1.08);
				opacity: 1;
			}

			100% {
				transform: scale(1);
			}
		}

		@keyframes ratePop {
			0% {
				transform: rotate(-40deg) scale(0.4);
				opacity: 0;
			}

			60% {
				transform: rotate(0deg) scale(1.15);
				opacity: 1;
			}

			100% {
				transform: rotate(-10deg) scale(1);
			}
		}
		/* 대체 배너 */
		.fallback_banner {
			display: none;
			position: relative;
			width: 100%;
			height: 100%;
			overflow: hidden;
		}

		.fallback_link {
			display: block;
			width: 100%;
			height: 100%;
			cursor: pointer;
		}

		.fallback_banner img {
			width: 100%;
			height: 100%;
			object-fit: contain;
			background-position: center center;
		}
		/* 29초에 스크립트가 .is-anim-stopped 추가 → 티커·타이틀 애니메이션 정지 (구글 규정 : 30초 내 정지) */
		.is-anim-stopped .ticker_track {
			animation-play-state: paused;
		}

		.is-anim-stopped .title {
			animation: none;
		}
	</style>
</head>

<body>
	<div class="mobon_reset" id="noHiddenMobon">
		<div class="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
		<div class="mobon_banner">
			<div class="ticker">
				<div class="ticker_track">
					<span>TODAY'S PICK <i>✦ 오늘의 추천 ✦</i> TODAY'S PICK <i>✦ 오늘의 추천 ✦</i> TODAY'S PICK <i>✦ 오늘의 추천 ✦</i></span>
					<span>TODAY'S PICK <i>✦ 오늘의 추천 ✦</i> TODAY'S PICK <i>✦ 오늘의 추천 ✦</i> TODAY'S PICK <i>✦ 오늘의 추천 ✦</i></span>
				</div>
			</div>

			<div class="head">
				<p class="title">TODAY'S PICK</p>
				<p class="pick_tag">SNS 핫템</p>
			</div>

			<div class="card_wrap">
				<!-- JS 동적 생성 -->
			</div>
		</div>
	</div>

	<!-- 노출 추적 태그 -->
	{{wp_imgtag}}

	<!-- 대체 배너 영역 -->
	<div class="fallback_banner" id="hiddenMobon">
		<div class="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
		<div class="fallback_link" onclick="window.open('https://mobon.net/bridge/')">
			<img src="{{HTTP}}/servlet/image/mobon/120x600.png" alt="대체배너">
		</div>
	</div>

	<script>
		document.addEventListener('DOMContentLoaded', () => {
			const frameWidth = {{w}};
			const frameHeight = {{h}};
			const mainBanner = document.getElementById('noHiddenMobon');
			const fallbackBanner = document.getElementById('hiddenMobon');
			const cardWrap = document.querySelector('.card_wrap');
			const bannerContainer = document.querySelector('.mobon_banner');

			const allProducts = window.__mobonProducts;

			if (allProducts.length > 4) allProducts.length = 4;

			/* 할인 상품인 경우 .price_box에 .sale 추가 */
			cardWrap.innerHTML = allProducts.map((item, index) => {
				const isSale = Boolean(item.prdt_prmct);
				return `
					<div class="card ${index === 0 ? 'active' : ''}" data-index="${index}">
						<div class="badge">HOT</div>
						<div class="img_wrap">
							<img class="img" src="${item.img}" data-pcode="${item.pcode}" alt="${item.pnm}" fetchpriority="${index === 0 ? 'high' : 'low'}" decoding="async">
						</div>
						<div class="bg">
							<p class="pnm">${item.pnm}</p>
							<div class="price_box ${isSale ? 'sale' : ''}">
								<div class="sale_rate">${isSale && item.dc_rate ? `${item.dc_rate}<span>%</span>` : ''}</div>
								<div class="sale_price">${isSale ? `${item.prdt_prmct}<span>원</span>` : ''}</div>
								<div class="original_price">${item.price}<span>원</span></div>
							</div>
						</div>
					</div>
				`;
			}).join('');

			const cards = cardWrap.querySelectorAll('.card');
			const totalCards = cards.length;
			let currentIndex = 0;
			let intervalId;

			if (totalCards <= 1) {
				const activeCard = cardWrap.querySelector('.card.active');
				if (activeCard) activeCard.style.flex = '0 0 100%';
			}

			const checkPanning = (img) => {
				const wrap = img.parentElement;
				if (!wrap.clientWidth || !wrap.clientHeight) return;

				const wrapRatio = wrap.clientWidth / wrap.clientHeight;
				const imgRatio = img.naturalWidth / img.naturalHeight;

				const overflowPx = imgRatio > wrapRatio ?
					(wrap.clientHeight * imgRatio) - wrap.clientWidth :
					(wrap.clientWidth / imgRatio) - wrap.clientHeight;

				const overflowRatio = imgRatio > wrapRatio ?
					overflowPx / wrap.clientWidth :
					overflowPx / wrap.clientHeight;

				if (overflowRatio > 0.3) {
					img.classList.add('is-panning');
					img.style.animationDuration = overflowPx <= 40 ? '3s' : '5s';
				} else {
					img.classList.remove('is-panning');
					img.style.animationDuration = '';
				}
			};

			function updatePanningForAll() {
				cards.forEach(card => {
					const img = card.querySelector('.img');
					if (img.complete && img.naturalWidth > 0) {
						checkPanning(img);
					}
				});
			}

			function showCard(index) {
				cards.forEach((card, i) => {
					card.classList.toggle('active', i === index);
				});

				const priceBoxEl = cards[index] && cards[index].querySelector('.price_box');
				if (priceBoxEl) {
					priceBoxEl.classList.remove('pop');
					void priceBoxEl.offsetWidth;
					priceBoxEl.classList.add('pop');
				}

				setTimeout(updatePanningForAll, 350);
			}

			function nextCard() {
				currentIndex = (currentIndex + 1) % totalCards;
				showCard(currentIndex);
			}

			function startSlider() {
				if (totalCards <= 1) return;
				stopSlider();
				/* 3초 마다 */
				intervalId = setInterval(nextCard, 3000);
			}

			function stopSlider() {
				clearInterval(intervalId);
			}

			let hoverTimeout;
			cards.forEach(card => {
				const img = card.querySelector('.img');
				img.addEventListener('load', () => checkPanning(img), {
					once: true
				});

				card.addEventListener('mouseenter', () => {
					clearTimeout(hoverTimeout);
					hoverTimeout = setTimeout(() => {
						currentIndex = parseInt(card.getAttribute('data-index'), 10);
						showCard(currentIndex);
					}, 150);
				});

				card.addEventListener('mouseleave', () => {
					clearTimeout(hoverTimeout);
				});

				card.addEventListener('click', (e) => {
					e.stopPropagation();
					const index = parseInt(card.getAttribute('data-index'), 10);
					const purl = allProducts[index].purl;
					if (purl && purl !== "javascript:void(0)") {
						window.open(purl, '_blank');
					}
				});
			});

			bannerContainer.addEventListener('mouseenter', stopSlider);
			bannerContainer.addEventListener('mouseleave', startSlider);

			bannerContainer.addEventListener('click', () => {
				const purl = allProducts[currentIndex].purl;
				if (purl && purl !== "javascript:void(0)") {
					window.open(purl, '_blank');
				}
			});

			updatePanningForAll();
			/* 이미지 에러 감지 → 대체 배너 */
			const handleImageErrors = () => {
				const allBannerImages = document.querySelectorAll('#noHiddenMobon img');
				let isFallbackTriggered = false;
				const handleImageError = (event) => {
					if (isFallbackTriggered) return;
					isFallbackTriggered = true;
					const pcode = event.target.dataset.pcode || '';
					if (mainBanner) mainBanner.style.display = 'none';
					if (fallbackBanner) {
						fallbackBanner.style.display = 'block';
						fallbackBanner.style.width = `${frameWidth}px`;
						fallbackBanner.style.height = `${frameHeight}px`;
					}
					const errorUrl =
						`{{HTTP_DR}}/rtbShop?uid=${encodeURIComponent("{{UUID}}")}&u={{USER}}&pc=${pcode}&itlTpCode={{ITL_TP_CODE}}`;
					(new Image()).src = errorUrl;
				};
				allBannerImages.forEach(img => {
					if (img.getAttribute('src') && img.complete && img.naturalHeight === 0) {
						handleImageError({
							target: img
						});
					} else {
						img.addEventListener('error', handleImageError);
					}
				});
			};
			handleImageErrors();

			startSlider();
		});
	</script>
	<script>
		/* 구글 규정 : 30초 내 애니메이션 정지 → 29초에 티커·타이틀 정지 */
		setTimeout(() => {
			document.documentElement.classList.add('is-anim-stopped');
		}, 29000);
	</script>
</body>

</html>
