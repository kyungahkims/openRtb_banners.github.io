<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>구글RTB 배너</title>
	<style>
		/* 1. 웹 폰트 */
		@import url("https://fonts.googleapis.com/css2?family=Anton&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap");
		@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");

		/* 2. 배너 & 이미지 규격 */
		:root {
			--width: 300px;
			--height: 600px;
		}

		/* 3. 공통사항 */
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		.mobonLogo {
			position: absolute;
			top: 2px;
			right: 2px;
			width: 11px;
			height: 11px;
			background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo02.png') center center;
			background-size: 11px 11px;
			opacity: 0.8;
			z-index: 1001;
			cursor: pointer;
		}

		.mobonLogo:hover {
			width: 73px;
			height: 15px;
			background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo_over02.png') center center;
			background-size: 73px 15px;
		}

		/* 4. 해당 사이즈 배너 */
		.mobon_reset {
			position: relative;
			width: var(--width);
			height: var(--height);
			font-family: "Noto Sans KR", sans-serif;
			overflow: hidden;
		}

		.mobon_banner {
			display: flex;
			flex-direction: column;
			width: 100%;
			height: 100%;
			color: #fff;
			background-color: #d90f27;
			cursor: pointer;
		}

		.ticker {
			display: flex;
			align-items: center;
			flex-shrink: 0;
			height: 26px;
			background-color: #111;
			overflow: hidden;
		}

		.ticker_track {
			display: flex;
			font-family: "Anton", "Noto Sans KR", sans-serif;
			font-size: 14px;
			letter-spacing: 1px;
			white-space: nowrap;
			color: #ffe600;
			animation: tickerMove 7s linear infinite;
		}

		.ticker_track span {
			padding-right: 26px;
		}

		.ticker_track i {
			position: relative;
			top: -1px;
			font-style: normal;
		}

		@keyframes tickerMove {
			0% {
				transform: translateX(0);
			}

			100% {
				transform: translateX(-50%);
			}
		}

		.content {
			position: relative;
			display: flex;
			flex-direction: column;
			flex: 1;
			min-height: 0;
		}

		.slider_wrap {
			position: relative;
			flex-shrink: 0;
			width: 100%;
			height: 262px;
			border-bottom: 3px solid #ffe600;
			overflow: hidden;
		}

		.img {
			width: 100%;
			height: 100%;
			object-fit: cover;
			object-position: center;
		}

		.img.is-panning {
			object-position: left top;
			animation: panImage 5s ease-in-out infinite alternate;
		}

		@keyframes panImage {
			0% {
				object-position: left top;
			}

			100% {
				object-position: right bottom;
			}
		}

		.badge {
			position: absolute;
			top: 10px;
			left: 8px;
			font-family: "Black Han Sans", sans-serif;
			font-size: 15px;
			line-height: 1;
			color: #111;
			background-color: #ffe600;
			animation: badgeShake 0.25s ease-in-out infinite;
			padding: 6px 8px 2px;
			z-index: 2;
		}

		@keyframes badgeShake {

			0%,
			100% {
				transform: rotate(-2deg);
			}

			50% {
				transform: rotate(2deg);
			}
		}

		.bg {
			position: relative;
			display: flex;
			flex-direction: column;
			flex: 1;
			min-width: 0;
			padding: 16px 18px 14px;
			z-index: 1;
		}

		.title {
			font-family: "Anton", sans-serif;
			font-size: 36px;
			line-height: 1;
			white-space: nowrap;
			color: #ffe600;
			text-shadow: 2px 2px 0 #111;
			animation: titleFlash 0.8s steps(2) infinite;
		}

		@keyframes titleFlash {

			0%,
			100% {
				opacity: 1;
			}

			50% {
				opacity: 0.4;
			}
		}

		.pick_tag {
			align-self: flex-start;
			font-size: 12px;
			font-weight: 700;
			background-color: #111;
			margin-top: 12px;
			padding: 3px 9px;
		}

		.pnm {
			font-family: "pretendard", sans-serif;
			font-size: 22px;
			font-weight: 900;
			line-height: 1.25;
			letter-spacing: -0.5px;
			word-break: break-all;
			overflow-wrap: break-word;
			display: -webkit-box;
			-webkit-line-clamp: 2;
			-webkit-box-orient: vertical;
			overflow: hidden;
			margin-top: 14px;
		}

		.price_box {
			white-space: nowrap;
			border-top: 2px dashed rgba(255, 255, 255, 0.65);
			margin-top: auto;
			margin-right: -18px;
			padding: 14px 18px 0 0;
		}

		.price_box::after {
			content: "";
			position: relative;
			top: -57px;
			display: block;
			width: 12px;
			height: 12px;
			border-radius: 50%;
			background-color: #111;
			margin: 0 -24px -12px auto;
		}

		.sale .sale_rate,
		.sale .sale_price {
			display: block;
		}

		.sale .original_price {
			display: none;
		}

		.sale .sale_rate:empty {
			display: none;
		}

		.sale_rate {
			display: none;
			position: absolute;
			top: -38px;
			right: 16px;
			width: 72px;
			height: 72px;
			font-family: "Anton", sans-serif;
			font-size: 27px;
			line-height: 1;
			text-align: center;
			color: #111;
			background-color: #ffe600;
			padding-top: 16px;
			clip-path: polygon(50.0% 0.0%, 58.4% 7.8%, 69.1% 3.8%, 73.9% 14.2%, 85.4% 14.6%, 85.8% 26.1%, 96.2% 30.9%, 92.2% 41.6%, 100.0% 50.0%, 92.2% 58.4%, 96.2% 69.1%, 85.8% 73.9%, 85.4% 85.4%, 73.9% 85.8%, 69.1% 96.2%, 58.4% 92.2%, 50.0% 100.0%, 41.6% 92.2%, 30.9% 96.2%, 26.1% 85.8%, 14.6% 85.4%, 14.2% 73.9%, 3.8% 69.1%, 7.8% 58.4%, 0.0% 50.0%, 7.8% 41.6%, 3.8% 30.9%, 14.2% 26.1%, 14.6% 14.6%, 26.1% 14.2%, 30.9% 3.8%, 41.6% 7.8%);
			transform: rotate(-10deg);
		}

		.sale_rate::after {
			content: "OFF";
			display: block;
			font-size: 13px;
			letter-spacing: 0.5px;
		}

		.sale_price,
		.original_price {
			font-family: "Anton", sans-serif;
			font-size: 36px;
			line-height: 1;
			text-shadow: 2px 2px 0 #111;
			transform-origin: left bottom;
		}

		.sale_price {
			display: none;
		}

		.original_price {
			display: block;
		}

		.sale_price span,
		.original_price span {
			margin-left: 7px;
			font-family: "Noto Sans KR", sans-serif;
			font-size: 16px;
			font-weight: 900;
		}

		.price_box.pop .sale_price,
		.price_box.pop .original_price {
			animation: pricePop 0.45s ease-out;
		}

		.price_box.pop .sale_rate {
			animation: ratePop 0.5s ease-out;
		}

		@keyframes pricePop {
			0% {
				transform: scale(0.8);
				opacity: 0;
			}

			60% {
				transform: scale(1.08);
				opacity: 1;
			}

			100% {
				transform: scale(1);
			}
		}

		@keyframes ratePop {
			0% {
				transform: rotate(-40deg) scale(0.4);
				opacity: 0;
			}

			60% {
				transform: rotate(0deg) scale(1.15);
				opacity: 1;
			}

			100% {
				transform: rotate(-10deg) scale(1);
			}
		}

		.mobon_banner_wrap {
			display: flex;
			flex-shrink: 0;
			gap: 6px;
			padding: 0 18px 16px;
		}

		.mobon_banner_wrap .mobon_banner {
			display: block;
			flex: 1;
			width: auto;
			min-width: 0;
			height: 60px;
			border: 2px solid rgba(255, 255, 255, 0.35);
			opacity: 0.85;
			transition: opacity 0.2s ease, border-color 0.2s ease;
		}

		.mobon_banner_wrap .mobon_banner.active {
			border-color: #ffe600;
			opacity: 1;
		}
		/* 29초에 스크립트가 .is-anim-stopped 추가 → 티커·타이틀 애니메이션 정지 (구글 규정 : 30초 내 정지) */
		.is-anim-stopped .ticker_track {
			animation-play-state: paused;
		}

		.is-anim-stopped .title {
			animation: none;
		}
	</style>
</head>

<body>
	<div class="mobon_reset">
		<div class="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
		<div class="mobon_banner">
			<div class="ticker">
				<div class="ticker_track">
					<span>TODAY'S PICK <i>✦ 오늘의 추천 ✦</i> TODAY'S PICK <i>✦ 오늘의 추천 ✦</i> TODAY'S PICK <i>✦ 오늘의 추천 ✦</i></span>
					<span>TODAY'S PICK <i>✦ 오늘의 추천 ✦</i> TODAY'S PICK <i>✦ 오늘의 추천 ✦</i> TODAY'S PICK <i>✦ 오늘의 추천 ✦</i></span>
				</div>
			</div>

			<div class="content">
				<div class="slider_wrap">
					<img class="img" src="" alt="메인 이미지">
				</div>
				<div class="badge">HOT</div>

				<div class="bg">
					<p class="title">TODAY'S PICK</p>
					<p class="pick_tag">SNS 핫템</p>
					<p class="pnm"></p>

					<!-- 할인 상품인 경우 .price_box에 .sale 추가 -->
					<div class="price_box sale">
						<div class="sale_rate"></div>
						<div class="sale_price"></div>
						<div class="original_price"></div>
					</div>
				</div>

				<div class="mobon_banner_wrap">
					<!-- 썸네일 동적 생성 -->
				</div>
			</div>
		</div>
	</div>

	<script>
		(() => {
			const mainImgEl = document.querySelector('.img');
			const pnmEl = document.querySelector('.pnm');
			const priceBoxEl = document.querySelector('.price_box');
			const saleRateEl = document.querySelector('.sale_rate');
			const salePriceEl = document.querySelector('.sale_price');
			const originalPriceEl = document.querySelector('.original_price');
			const mobonBannerWrap = document.querySelector('.mobon_banner_wrap');

			const allProducts = [{
					img: "https://cafe24img.poxo.com/dabainsang/web/product/small/202607/e623213db5bca94aa297685e252f0857.webp",
					pnm: "[봄신상 특가] 프리미엄 코튼 벨티드 트렌치 원피스 허리끈 세트 구성 데일리 오피스룩 추천 상품",
					dc_rate: "25",
					prdt_prmct: "9,989,900",
					price: "198,000",
					pcode: "test1",
					purl: "javascript:void(0)",
					advrtsReplcCode: "01",
					advrtsReplcNm: ""
				},
				{
					img: "https://cafe24img.poxo.com/dabainsang/web/product/small/202607/34d5572c55d7962dc09e3688c031d90e.jpg",
					pnm: "베이직 라운드 반팔 티셔츠",
					dc_rate: "15",
					prdt_prmct: "15,900",
					price: "19,000",
					pcode: "test2",
					purl: "javascript:void(0)",
					advrtsReplcCode: "01",
					advrtsReplcNm: ""
				},
				{
					img: "https://cafe24img.poxo.com/dabainsang/web/product/small/202607/228785c2d74d7238046842d7afaab05b.webp",
					pnm: "와이드 핏 데님 팬츠",
					dc_rate: "20",
					prdt_prmct: "29,900",
					price: "38,000",
					pcode: "test3",
					purl: "javascript:void(0)",
					advrtsReplcCode: "01",
					advrtsReplcNm: ""
				},
				{
					img: "https://cafe24img.poxo.com/dabainsang/web/product/small/202605/4d1d0b5a8cb9825defe09be105af08cb.jpg",
					pnm: "여름 린넨 밴딩 쇼츠",
					dc_rate: "",
					prdt_prmct: "",
					price: "28,000",
					pcode: "test4",
					purl: "javascript:void(0)",
					advrtsReplcCode: "01",
					advrtsReplcNm: ""
				}
			];
			if (allProducts.length > 4) allProducts.length = 4;

			const urlParams = new URLSearchParams(window.location.search);
			const itemsCount = urlParams.get('items');
			if (itemsCount) {
				allProducts.length = Math.min(allProducts.length, parseInt(itemsCount, 10));
			}

			mobonBannerWrap.innerHTML = allProducts.map((item, index) => {
				return `<div class="mobon_banner" data-index="${index}">
							<img class="img" src="${item.img}" alt="${item.pnm}" fetchpriority="${index === 0 ? 'high' : 'low'}" decoding="async">
						</div>`;
			}).join('');

			const mobonBanners = document.querySelectorAll('.mobon_banner_wrap .mobon_banner');
			const mobonBanner = document.querySelector('.mobon_banner');

			let currentIndex = 0;
			const totalImages = allProducts.length;
			if (totalImages <= 1) {
				mobonBannerWrap.style.display = 'none';
			}
			let intervalId;

			const checkPanning = (img) => {
				const wrap = img.parentElement;
				if (!wrap.clientWidth || !wrap.clientHeight) return;

				const wrapRatio = wrap.clientWidth / wrap.clientHeight;
				const imgRatio = img.naturalWidth / img.naturalHeight;

				const overflowPx = imgRatio > wrapRatio ?
					(wrap.clientHeight * imgRatio) - wrap.clientWidth :
					(wrap.clientWidth / imgRatio) - wrap.clientHeight;

				const overflowRatio = imgRatio > wrapRatio ?
					overflowPx / wrap.clientWidth :
					overflowPx / wrap.clientHeight;

				if (overflowRatio > 0.3) {
					img.classList.add('is-panning');
					img.style.animationDuration = overflowPx <= 40 ? '3s' : '5s';
				} else {
					img.classList.remove('is-panning');
					img.style.animationDuration = '';
				}
			};

			mobonBanners.forEach(banner => {
				const thumbImg = banner.querySelector('.img');
				if (thumbImg) {
					if (thumbImg.complete && thumbImg.naturalWidth > 0) {
						checkPanning(thumbImg);
					} else {
						thumbImg.addEventListener('load', () => checkPanning(thumbImg), {
							once: true
						});
					}
				}
			});

			function showProduct(index) {
				mobonBanners.forEach(t => t.classList.remove('active'));
				if (mobonBanners[index]) {
					mobonBanners[index].classList.add('active');
				}

				priceBoxEl.classList.remove('pop');
				void priceBoxEl.offsetWidth;
				priceBoxEl.classList.add('pop');

				const product = allProducts[index];
				if (product) {
					const isSale = Boolean(product.prdt_prmct);

					mainImgEl.src = product.img;

					if (mainImgEl.complete && mainImgEl.naturalWidth > 0) {
						checkPanning(mainImgEl);
					} else {
						mainImgEl.addEventListener('load', () => checkPanning(mainImgEl), {
							once: true
						});
					}

					pnmEl.textContent = product.pnm;
					priceBoxEl.classList.toggle('sale', isSale);
					saleRateEl.innerHTML = isSale && product.dc_rate ? `${product.dc_rate}<span>%</span>` : '';
					salePriceEl.innerHTML = isSale ? `${product.prdt_prmct}<span>원</span>` : '';
					originalPriceEl.innerHTML = `${product.price}<span>원</span>`;
				}
			}

			function nextProduct() {
				currentIndex = (currentIndex + 1) % totalImages;
				showProduct(currentIndex);
			}

			function startSlider() {
				if (totalImages <= 1) return;
				stopSlider();
				/* 3초 마다 */
				intervalId = setInterval(nextProduct, 3000);
			}

			function stopSlider() {
				clearInterval(intervalId);
			}

			mobonBanner.addEventListener('mouseenter', stopSlider);
			mobonBanner.addEventListener('mouseleave', startSlider);

			mobonBanners.forEach(thumb => {
				thumb.addEventListener('mouseenter', () => {
					currentIndex = parseInt(thumb.getAttribute('data-index'));
					showProduct(currentIndex);
				});

				thumb.addEventListener('click', (e) => {
					e.stopPropagation();
					const index = parseInt(thumb.getAttribute('data-index'));
					const purl = allProducts[index].purl;
					if (purl && purl !== "javascript:void(0)") {
						window.open(purl, '_blank');
					}
				});
			});

			mobonBanner.addEventListener('click', () => {
				const purl = allProducts[currentIndex].purl;
				if (purl && purl !== "javascript:void(0)") {
					window.open(purl, '_blank');
				}
			});

			showProduct(currentIndex);
			startSlider();
		})();
	</script>
	<script>
		/* 구글 규정 : 30초 내 애니메이션 정지 → 29초에 티커·타이틀 정지 */
		setTimeout(() => {
			document.documentElement.classList.add('is-anim-stopped');
		}, 29000);
	</script>
</body>

</html>
