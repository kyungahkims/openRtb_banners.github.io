					if (isFallbackTriggered) return;

					const pcode = event.target.dataset.pcode || '';
					if (mainBanner) mainBanner.style.display = 'none';
					if (fallbackBanner) {
						fallbackBanner.style.display = 'block';
						fallbackBanner.style.width = `${frameWidth}px`;

					(new Image()).src = errorUrl;
				};
				allBannerImages.forEach(img =&gt; {
					if (img.getAttribute('src') &amp;&amp; img.complete &amp;&amp; img.naturalHeight === 0) {
						handleImageError({
							target: img
						});
					} else {
						img.addEventListener('error', handleImageError);
					}
				});
			};
			handleImageErrors();
			progressWrap.innerHTML = allProducts.map(() =&gt; '&lt;span class=&quot;progress_bar&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;/span&gt;').join('');

			if (allProducts.length &lt;= 1) progressWrap.style.display = 'none';

			const images = document.querySelectorAll('.slider_wrap .img');
			const progressBars = document.querySelectorAll('.progress_bar');

			const loadRestImages = () =&gt; {
				images.forEach(img =&gt; {
					if (img.dataset.src) {
						img.src = img.dataset.src;
						delete img.dataset.src;
					}
				});
			};

			if (images[0]) {
				if (images[0].complete) {
					loadRestImages();
				} else {
					images[0].addEventListener('load', loadRestImages, { once: true });
					images[0].addEventListener('error', loadRestImages, { once: true });
				}
			}

			let currentIndex = 0;
			const totalImages = images.length;
			let intervalId;

			const checkPanning = (img) =&gt; {
				const wrap = img.parentElement;
				if (!wrap.clientWidth || !wrap.clientHeight) return;

				const wrapRatio = wrap.clientWidth / wrap.clientHeight;
				const imgRatio = img.naturalWidth / img.naturalHeight;

				const overflowPx = imgRatio &gt; wrapRatio ?
					(wrap.clientHeight * imgRatio) - wrap.clientWidth :
					(wrap.clientWidth / imgRatio) - wrap.clientHeight;

				const overflowRatio = imgRatio &gt; wrapRatio ?
					overflowPx / wrap.clientWidth :
					overflowPx / wrap.clientHeight;

				if (overflowRatio &gt; 0.3) {
					img.classList.add('is-panning');
					img.style.animationDuration = overflowPx &lt;= 40 ? '3s' : '5s';
				} else {
					img.classList.remove('is-panning');
					img.style.animationDuration = '';
				}
			};

			function showImage(index) {
				images.forEach(img =&gt; img.classList.remove('active'));
				if (avatarEl &amp;&amp; allProducts[index]) avatarEl.src = allProducts[index].img;
				if (images[index]) {
					images[index].classList.add('active');

					if (images[index].complete &amp;&amp; images[index].naturalWidth &gt; 0) {
						checkPanning(images[index]);
					} else {
						images[index].addEventListener('load', () =&gt; checkPanning(images[index]), { once: true });
					}
				}

				progressBars.forEach((bar, i) =&gt; {
					bar.classList.remove('done', 'active');
					if (i &lt; index) bar.classList.add('done');
				});
				if (progressBars[index] &amp;&amp; totalImages &gt; 1) {
					void progressBars[index].offsetWidth;
					progressBars[index].classList.add('active');
				}
			}

			function nextImage() {
				currentIndex = (currentIndex + 1) % totalImages;
				showImage(currentIndex);
			}

			function startSlider() {
				if (totalImages &lt;= 1) return;
				stopSlider();
				bannerContainer.classList.remove('paused');
				showImage(currentIndex);

				intervalId = setInterval(nextImage, 3000);
			}

			function stopSlider() {
				clearInterval(intervalId);
				bannerContainer.classList.add('paused');
			}

			bannerContainer.addEventListener('mouseenter', stopSlider);
			bannerContainer.addEventListener('mouseleave', startSlider);

			bannerContainer.addEventListener('click', () =&gt; {
				const purl = allProducts[currentIndex].purl;
				if (purl) {
					window.open(purl);
				}
			});

			showImage(currentIndex);

			startSlider();
		})();

			const progressBars = document.querySelectorAll('.progress_bar');

				images.forEach(img =&gt; {
					if (img.dataset.src) {

						delete img.dataset.src;
					}
				});

				const wrap = img.parentElement;
				if (!wrap.clientWidth || !wrap.clientHeight) return;

				const wrapRatio = wrap.clientWidth / wrap.clientHeight;
				const imgRatio = img.naturalWidth / img.naturalHeight;

				const overflowPx = imgRatio &gt; wrapRatio ?
					(wrap.clientHeight * imgRatio) - wrap.clientWidth :
					(wrap.clientWidth / imgRatio) - wrap.clientHeight;

				const overflowRatio = imgRatio &gt; wrapRatio ?
					overflowPx / wrap.clientWidth :
					overflowPx / wrap.clientHeight;

				if (overflowRatio &gt; 0.3) {
					img.classList.add('is-panning');

					} else {

					if (i &lt; index) bar.classList.add('done');

					void progressBars[index].offsetWidth;
					progressBars[index].classList.add('active');
				}
			}

			function nextImage() {
				currentIndex = (currentIndex + 1) % totalImages;
				showImage(currentIndex);
			}

			function startSlider() {
				if (totalImages &lt;= 1) return;
				stopSlider();
				bannerContainer.classList.remove('paused');
				showImage(currentIndex);

				intervalId = setInterval(nextImage, 3000);
			}

			function stopSlider() {
				clearInterval(intervalId);
				bannerContainer.classList.add('paused');
			}

			bannerContainer.addEventListener('mouseenter', stopSlider);
			bannerContainer.addEventListener('mouseleave', startSlider);

			bannerContainer.addEventListener('click', () =&gt; {

				if (purl) {
					window.open(purl);
				}
			});

			showImage(currentIndex);

			startSlider();
		})();

				}, { once: true });
			}

			function startSlider() {
				if (totalImages &lt;= 1) return;
				stopSlider();

				intervalId = setInterval(nextThumb, 1800);
			}

			function stopSlider() {
				clearInterval(intervalId);
			}

			mobonBanner.addEventListener('mouseenter', stopSlider);
			mobonBanner.addEventListener('mouseleave', startSlider);

			thumbs.forEach(thumb =&gt; {
				thumb.addEventListener('click', (e) =&gt; {
					e.stopPropagation();
					const index = parseInt(thumb.getAttribute('data-index'));
					const purl = allProducts[index].purl;
					if (purl) {
						window.open(purl);
					}
				});
			});

			mobonBanner.addEventListener('click', () =&gt; {
				const purl = allProducts[0].purl;
				if (purl) {
					window.open(purl);
				}
			});

			setAvatar();
			startSlider();
		})();
	&lt;/script&gt;
&lt;/body&gt;

&lt;/html&gt;"></iframe>
			</div>
		</div>
	</div>

	<script>
		setTimeout(() => {
			let pass = 0, fail = 0;
			document.querySelectorAll('.banner-container').forEach(item => {
				const iframe = item.querySelector('iframe');
				const box = item.querySelector('.result');
				const msgs = [];
				const info = [];
				try {
					const d = iframe.contentDocument;
					const main = d.getElementById('noHiddenMobon');
					const fb = d.getElementById('hiddenMobon');
					const imgs = [...d.querySelectorAll('.img')];

					if (!main || main.style.display === 'none') msgs.push('본 배너 숨김');
					if (fb && fb.style.display === 'block') msgs.push('대체 배너로 전환됨');
					if (!imgs.length) msgs.push('상품 이미지 없음');
					const noSrc = imgs.filter(i => !i.getAttribute('src'));
					if (noSrc.length) msgs.push(noSrc.length + '장 src 미할당');
					const broken = imgs.filter(i => i.complete && i.naturalHeight === 0);
					if (broken.length) msgs.push(broken.length + '장 로드 실패');
					const pnm = d.querySelector('.pnm');
					if (pnm && !pnm.textContent.trim()) msgs.push('캡션 비어있음');
					const tags = d.querySelector('.tags');
					if (tags && !tags.textContent.trim()) msgs.push('해시태그 비어있음');
					const avatar = d.querySelector('.brand_avatar');
					if (avatar && !avatar.getAttribute('src')) msgs.push('프로필 이미지 미할당');
					info.push('이미지 ' + imgs.length + '장');
				} catch (e) {
					msgs.push('검사 실패: ' + e.message);
				}
				const bad = msgs.length > 0;
				box.className = 'result ' + (bad ? 'fail' : 'pass');
				box.textContent = (bad ? '문제: ' + msgs.join(', ') + ' / ' : '정상 · ') + info.join(', ');
				bad ? fail++ : pass++;
			});
			const s = document.getElementById('summary');
			s.textContent = '통과 ' + pass + ' / 문제 ' + fail;
			s.className = fail ? 'fail' : 'pass';
		}, 4000);
	</script>
