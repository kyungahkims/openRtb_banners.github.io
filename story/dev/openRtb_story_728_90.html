<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>카카오RTB 배너</title>
	<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
	<link rel="stylesheet"
		href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
	<script>
		window.__mobonProducts = [{{productList}}];
		window.__mobonPreload = (() => {
			try {
				const first = window.__mobonProducts[0];
				if (!first || !first.img) return;
				const link = document.createElement('link');
				link.rel = 'preload';
				link.as = 'image';
				link.href = first.img;
				link.fetchPriority = 'high';
				document.head.appendChild(link);
			} catch (e) {}
		})();
	</script>
	<style>
		:root {
			--width: 728px;
			--height: 90px;
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		.mobonLogo {
			position: absolute;
			top: 2px;
			right: 2px;
			width: 11px;
			height: 11px;
			background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo02.png') center center;
			background-size: 11px 11px;
			opacity: 0.8;
			z-index: 1001;
			cursor: pointer;
		}

		.mobonLogo:hover {
			width: 73px;
			height: 15px;
			background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo_over02.png') center center;
			background-size: 73px 15px;
		}

		.mobon_reset {
			position: relative;
			width: var(--width);
			height: var(--height);
			font-family: "pretendard", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
			overflow: hidden;
		}

		.mobon_banner {
			display: flex;
			width: 100%;
			height: 100%;
			background-color: #fff;
			color: #222;
			cursor: pointer;
		}

		.bg {
			display: flex;
			flex-direction: column;
			justify-content: center;
			flex-shrink: 0;
			gap: 5px;
			width: 238px;
			height: 100%;
			padding: 8px 12px;
			overflow: hidden;
		}

		.brand_wrap {
			display: flex;
			align-items: center;
			gap: 6px;
			line-height: 1;
		}

		.brand_avatar {
			display: block;
			flex-shrink: 0;
			width: 20px;
			height: 20px;
			border-radius: 50%;
			object-fit: cover;
			object-position: center top;
			background-color: #eee;
			box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.08);
		}

		.brand_name {
			flex: 0 1 auto;
			min-width: 0;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			font-size: 13px;
			font-weight: 700;
			line-height: 20px;
			letter-spacing: -0.3px;
			color: #222;
		}

		.verified {
			display: block;
			flex-shrink: 0;
			width: 13px;
			height: 13px;
			margin-left: -3px;
		}

		.post_time {
			flex-shrink: 0;
			font-size: 12px;
			font-weight: 400;
			letter-spacing: -0.2px;
			color: #8e8e8e;
			white-space: nowrap;
		}

		.pnm {
			font-size: 14px;
			font-weight: 500;
			line-height: 1.3;
			color: #222;
			word-break: keep-all;
			overflow-wrap: break-word;
			display: -webkit-box;
			-webkit-line-clamp: 2;
			-webkit-box-orient: vertical;
			overflow: hidden;
		}

		.pnm .more {
			font-weight: 400;
			color: #8a8a8a;
			text-decoration: underline;
			text-decoration-color: transparent;
			text-underline-offset: 2px;
			transition: text-decoration-color 0.2s ease, color 0.2s ease;
		}

		.pnm .more:hover {
			color: #555;
			text-decoration-color: currentColor;
		}

		.pnm .tags {
			vertical-align: baseline;
			line-height: 1.5;
			margin-right: 2px;
			font-size: 12px;
			letter-spacing: -0.2px;
			font-weight: 500;
			color: #2f5d9e;
		}

		.mobon_banner_wrap {
			position: relative;
			flex: 1;
			min-width: 0;
			padding: 5px 5px 5px 0;
			overflow: hidden;
		}

		.mobon_banner_wrap::after {
			content: '';
			position: absolute;
			top: 0;
			right: 0;
			bottom: 0;
			width: 36px;
			background: linear-gradient(to right, rgba(255, 255, 255, 0), #fff);
			pointer-events: none;
			z-index: 1;
		}

		.track {
			display: flex;
			height: 100%;
			gap: 4px;
			will-change: transform;
		}

		.thumb {
			position: relative;
			flex: 0 0 85px;
			border-radius: 8px;
			overflow: hidden;
			background-color: #f2f2f2;
			cursor: pointer;
		}

		.img {
			display: block;
			width: 100%;
			height: 100%;
			object-fit: cover;
			object-position: center;
			transition: transform 0.4s ease;
		}

		.thumb:hover .img {
			transform: scale(1.05);
		}

		.fallback_banner {
			display: none;
			position: relative;
			width: 100%;
			height: 100%;
			overflow: hidden;
		}

		.fallback_link {
			display: block;
			width: 100%;
			height: 100%;
			cursor: pointer;
		}

		.fallback_banner img {
			width: 100%;
			height: 100%;
			object-fit: contain;
			background-position: center center;
		}
	</style>
</head>

<body>
	<div class="mobon_reset" id="noHiddenMobon">
		<div class="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
		<div class="mobon_banner">

			<div class="bg">
				<div class="brand_wrap">
					<img class="brand_avatar" src="" alt="" onload="this.style.visibility=''" onerror="this.style.visibility='hidden'">
					<span class="brand_name">{{site_name}}</span>
					<svg class="verified" viewBox="0 0 24 24" aria-hidden="true"><path fill="#3897f0" d="M12 1.5l2.6 1.9 3.2-.2 1 3.1 2.7 1.8-.9 3.1.9 3.1-2.7 1.8-1 3.1-3.2-.2L12 22.5l-2.6-1.9-3.2.2-1-3.1-2.7-1.8.9-3.1-.9-3.1 2.7-1.8 1-3.1 3.2.2z"/><path fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M7.8 12.2l2.8 2.8 5.6-5.8"/></svg>
					<span class="post_time">· 방금</span>
				</div>
				<p class="pnm"><span class="tags">#입소문</span> 솔직히 나만 알고 싶어서 안 올리려다가 공개하는데요.. <span class="more">더보기</span></p>
			</div>

			<div class="mobon_banner_wrap">

			</div>

		</div>
	</div>

	{{wp_imgtag}}

	<div class="fallback_banner" id="hiddenMobon">
		<div class="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
		<div class="fallback_link" onclick="window.open('https://mobon.net/bridge/')">
			<img src="{{HTTP}}/servlet/image/mobon/728x90.png" alt="대체배너">
		</div>
	</div>

	<script>
		(() => {
			const frameWidth = {{w}};
			const frameHeight = {{h}};
			const mainBanner = document.getElementById('noHiddenMobon');
			const fallbackBanner = document.getElementById('hiddenMobon');

			const captions = [
				"솔직히 나만 알고 싶어서 안 올리려다가 공개하는데요..",
				"다들 어디서 샀냐고 연락 오길래 그냥 여기 남겨둘게요..",
				"사진 한 장 올렸을 뿐인데 반응 터져서 당황함..",
				"진짜 나만 아껴두고 이용하려 했던 곳인데..",
				"소문나면 사람 많아질까 봐 숨겨뒀다가 공유함..",
				"나만 알고 있기엔 너무 아까워서 큰맘 먹고 올림..",
				"요즘 주변 사람들한테 입에 침이 마르게 추천하는 중..",
				"단언컨대 올해 돈 쓰고 제일 만족스러웠던 순간..",
				"지인이 슬쩍 와서 어디서 구매했냐고 물어보는데..",
				"SNS에서 후기 좋길래 반신반의했는데 생각보다 더 좋음..",
				"바람피우고 환승한 전남친한테 인스타 스토리 염탐 온 화제의 제품..",
				"동료가 몰래 따라 사놓고 자기가 먼저 샀다고 우김..",
				"팀장님이 회의 중에 이거 어디서 샀냐고 공개 질문함..",
				"이거 올리자마자 안 친한 동창들까지 DM 옴..",
				"이거 알려준 친구한테 밥 사야 할 듯..",
				"[오늘의 운세] 내 사주에 맞는 개운 아이템.."
			];
			const pnmEl = document.querySelector(".pnm");
			const captionText = captions[Math.floor(Math.random() * captions.length)].replace(/\.+$/, "");
			const captionEl = document.createElement("span");
			if (pnmEl) {
				const moreEl = pnmEl.querySelector(".more");
				const tagEl = pnmEl.querySelector(".tags");
				pnmEl.textContent = "";
				if (tagEl) pnmEl.append(tagEl, " ");
				pnmEl.append(captionEl, " ");
				if (moreEl) pnmEl.append(moreEl);
			}
			const fitCaption = () => {
				if (!pnmEl) return;
				let t = captionText;
				captionEl.textContent = t + "..";
				while (pnmEl.scrollHeight > pnmEl.clientHeight + 1 && t.length > 1) {
					t = t.slice(0, -1).trimEnd();
					captionEl.textContent = t + "..";
				}
			};

			const hashtags = ["#입소문", "#SNS에서난리", "#요즘유행", "#요즘이게대세", "#득템찬스", "#심장어택", "#SNS화제", "#럭키비키", "#지금구매찬스", "#품절주의"];
			const tagsEl = document.querySelector(".tags");
			if (tagsEl) {
				const pool = hashtags.slice();
				const picked = [];
				while (picked.length < 1 && pool.length) {
					picked.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
				}
				tagsEl.textContent = picked.join(" ");
			}
			fitCaption();
			if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitCaption);
			const mobonBannerWrap = document.querySelector('.mobon_banner_wrap');
			const mobonBanner = document.querySelector('.mobon_banner');
			const avatarEl = document.querySelector('.brand_avatar');

			const allProducts = window.__mobonProducts;

			if (allProducts.length > 6) allProducts.length = 6;

			mobonBannerWrap.innerHTML = '<div class="track"></div>';
			const track = mobonBannerWrap.querySelector('.track');
			track.innerHTML = allProducts.map((item, index) => {
				return `<div class="thumb" data-index="${index}">
							<img class="img" src="${item.img}" data-pcode="${item.pcode}" alt="${item.pnm}" fetchpriority="${index === 0 ? 'high' : 'low'}" decoding="async">
						</div>`;
			}).join('');

			if (allProducts.length > 1) track.innerHTML += track.innerHTML;

			const handleImageErrors = () => {
				const allBannerImages = document.querySelectorAll('.img');
				let isFallbackTriggered = false;
				const handleImageError = (event) => {
					if (isFallbackTriggered) return;
					isFallbackTriggered = true;
					const pcode = event.target.dataset.pcode || '';
					if (mainBanner) mainBanner.style.display = 'none';
					if (fallbackBanner) {
						fallbackBanner.style.display = 'block';
						fallbackBanner.style.width = `${frameWidth}px`;
						fallbackBanner.style.height = `${frameHeight}px`;
					}
					const errorUrl =
						`{{HTTP_DR}}/rtbShop?uid=${encodeURIComponent("{{UUID}}")}&u={{USER}}&pc=${pcode}&itlTpCode={{ITL_TP_CODE}}`;
					(new Image()).src = errorUrl;
				};
				allBannerImages.forEach(img => {
					if (img.getAttribute('src') && img.complete && img.naturalHeight === 0) {
						handleImageError({
							target: img
						});
					} else {
						img.addEventListener('error', handleImageError);
					}
				});
			};
			handleImageErrors();

			const thumbs = document.querySelectorAll('.mobon_banner_wrap .thumb');

			let currentIndex = 0;
			const totalImages = allProducts.length;
			let intervalId;

			const STEP = 89;
			let moving = false;

			function showThumb() {}

			function setAvatar() {
				const first = track.firstElementChild;
				const i = first ? parseInt(first.getAttribute('data-index')) : 0;
				if (avatarEl && allProducts[i]) avatarEl.src = allProducts[i].img;
			}

			function nextThumb() {
				if (moving) return;
				moving = true;
				track.style.transition = 'transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1)';
				track.style.transform = `translateX(-${STEP}px)`;
				track.addEventListener('transitionend', () => {
					track.style.transition = 'none';
					track.appendChild(track.firstElementChild);
					setAvatar();
					track.style.transform = 'translateX(0)';
					void track.offsetWidth;
					moving = false;
				}, { once: true });
			}

			function startSlider() {
				if (totalImages <= 1) return;
				stopSlider();

				intervalId = setInterval(nextThumb, 1800);
			}

			function stopSlider() {
				clearInterval(intervalId);
			}

			mobonBanner.addEventListener('mouseenter', stopSlider);
			mobonBanner.addEventListener('mouseleave', startSlider);

			thumbs.forEach(thumb => {
				thumb.addEventListener('click', (e) => {
					e.stopPropagation();
					const index = parseInt(thumb.getAttribute('data-index'));
					const purl = allProducts[index].purl;
					if (purl) {
						window.open(purl);
					}
				});
			});

			mobonBanner.addEventListener('click', () => {
				const first = track.firstElementChild;
				const product = allProducts[first ? parseInt(first.getAttribute('data-index')) : 0];
				const purl = product && product.purl;
				if (purl) {
					window.open(purl);
				}
			});

			setAvatar();
			startSlider();
		})();
	</script>
</body>

</html>
