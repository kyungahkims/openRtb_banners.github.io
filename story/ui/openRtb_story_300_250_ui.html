<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>카카오RTB 배너</title>
	<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
	<style>
		/* 1. 웹 폰트 head 에서 비동기 로드 */

		/* 2. 배너 & 이미지 규격 */
		:root {
			--width: 300px;
			--height: 250px;
		}

		/* 3. 공통사항 */
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		.mobonLogo {
			position: absolute;
			top: 2px;
			right: 2px;
			width: 11px;
			height: 11px;
			background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo02.png') center center;
			background-size: 11px 11px;
			opacity: 0.8;
			z-index: 1001;
			cursor: pointer;
		}

		.mobonLogo:hover {
			width: 73px;
			height: 15px;
			background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo_over02.png') center center;
			background-size: 73px 15px;
		}

		/* 4. 해당 사이즈 배너 */
		.mobon_reset {
			position: relative;
			width: var(--width);
			height: var(--height);
			font-family: "pretendard", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
			overflow: hidden;
		}

		/* 흰 피드 카드: 진행바 + 브랜드 → 사진 → 캡션 */
		.mobon_banner {
			position: relative;
			display: flex;
			flex-direction: column;
			width: 100%;
			height: 100%;
			background-color: #fff;
			color: #222;
			cursor: pointer;
		}

		/* 사진: 둥근 프레임 */
		.slider_wrap {
			position: relative;
			flex: 1;
			min-height: 0;
			margin: 0 8px;
			border-radius: 10px;
			background-color: #f2f2f2;
			overflow: hidden;
		}

		.img {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			object-fit: cover;
			object-position: center;
			opacity: 0;
			transition: opacity 0.5s ease;
		}

		.img.active {
			opacity: 1;
		}

		.img.is-panning {
			object-position: left top;
			animation: panImage 5s ease-in-out infinite alternate;
		}

		@keyframes panImage {
			0% {
				object-position: left top;
			}

			100% {
				object-position: right bottom;
			}
		}

		/* 상단: 진행바 + 브랜드 (마크업상 사진 뒤지만 맨 위로) */
		.story_header {
			order: -1;
			display: flex;
			flex-direction: column;
			gap: 7px;
			padding: 7px 10px;
		}

		.progress_wrap {
			display: flex;
			gap: 3px;
		}

		.progress_bar {
			flex: 1;
			height: 2px;
			border-radius: 1px;
			background-color: #e6e6e6;
			overflow: hidden;
		}

		.progress_bar i {
			display: block;
			width: 0;
			height: 100%;
			background-color: #1d1d1f;
		}

		.progress_bar.done i {
			width: 100%;
		}

		.progress_bar.active i {
			animation: fillBar 3s linear forwards;
		}

		.mobon_banner.paused .progress_bar.active i {
			animation-play-state: paused;
		}

		@keyframes fillBar {
			from {
				width: 0;
			}

			to {
				width: 100%;
			}
		}

		/* 하단: 캡션 */
		.bg {
			display: flex;
			flex-direction: column;
			gap: 5px;
			padding: 8px 10px 9px;
		}

		.brand_wrap {
			display: flex;
			align-items: center;
			gap: 7px;
		}

		.brand_avatar {
			display: block;
			flex-shrink: 0;
			width: 22px;
			height: 22px;
			border-radius: 50%;
			object-fit: cover;
			object-position: center top;
			background-color: #eee;
			box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.08);
		}

		.brand_name {
			flex: 0 1 auto;
			min-width: 0;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			font-size: 11.5px;
			font-weight: 700;
			letter-spacing: -0.3px;
			color: #1d1d1f;
		}

		/* 인증 배지 + 올린 시간 */
		.verified {
			display: block;
			flex-shrink: 0;
			width: 12px;
			height: 12px;
			margin-left: -3px;
		}

		.post_time {
			flex-shrink: 0;
			font-size: 11px;
			font-weight: 400;
			letter-spacing: -0.2px;
			color: #8e8e8e;
			white-space: nowrap;
		}

		.pnm {
			font-size: 14px;
			font-weight: 500;
			line-height: 1.3;
			color: #222;
			word-break: keep-all;
			overflow-wrap: break-word;
			display: -webkit-box;
			-webkit-line-clamp: 2;
			-webkit-box-orient: vertical;
			overflow: hidden;
		}

		.pnm .more {
			font-weight: 400;
			color: #8a8a8a;
			text-decoration: underline;
			text-decoration-color: transparent;
			text-underline-offset: 2px;
			transition: text-decoration-color 0.2s ease, color 0.2s ease;
		}

		.pnm .more:hover {
			color: #555;
			text-decoration-color: currentColor;
		}

		/* 해시태그 한 줄 */
		.tags {
			font-size: 12px;
			font-weight: 500;
			line-height: 1.3;
			letter-spacing: -0.2px;
			color: #2f5d9e;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}
	</style>
</head>

<body>
	<div class="mobon_reset">
		<div class="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
		<div class="mobon_banner">
			<div class="slider_wrap">
			</div>

			<div class="story_header">
				<div class="progress_wrap">
				</div>
				<div class="brand_wrap">
					<img class="brand_avatar" src="" alt="">
					<span class="brand_name">다바걸</span>
					<svg class="verified" viewBox="0 0 24 24" aria-hidden="true"><path fill="#3897f0" d="M12 1.5l2.6 1.9 3.2-.2 1 3.1 2.7 1.8-.9 3.1.9 3.1-2.7 1.8-1 3.1-3.2-.2L12 22.5l-2.6-1.9-3.2.2-1-3.1-2.7-1.8.9-3.1-.9-3.1 2.7-1.8 1-3.1 3.2.2z"/><path fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M7.8 12.2l2.8 2.8 5.6-5.8"/></svg>
					<span class="post_time">· 방금</span>
				</div>
			</div>

			<div class="bg">
				<p class="pnm">솔직히 나만 알고 싶어서 안 올리려다가 공개하는데요.. <span class="more">더보기</span></p>
				<p class="tags">#입소문 #득템찬스</p>
			</div>
		</div>
	</div>

	<script>
		(() => {
			/* 스토리 캡션 16종 중 랜덤 노출 */
			const captions = [
				"솔직히 나만 알고 싶어서 안 올리려다가 공개하는데요..",
				"다들 어디서 샀냐고 연락 오길래 그냥 여기 남겨둘게요..",
				"사진 한 장 올렸을 뿐인데 반응 터져서 당황함..",
				"진짜 나만 아껴두고 이용하려 했던 곳인데..",
				"소문나면 사람 많아질까 봐 숨겨뒀다가 공유함..",
				"나만 알고 있기엔 너무 아까워서 큰맘 먹고 올림..",
				"요즘 주변 사람들한테 입에 침이 마르게 추천하는 중..",
				"단언컨대 올해 돈 쓰고 제일 만족스러웠던 순간..",
				"지인이 슬쩍 와서 어디서 구매했냐고 물어보는데..",
				"SNS에서 후기 좋길래 반신반의했는데 생각보다 더 좋음..",
				"바람피우고 환승한 전남친한테 인스타 스토리 염탐 온 화제의 제품..",
				"동료가 몰래 따라 사놓고 자기가 먼저 샀다고 우김..",
				"팀장님이 회의 중에 이거 어디서 샀냐고 공개 질문함..",
				"이거 올리자마자 안 친한 동창들까지 DM 옴..",
				"이거 알려준 친구한테 밥 사야 할 듯..",
				"[오늘의 운세] 내 사주에 맞는 개운 아이템.."
			];
			const pnmEl = document.querySelector(".pnm");
			const captionText = captions[Math.floor(Math.random() * captions.length)].replace(/\.+$/, "");
			const captionEl = document.createElement("span");
			if (pnmEl) {
				const moreEl = pnmEl.querySelector(".more");
				const tagEl = pnmEl.querySelector(".tags");
				pnmEl.textContent = "";
				if (tagEl) pnmEl.append(tagEl, " ");
				pnmEl.append(captionEl, " ");
				if (moreEl) pnmEl.append(moreEl);
			}
			/* 2줄을 넘으면 캡션 끝을 줄여서 "더보기"는 항상 보이게 */
			const fitCaption = () => {
				if (!pnmEl) return;
				let t = captionText;
				captionEl.textContent = t + "..";
				while (pnmEl.scrollHeight > pnmEl.clientHeight + 1 && t.length > 1) {
					t = t.slice(0, -1).trimEnd();
					captionEl.textContent = t + "..";
				}
			};
			/* 해시태그 풀에서 2개 랜덤 */
			const hashtags = ["#입소문", "#SNS에서난리", "#요즘유행", "#요즘이게대세", "#득템찬스", "#심장어택", "#SNS화제", "#럭키비키", "#지금구매찬스", "#품절주의"];
			const tagsEl = document.querySelector(".tags");
			if (tagsEl) {
				const pool = hashtags.slice();
				const picked = [];
				while (picked.length < 2 && pool.length) {
					picked.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
				}
				tagsEl.textContent = picked.join(" ");
			}
			fitCaption();
			if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitCaption);
			const sliderWrap = document.querySelector('.slider_wrap');
			const progressWrap = document.querySelector('.progress_wrap');
			const bannerContainer = document.querySelector('.mobon_banner');
			const avatarEl = document.querySelector('.brand_avatar');

			const allProducts = [{
					img: "https://cafe24img.poxo.com/dabainsang/web/product/small/202607/e623213db5bca94aa297685e252f0857.webp",
					pnm: "코튼 벨티드 원피스",
					dc_rate: "25",
					prdt_prmct: "9,989,900",
					price: "198,000",
					pcode: "test1",
					purl: "javascript:void(0)",
					advrtsReplcCode: "01",
					advrtsReplcNm: ""
				},
				{
					img: "https://cafe24img.poxo.com/dabainsang/web/product/small/202607/34d5572c55d7962dc09e3688c031d90e.jpg",
					pnm: "베이직 라운드 반팔 티셔츠",
					dc_rate: "15",
					prdt_prmct: "15,900",
					price: "19,000",
					pcode: "test2",
					purl: "javascript:void(0)",
					advrtsReplcCode: "01",
					advrtsReplcNm: ""
				},
				{
					img: "https://cafe24img.poxo.com/dabainsang/web/product/small/202607/228785c2d74d7238046842d7afaab05b.webp",
					pnm: "와이드 핏 데님 팬츠",
					dc_rate: "20",
					prdt_prmct: "29,900",
					price: "38,000",
					pcode: "test3",
					purl: "javascript:void(0)",
					advrtsReplcCode: "01",
					advrtsReplcNm: ""
				},
				{
					img: "https://cafe24img.poxo.com/dabainsang/web/product/small/202605/4d1d0b5a8cb9825defe09be105af08cb.jpg",
					pnm: "여름 린넨 밴딩 쇼츠",
					dc_rate: "",
					prdt_prmct: "",
					price: "28,000",
					pcode: "test4",
					purl: "javascript:void(0)",
					advrtsReplcCode: "01",
					advrtsReplcNm: ""
				},
				{
					img: "https://cafe24img.poxo.com/dabainsang/web/product/small/202607/aa8ad2b571d71bdea25f33dc4aeb46e7.webp",
					pnm: "상품 5",
					dc_rate: "",
					prdt_prmct: "",
					price: "",
					pcode: "test5",
					purl: "javascript:void(0)",
					advrtsReplcCode: "01",
					advrtsReplcNm: ""
				},
				{
					img: "https://cafe24img.poxo.com/dabainsang/web/product/small/202607/587c0c1f483d9cbe2a9e89ef5a772fff.webp",
					pnm: "상품 6",
					dc_rate: "",
					prdt_prmct: "",
					price: "",
					pcode: "test6",
					purl: "javascript:void(0)",
					advrtsReplcCode: "01",
					advrtsReplcNm: ""
				}
			];
			/* 스토리 300x250: 최대 3개만 노출 */
			if (allProducts.length > 3) allProducts.length = 3;

			const urlParams = new URLSearchParams(window.location.search);
			const itemsCount = urlParams.get('items');
			if(itemsCount) {
				allProducts.length = Math.min(allProducts.length, parseInt(itemsCount, 10));
			}

			const imageHtml = allProducts.map((item, index) => {
				const activeClass = index === 0 ? 'active' : '';
				const srcAttr = index === 0 ?
					`src="${item.img}" fetchpriority="high"` :
					`data-src="${item.img}"`;
				return `<img class="img ${activeClass}" ${srcAttr} decoding="async" data-pcode="${item.pcode}" alt="${item.pnm}">`;
			}).join('');

			sliderWrap.innerHTML = imageHtml;
			progressWrap.innerHTML = allProducts.map(() => '<span class="progress_bar"><i></i></span>').join('');
			/* 상품 1개면 진행바 숨김 */
			if (allProducts.length <= 1) progressWrap.style.display = 'none';

			const images = document.querySelectorAll('.slider_wrap .img');
			const progressBars = document.querySelectorAll('.progress_bar');

			const loadRestImages = () => {
				images.forEach(img => {
					if (img.dataset.src) {
						img.src = img.dataset.src;
						delete img.dataset.src;
					}
				});
			};

			if (images[0]) {
				if (images[0].complete) {
					loadRestImages();
				} else {
					images[0].addEventListener('load', loadRestImages, { once: true });
					images[0].addEventListener('error', loadRestImages, { once: true });
				}
			}

			let currentIndex = 0;
			const totalImages = images.length;
			let intervalId;

			const checkPanning = (img) => {
				const wrap = img.parentElement;
				if (!wrap.clientWidth || !wrap.clientHeight) return;

				const wrapRatio = wrap.clientWidth / wrap.clientHeight;
				const imgRatio = img.naturalWidth / img.naturalHeight;

				const overflowPx = imgRatio > wrapRatio ?
					(wrap.clientHeight * imgRatio) - wrap.clientWidth :
					(wrap.clientWidth / imgRatio) - wrap.clientHeight;

				const overflowRatio = imgRatio > wrapRatio ?
					overflowPx / wrap.clientWidth :
					overflowPx / wrap.clientHeight;

				if (overflowRatio > 0.3) {
					img.classList.add('is-panning');
					img.style.animationDuration = overflowPx <= 40 ? '3s' : '5s';
				} else {
					img.classList.remove('is-panning');
					img.style.animationDuration = '';
				}
			};

			function showImage(index) {
				images.forEach(img => img.classList.remove('active'));
				/* 프로필 원: 지금 보이는 상품 */
				if (avatarEl && allProducts[index]) avatarEl.src = allProducts[index].img;
				if (images[index]) {
					images[index].classList.add('active');

					if (images[index].complete && images[index].naturalWidth > 0) {
						checkPanning(images[index]);
					} else {
						images[index].addEventListener('load', () => checkPanning(images[index]), { once: true });
					}
				}

				progressBars.forEach((bar, i) => {
					bar.classList.remove('done', 'active');
					if (i < index) bar.classList.add('done');
				});
				if (progressBars[index] && totalImages > 1) {
					void progressBars[index].offsetWidth;
					progressBars[index].classList.add('active');
				}
			}

			function nextImage() {
				currentIndex = (currentIndex + 1) % totalImages;
				showImage(currentIndex);
			}

			function startSlider() {
				if (totalImages <= 1) return;
				stopSlider();
				bannerContainer.classList.remove('paused');
				showImage(currentIndex);
				/* 3초 마다 */
				intervalId = setInterval(nextImage, 3000);
			}

			function stopSlider() {
				clearInterval(intervalId);
				bannerContainer.classList.add('paused');
			}

			bannerContainer.addEventListener('mouseenter', stopSlider);
			bannerContainer.addEventListener('mouseleave', startSlider);

			bannerContainer.addEventListener('click', () => {
				const purl = allProducts[currentIndex].purl;
				if (purl && purl !== "javascript:void(0)") {
					window.open(purl, '_blank');
				}
			});

			showImage(currentIndex);

			startSlider();
		})();
	</script>
</body>

</html>
