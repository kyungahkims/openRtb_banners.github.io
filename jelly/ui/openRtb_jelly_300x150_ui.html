<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>카카오 배너</title>
	<style>
		/* 1. 웹 폰트 */
		@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");

		/* 2. 배너 & 이미지 규격 */
		:root {
			--width: 300px;
			--height: 150px;
		}

		/* 3. 공통사항 */
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		.mobonLogo {
			position: absolute;
			top: 2px;
			right: 2px;
			width: 11px;
			height: 11px;
			background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo02.png') center center;
			background-size: 11px 11px;
			opacity: 0.8;
			z-index: 1001;
			cursor: pointer;
		}

		.mobonLogo:hover {
			width: 73px;
			height: 15px;
			background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo_over02.png') center center;
			background-size: 73px 15px;
		}

		/* 4. 해당 사이즈 배너 */
		.mobon_reset {
			position: relative;
			width: var(--width);
			height: var(--height);
			font-family: "pretendard", -apple-system, "Malgun Gothic", sans-serif;
			color: #111111;
			overflow: hidden;
		}

		/* HOT 태그 */
		.tag_hot {
			position: absolute;
			display: inline-block;
			left: 3px;
			top: 128px;
			font-size: 9px;
			padding: 3px 6px 3px;
			font-weight: 800;
			line-height: 1;
			letter-spacing: 0.2px;
			color: #4A2328;
			background: linear-gradient(180deg, #FFFFFF 0%, #F3D9D3 100%);
			border-radius: 999px;
			box-shadow: 0 2px 0 #B8475A;
			animation: pop 1.4s ease-in-out infinite;
			z-index: 2;
		}

		@keyframes pop {

			0%,
			100% {
				transform: rotate(-8deg) scale(1);
			}

			50% {
				transform: rotate(-8deg) scale(1.12);
			}
		}

		/* 컨페티 (위에서 떨어지는 색종이) */
		.confetti {
			position: absolute;
			inset: 0;
			overflow: hidden;
			pointer-events: none;
			z-index: 3;
		}

		.cf {
			position: absolute;
			top: 0;
			width: 4px;
			height: 7px;
			opacity: 0.9;
			background: #FFFFFF;
			border-radius: 2px;
			animation: cfFall 3.2s linear infinite;
		}

		.cf:nth-child(even) {
			background: #C98A7A;
		}

		@keyframes cfFall {
			0% {
				transform: translateY(-30px) rotate(0deg);
			}

			100% {
				transform: translateY(180px) rotate(540deg);
			}
		}

		/* 가격 옆 화살표 */
		.arrow {
			flex-shrink: 0;
			margin-top: 2px;
			animation: nudge 0.9s ease-in-out infinite;
		}

		@keyframes nudge {

			0%,
			100% {
				transform: translateX(0);
			}

			50% {
				transform: translateX(3px);
			}
		}

		.mobon_banner_wrap {
			display: flex;
			gap: 8px;
			width: 100%;
			height: 100%;
			background: linear-gradient(100deg, #FBE4DF 0%, #F6CFC6 60%, #F0BFB4 100%);
			padding: 10px 8px 10px 10px;
		}

		.mobon_banner {
			display: flex;
			gap: 8px;
			flex-grow: 1;
			min-width: 0;
			cursor: pointer;
		}

		.img_wrap {
			flex-shrink: 0;
			align-self: center;
			width: 116px;
			height: 130px;
			border: 4px solid #F1F1F1;
			border-radius: 14px;
			background-color: #EDEFF2;
			box-shadow: 0 5px 10px rgba(0, 0, 0, 0.25);
			animation: wiggle 2.4s ease-in-out infinite;
			overflow: hidden;
		}

		.img {
			display: block;
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.bg {
			display: flex;
			flex-direction: column;
			flex-grow: 1;
			min-width: 0;
			padding-left: 20px;
		}

		.shop_logo {
			height: 28px;
		}

		.shop_logo img {
			max-width: 130px;
			height: 100%;
			object-fit: contain;
			object-position: left center;
		}

		.pnm {
			font-size: 15px;
			font-weight: 600;
			line-height: 1.2;
			letter-spacing: -0.4px;
			color: #4A2328;
			white-space: nowrap;
			text-overflow: ellipsis;
			overflow: hidden;
			margin-top: 1px;
		}

		.price_box {
			display: flex;
			align-items: center;
			gap: 3px;
			margin-top: 5px;
		}

		/* 최종구매가 확인 알약(pill) */
		.sale_price {
			position: relative;
			display: flex;
			align-items: baseline;
			font-size: 13px;
			font-weight: 600;
			letter-spacing: -0.3px;
			line-height: 1;
			color: #ffffff;
			border-radius: 999px;
			background: linear-gradient(180deg, #C85A6E 0%, #8E2A40 100%);
			box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.22), 0 2px 0 #4A2328;
			padding: 4px 9px 4px;
			white-space: nowrap;
			transform-origin: center bottom;
			animation: squish 3.2s ease-in-out infinite;
		}

		/* 젤리처럼 눌렸다 튀어오르는 가격 알약 */
		@keyframes squish {

			0%,
			78%,
			100% {
				transform: scale(1);
			}

			84% {
				transform: scale(1.12, 0.86);
			}

			90% {
				transform: scale(0.94, 1.08);
			}

			95% {
				transform: scale(1.03, 0.97);
			}
		}

		.sale_price::after {
			content: "";
			position: absolute;
			left: 8px;
			top: 2px;
			width: 16px;
			height: 4px;
			border-radius: 999px;
			background: rgba(255, 255, 255, 0.45);
		}

		.badge {
			position: absolute;
			left: 105px;
			top: 8px;
			flex-shrink: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			width: 42px;
			height: 42px;
			color: #4A2328;
			border-radius: 50%;
			overflow: hidden;
			background: radial-gradient(circle at 35% 30%, #F6D5C8 0%, #D29B88 55%, #9C5F4C 100%);
			box-shadow: inset 0 -3px 4px rgba(0, 0, 0, 0.25), 0 0 0 2.5px #FFFFFF, 0 0 0 3.5px #B8475A, 0 4px 8px rgba(0, 0, 0, 0.22);
			animation: bounce 1.3s ease-in-out infinite;
			z-index: 2;
		}

		.badge::after {
			content: "";
			position: absolute;
			left: 7px;
			top: 5px;
			width: 9px;
			height: 4px;
			border-radius: 50%;
			background: rgba(255, 255, 255, 0.7);
			transform: rotate(-25deg);
			opacity: 0.5;
		}

		/* 배지를 훑고 지나가는 샤인 */
		.badge::before {
			content: "";
			position: absolute;
			top: -20%;
			bottom: -20%;
			left: -70%;
			width: 20%;
			background: linear-gradient(100deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.85) 50%, rgba(255, 255, 255, 0) 100%);
			transform: skewX(-20deg);
			animation: badge_shine 2.4s ease-in-out infinite;
			z-index: 1;
		}

		@keyframes badge_shine {

			0%,
			55% {
				left: -70%;
			}

			100% {
				left: 140%;
			}
		}

		.badge_txt,
		.sale_rate {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 1px;
		}

		.badge em {
			font-style: normal;
			font-size: 11px;
			font-weight: 800;
			line-height: 1;
			letter-spacing: -0.3px;
		}

		.badge strong {
			font-size: 12px;
			font-weight: 800;
			line-height: 1;
			letter-spacing: -0.3px;
		}

		/* 할인 상품: .badge에 .sale 추가 시 "구매 찬스" 대신 "비밀특가" 노출 */
		.sale_rate {
			display: none;
		}

		.badge.sale .badge_txt {
			display: none;
		}

		.badge.sale .sale_rate {
			display: flex;
		}


		.thumb_wrap {
			flex-shrink: 0;
			display: grid;
			grid-template-columns: repeat(3, 50px);
			grid-auto-rows: 50px;
			justify-content: end;
			gap: 4px;
			position: absolute;
			right: 8px;
			bottom: 10px;
			width: 158px;
		}

		.thumb {
			border: 2px solid #FFFFFF;
			border-radius: 10px;
			background-color: #F3D9D3;
			box-shadow: 0 4px 10px rgba(120, 50, 50, 0.16);
			overflow: hidden;
			cursor: pointer;
		}

		/* 현재 노출 중인 메인 상품(1번) 썸네일 강조 */
		.thumb.active {
			border-color: #B8475A;
			box-shadow: 0 0 0 2px rgba(184, 71, 90, 0.2), 0 4px 12px rgba(120, 50, 50, 0.25);
			animation: wiggle 2.4s ease-in-out infinite;
		}

		@keyframes bounce {

			0%,
			100% {
				transform: translateY(0) rotate(-10deg) scale(1);
			}

			40% {
				transform: translateY(-5px) rotate(-6deg) scale(1.06, .94);
			}

			60% {
				transform: translateY(0) rotate(-10deg) scale(.94, 1.06);
			}
		}

		@keyframes wiggle {

			0%,
			100% {
				transform: rotate(3deg);
			}

			50% {
				transform: rotate(-1deg);
			}
		}
	</style>
</head>

<body>
	<div class="mobon_reset">
		<div class="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
		<div class="mobon_banner_wrap">

			<!-- 메인 상품 -->
			<div class="mobon_banner" data-purl="javascript:void(0)">
				<div class="img_wrap">
					<img class="img" src="https://cafe24img.poxo.com/dabainsang/web/product/small/202607/e623213db5bca94aa297685e252f0857.webp" alt="코튼 벨티드 원피스">
				</div>
				<div class="bg">
					<div class="shop_logo">
						<img src="https://manage.mobon.net/ad/imgfile//20240125140913-H2Gm0AL5jB-logo.png" alt="로고">
					</div>
					<p class="pnm">코튼 벨티드 원피스</p>
					<!-- 최종구매가 확인 (고정 문구) -->
					<div class="price_box">
						<div class="sale_price">최종구매가 확인</div>
						<svg class="arrow" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
							<path d="M5 5l7 7-7 7" fill="none" stroke="#4A2328" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"></path>
							<path d="M5 5l7 7-7 7" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
							<path d="M12 5l7 7-7 7" fill="none" stroke="#4A2328" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"></path>
							<path d="M12 5l7 7-7 7" fill="none" stroke="#B8475A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
						</svg>
					</div>
				</div>
				<!-- 배지: 기본 "구매 찬스", .sale 추가 시 "비밀특가" -->
				<div class="badge sale">
					<span class="badge_txt"><em>구매</em><strong>찬스</strong></span>
					<span class="sale_rate"><em>비밀</em><strong>특가</strong></span>
				</div>
				<span class="tag_hot">HOT</span>
			</div>

			<!-- 썸네일 리스트 (1번 = 메인 상품) -->
			<div class="thumb_wrap">
				<div class="thumb active"
					data-purl="javascript:void(0)" data-pnm="코튼 벨티드 원피스" data-box="sale">
					<img class="img" src="https://cafe24img.poxo.com/dabainsang/web/product/small/202607/e623213db5bca94aa297685e252f0857.webp" alt="코튼 벨티드 원피스">
				</div>
				<div class="thumb"
					data-purl="javascript:void(0)" data-pnm="베이직 라운드 반팔 티셔츠" data-box="sale">
					<img class="img" src="https://cafe24img.poxo.com/dabainsang/web/product/small/202607/34d5572c55d7962dc09e3688c031d90e.jpg" alt="베이직 라운드 반팔 티셔츠">
				</div>
				<div class="thumb"
					data-purl="javascript:void(0)" data-pnm="와이드 핏 데님 팬츠" data-box="">
					<img class="img" src="https://cafe24img.poxo.com/dabainsang/web/product/small/202607/228785c2d74d7238046842d7afaab05b.webp" alt="와이드 핏 데님 팬츠">
				</div>
			</div>

		</div>
		<div class="confetti" aria-hidden="true">
			<span class="cf" style="left: 13px; animation-delay: 0s; animation-duration: 2.6s"></span>
			<span class="cf" style="left: 56px; animation-delay: 0.7s; animation-duration: 2.9s"></span>
			<span class="cf" style="left: 100px; animation-delay: 1.4s; animation-duration: 3.2s"></span>
			<span class="cf" style="left: 125px; animation-delay: 2.1s; animation-duration: 3.5s"></span>
			<span class="cf" style="left: 169px; animation-delay: 2.8s; animation-duration: 2.6s"></span>
			<span class="cf" style="left: 212px; animation-delay: 0.3s; animation-duration: 2.9s"></span>
			<span class="cf" style="left: 238px; animation-delay: 1s; animation-duration: 3.2s"></span>
			<span class="cf" style="left: 281px; animation-delay: 1.7s; animation-duration: 3.5s"></span>
		</div>
	</div>
	<!-- 썸네일 호버 시 메인 상품(이미지·상품명·배지·링크) 전환 + 2초 자동 롤링 -->
	<script>
		(() => {
			const reset = document.querySelector('.mobon_reset');
			const banner = document.querySelector('.mobon_banner');
			const mainImg = banner.querySelector('.img');
			const pnmEl = banner.querySelector('.pnm');
			const badgeEl = banner.querySelector('.badge');
			const thumbs = Array.from(document.querySelectorAll('.thumb'));
			let current = 0;
			let timer = null;

			const showProduct = (index) => {
				const thumb = thumbs[index];
				if (!thumb) return;
				current = index;
				const data = thumb.dataset;
				const thumbImg = thumb.querySelector('.img');

				thumbs.forEach(t => t.classList.remove('active'));
				thumb.classList.add('active');

				if (mainImg && thumbImg) {
					mainImg.src = thumbImg.src;
					mainImg.alt = thumbImg.alt;
					mainImg.dataset.pcode = thumbImg.dataset.pcode || '';
				}
				if (pnmEl) pnmEl.textContent = data.pnm;

				// 비밀특가 여부에 따라 .badge 의 .sale 전환 (구매 찬스 <-> 비밀특가)
				const isSale = data.box === 'sale';
				if (badgeEl) badgeEl.classList.toggle('sale', isSale);

				banner.dataset.purl = data.purl;
			};

			// 2초마다 다음 상품, 배너 위에 마우스가 있으면 멈춤
			const stop = () => {
				if (timer) clearInterval(timer);
				timer = null;
			};
			const start = () => {
				stop();
				if (thumbs.length <= 1) return;
				timer = setInterval(() => showProduct((current + 1) % thumbs.length), 2000);
			};

			thumbs.forEach((thumb, index) => {
				thumb.addEventListener('mouseenter', () => showProduct(index));
			});
			reset.addEventListener('mouseenter', stop);
			reset.addEventListener('mouseleave', start);

			start();
		})();
	</script>
</body>

</html>
