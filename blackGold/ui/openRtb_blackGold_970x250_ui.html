<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>구글RTB 배너</title>
	<style>
		/* 1. 웹 폰트 */
		@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");

		/* 2. 배너 & 이미지 규격 */
		:root {
			--width: 970px;
			--height: 250px;
		}

		/* 3. 공통사항 */
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		.mobonLogo {
			position: absolute;
			top: 2px;
			right: 2px;
			width: 11px;
			height: 11px;
			background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo02.png') center center;
			background-size: 11px 11px;
			opacity: 0.8;
			z-index: 1001;
			cursor: pointer;
		}

		.mobonLogo:hover {
			width: 73px;
			height: 15px;
			background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo_over02.png') center center;
			background-size: 73px 15px;
		}

		/* 4. 해당 사이즈 배너 */
		.mobon_reset {
			position: relative;
			display: flex;
			width: var(--width);
			height: var(--height);
			font-family: "pretendard";
			overflow: hidden;
		}

		.shop_logo {
			display: flex;
			justify-content: center;
			align-items: center;
			width: 150px;
			background-color: #fff;
			padding: 10px 16px;
			cursor: pointer;
		}

		.shop_logo img {
			max-width: 100%;
			height: auto;
		}

		.mobon_banner_wrap {
			display: flex;
			flex: 1;
			column-gap: 14px;
			background-color: #121214;
			padding: 10px;
		}

		.mobon_banner {
			position: relative;
			display: flex;
			flex-direction: column;
			flex: 1;
			height: 100%;
			overflow: hidden;
			border-radius: 2px;
			padding-bottom: 40px;
			cursor: pointer;
		}

		.img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.bg {
			position: absolute;
			bottom: 0;
			left: 0;
			right: 0;
			display: flex;
			flex-direction: column;
			justify-content: flex-end;
			background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.8) 60%, rgba(0, 0, 0, 0) 100%);
			z-index: 1;
			padding: 14px 10px 10px;
		}

		.pnm {
			min-width: 0;
			font-size: 12px;
			font-weight: 500;
			letter-spacing: -0.24px;
			color: #d8d4cd;
			white-space: nowrap;
			text-overflow: ellipsis;
			overflow: hidden;
		}

		.price_box {
			display: flex;
			align-items: baseline;
			column-gap: 5px;
			margin-top: 6px;
		}

		.sale .sale_rate,
		.sale .sale_price {
			display: block;
		}

		.sale .original_price {
			font-size: 9px;
			font-weight: 500;
			color: #7d7871;
			text-decoration: line-through;
		}

		.sale_rate {
			display: none;
			font-size: 13px;
			font-weight: bold;
			letter-spacing: -0.5px;
			color: #e8c66a;
		}

		.sale_rate span {
			font-size: 9px;
		}

		.sale_price {
			display: none;
			font-size: 14px;
			letter-spacing: -0.6px;
			font-weight: bold;
			color: #ffffff;
		}

		.original_price {
			font-size: 14px;
			letter-spacing: -0.6px;
			font-weight: bold;
			color: #ffffff;
			text-decoration: none;
		}

		.shop_btn {
			position: relative;
			width: 100%;
			height: 28px;
			font-family: inherit;
			font-size: 11px;
			font-weight: 500;
			color: #f0e2b8;
			border: 1px solid #e8c66a;
			background-color: #0d0d0f;
			margin-top: 6px;
			overflow: hidden;
			cursor: pointer;
		}

		.shop_btn::after {
			content: "";
			position: absolute;
			top: 0;
			bottom: 0;
			left: -40px;
			width: 30px;
			pointer-events: none;
			background: linear-gradient(100deg,
					rgba(255, 255, 255, 0) 0%,
					rgba(255, 255, 255, 0.28) 50%,
					rgba(255, 255, 255, 0) 100%);
			animation: shine 2.8s ease-in-out infinite;
		}

		@keyframes shine {
			0% {
				left: -40px;
			}

			55%,
			100% {
				left: 100%;
			}
		}
	</style>
</head>
